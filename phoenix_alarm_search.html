<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PHOENIX Alarm Search · Vantive</title>
<style>
:root{
  --nav-h:64px;
  --plum:#72256B;--plum-d:#58184F;--sage:#CDDFD7;--bg:#F6F0EA;--plum-light:rgba(114,37,107,0.09);
  --cream:#FFFAEB;
  --pine:#105742;--pine-light:rgba(16,87,66,0.10);
  --euca:#6CA07A;--euca-light:rgba(108,160,122,0.12);
  --amber:#986A24;--amber-light:rgba(176,125,46,0.12);
  --danger:#AE4048;--danger-light:rgba(174,64,72,0.10);
  --blue:#1A5276;--blue-light:rgba(26,82,118,0.10);
  --teal:#0D7377;--teal-light:rgba(13,115,119,0.10);
  --slate:#5D6D7E;--slate-light:rgba(93,109,126,0.10);
  --rose:#AE4048;--rose-light:rgba(174,64,72,0.07);
  --white:#FFFFFF;--text:#1B1219;--text2:#6B5468;--text3:#9B879A;
  --border:rgba(114,37,107,0.12);--border-p:rgba(114,37,107,0.14);
  --shadow:0 2px 14px rgba(0,0,0,0.06);--r:14px;--r-xs:5px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + max(env(safe-area-inset-bottom,0px),10px));}

/* ── Header ── */
.hdr{background:linear-gradient(90deg,#58184F 0%,#72256B 26%,#105742 62%,#6CA07A 100%);
  border-bottom:1px solid rgba(255,255,255,0.15);box-shadow:0 2px 16px rgba(88,24,79,0.25);
  padding:calc(16px + env(safe-area-inset-top,0px)) 18px 0;
  position:sticky;top:0;z-index:200;overflow:hidden;}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;position:relative;z-index:2;}
.wmark-wrap{display:flex;flex-direction:column;gap:4px;}
.tagline{font-size:13.5px;font-weight:700;color:rgba(255,250,235,0.55);letter-spacing:1.8px;text-transform:uppercase;}
.total-badge{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.32);
  color:#fff;font-size:11px;font-weight:700;padding:5px 13px;border-radius:20px;flex-shrink:0;margin-top:2px;}
.s-wrap{position:relative;margin-bottom:10px;z-index:2;}
.s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;}
.s-inp{width:100%;padding:12px 42px 12px 44px;background:rgba(255,250,235,0.13);
  border:1.5px solid rgba(255,250,235,0.22);border-radius:12px;font-size:14px;
  color:var(--cream);outline:none;font-family:inherit;transition:background .18s,border-color .18s;}
.s-inp:focus{background:rgba(255,250,235,0.22);border-color:rgba(255,250,235,0.45);}
.s-inp::placeholder{color:rgba(255,250,235,0.62);}
.s-clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:rgba(255,250,235,0.22);border:none;border-radius:50%;
  width:22px;height:22px;font-size:12px;cursor:pointer;color:var(--cream);
  font-weight:700;display:none;line-height:22px;text-align:center;}
.s-clr.show{display:block;}
.s-hint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:12px;
  font-size:11px;color:rgba(255,250,235,0.58);position:relative;z-index:2;}
.h-ex{background:rgba(255,250,235,0.14);border:1px solid rgba(255,250,235,0.18);
  color:rgba(255,250,235,0.9);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;}

/* ── Filters ── */
.filt{background:var(--bg);padding:12px 18px;border-bottom:1px solid var(--border);}
.flbl{font-size:9.5px;font-weight:800;color:var(--pine);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:7px;}
.seg-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.seg-row::-webkit-scrollbar{display:none;}
.seg{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;
  cursor:pointer;user-select:none;white-space:nowrap;background:rgba(114,37,107,0.06);color:var(--text2);
  border:1.5px solid transparent;transition:all .15s ease;font-family:inherit;display:inline-flex;align-items:center;}
.seg.on{background:var(--plum);color:#fff;border-color:var(--plum);}
.seg:active{transform:scale(0.95);}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;flex-shrink:0;}
.frow{margin-bottom:10px;}.frow:last-child{margin-bottom:0;}

/* ── Status bar ── */
.sbar{padding:8px 18px 6px;font-size:12px;color:var(--text2);background:var(--bg);}
.sbar b{color:var(--plum);font-weight:700;}

/* ── Cards ── */
.cards{padding:8px 14px 32px;display:flex;flex-direction:column;gap:9px;}
.card{background:var(--white);border-radius:var(--r);
  box-shadow:0 2px 14px rgba(0,0,0,0.06);border:1px solid var(--border);overflow:hidden;}
.chead{display:flex;align-items:flex-start;gap:10px;padding:13px 13px 11px;cursor:pointer;}
.abadge{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:3px 7px;
  border-radius:var(--r-xs);font-size:11px;font-weight:800;white-space:nowrap;flex-shrink:0;
  margin-top:2px;font-family:monospace;background:var(--plum-light);color:var(--plum);border:1px solid var(--border-p);}

/* Class badges */
.cbadge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;}
.cls-p  {background:var(--danger-light);color:var(--danger);}
.cls-pd {background:rgba(192,57,43,0.07);color:#A93226;border:1px solid rgba(192,57,43,0.15);}
.cls-a  {background:var(--amber-light);color:var(--amber);}
.cls-b  {background:var(--plum-light);color:var(--plum);}
.cls-c  {background:rgba(180,100,0,0.10);color:#874D00;}
.cls-d  {background:var(--blue-light);color:var(--blue);}
.cls-e  {background:var(--slate-light);color:var(--slate);}
.cls-w  {background:var(--pine-light);color:var(--pine);}
.cls-sp {background:rgba(0,0,0,0.05);color:var(--text3);}

/* Override badges */
.obadge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.ovr-yes  {background:var(--pine-light);color:var(--pine);}
.ovr-yesr {background:var(--amber-light);color:var(--amber);}
.ovr-no   {background:rgba(0,0,0,0.05);color:var(--text3);}
.ovr-cond {background:var(--teal-light);color:var(--teal);}

/* Attribute tags */
.attr-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.attr-tag{background:var(--euca-light);color:var(--pine);border:1px solid rgba(108,160,122,0.2);
  border-radius:4px;font-size:10px;font-weight:600;padding:1px 6px;}

.cbody{flex:1;min-width:0;}
.ctitle{font-size:13.5px;font-weight:700;line-height:1.45;margin-bottom:6px;color:var(--text);}
.cmeta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.chev{color:var(--text3);flex-shrink:0;margin-top:2px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.04);border-radius:50%;
  transition:transform .25s ease,background .15s,color .15s;}
.chev.open{transform:rotate(180deg);background:var(--plum-light);color:var(--plum);}
.cdet{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);}
.cdet.open{max-height:3000px;border-top:1px solid var(--border);}
.cdet-in{padding:15px 13px 18px;background:rgba(255,250,235,0.5);}
.dsec{margin-bottom:13px;}.dsec:last-child{margin-bottom:0;}
.dlbl{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;color:var(--pine);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:7px;}
.dbox,.abox,.sbox{font-size:13.5px;line-height:1.75;border-radius:10px;padding:11px 13px;}
.dbox{color:var(--text);background:var(--white);border:1px solid var(--border);}
.abox{color:#7a4800;background:var(--amber-light);border:1px solid rgba(212,112,10,0.2);}
.sbox{color:var(--pine);font-weight:500;background:var(--euca-light);border:1px solid rgba(108,160,122,0.25);}
.dbox ul,.abox ul,.sbox ul{list-style:none;padding:0;}
.dbox li,.abox li,.sbox li{padding:2px 0 2px 14px;position:relative;}
.dbox li::before,.abox li::before,.sbox li::before{content:"·";position:absolute;left:4px;color:var(--text3);}
mark{background:rgba(114,37,107,0.13);color:var(--plum);border-radius:2px;padding:0 1px;}
.empty{text-align:center;padding:60px 24px;color:var(--text2);display:none;}
.empty-ico{font-size:46px;margin-bottom:12px;opacity:.4;}
.empty h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.empty p{font-size:13px;}

/* ── Bottom Navigation ── */
.bnav{position:fixed;bottom:0;left:0;right:0;min-height:var(--nav-h);
  background:var(--sage);border-top:1.5px solid rgba(114,37,107,0.18);
  display:flex;align-items:flex-start;padding-top:10px;
  padding-bottom:max(env(safe-area-inset-bottom,0px),10px);z-index:200;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:3px 4px;cursor:pointer;border:none;background:none;
  font-family:inherit;-webkit-tap-highlight-color:transparent;}
.bnav-svg{width:24px;height:24px;color:rgba(114,37,107,0.4);
  transition:color .15s,transform .18s cubic-bezier(.34,1.56,.64,1);}
.bnav-label{font-size:10px;font-weight:600;color:rgba(114,37,107,0.5);font-family:inherit;}
.bnav-item.on .bnav-svg{color:var(--plum);transform:scale(1.12);}
.bnav-item.on .bnav-label{color:var(--plum);font-weight:800;}
.bnav-item:active .bnav-svg{transform:scale(0.88);}

/* ── Tab Panels ── */
.tab-panel{display:none;}
.tab-panel.on{display:block;}

/* ── Alarm Code List ── */
.alarm-panel-inner{padding:0 12px;}
.ag{margin-bottom:18px;}
.ag-header{display:flex;align-items:center;gap:8px;margin:14px 0 6px;}
.ag-cnt{font-size:11px;color:var(--text3);font-weight:600;}
.ag-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
.ag-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;cursor:pointer;gap:8px;
  border-bottom:1px solid var(--border);transition:background .12s;}
.ag-row:last-child{border-bottom:none;}
.ag-row:active{background:var(--plum-light);}
.ag-code{font-size:12px;font-weight:700;color:var(--plum);font-family:monospace;min-width:40px;}
.ag-name{font-size:12px;color:var(--text);flex:1;}
.ag-arr{font-size:16px;color:var(--text3);}

/* ── Class Guide ── */
.guide-panel-inner{padding:12px;}
.guide-card{background:var(--white);border-radius:var(--r);
  box-shadow:var(--shadow);border:1px solid var(--border);
  overflow:hidden;margin-bottom:10px;}
.guide-head{padding:14px 16px;display:flex;align-items:center;gap:12px;}
.guide-cls-badge{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:900;flex-shrink:0;}
.guide-title{font-size:14px;font-weight:700;color:var(--text);}
.guide-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.guide-body{padding:0 16px 14px;font-size:13px;color:var(--text2);line-height:1.65;}

/* ── Troubleshooting Detail Sections ── */
.ts-sec{margin-bottom:14px;}
.ts-sec:last-child{margin-bottom:0;}
.ts-lbl{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;
  letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px;}
.ts-lbl.lbl-reason{color:var(--plum);}
.ts-lbl.lbl-machine{color:var(--blue);}
.ts-lbl.lbl-op{color:var(--amber);}
.ts-lbl.lbl-sv{color:var(--pine);}
.ts-reason{font-size:13px;line-height:1.7;color:var(--text);
  background:var(--white);border:1px solid var(--border);
  border-radius:10px;padding:11px 13px;}
.ts-machine{font-size:13px;line-height:1.7;color:var(--blue);
  background:var(--blue-light);border:1px solid rgba(26,82,118,0.18);
  border-radius:10px;padding:11px 13px;}
.ts-table{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--white);}
.ts-thead{display:grid;grid-template-columns:1fr 1fr;
  font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
.ts-thead .ts-th-op{padding:7px 11px;background:rgba(212,112,10,0.12);color:var(--amber);
  border-right:1px solid var(--border);}
.ts-thead .ts-th-sv{padding:7px 11px;background:rgba(16,87,66,0.10);color:var(--pine);}
.ts-pairs{display:flex;flex-direction:column;}
.ts-pair{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);}
.ts-pair:first-child{border-top:1px solid var(--border);}
.ts-cause{padding:9px 11px;font-size:12px;line-height:1.6;color:#7a4800;
  background:rgba(212,112,10,0.05);border-right:1px solid var(--border);}
.ts-action{padding:9px 11px;font-size:12px;line-height:1.6;color:var(--pine);
  background:rgba(16,87,66,0.04);}
.ts-num{display:inline-block;min-width:16px;font-size:10px;font-weight:800;
  color:var(--text3);margin-right:4px;}
.ts-no-data{font-size:12px;color:var(--text3);font-style:italic;padding:8px 11px;}

.ts-pair-header{display:grid;grid-template-columns:1fr 1fr;margin-bottom:5px;gap:0;}
.ts-cause-sv{background:rgba(16,87,66,0.06)!important;color:var(--pine)!important;border-left:1px solid var(--border)!important;border-right:none!important;}
.ts-pair-action{background:rgba(255,255,255,0.8);}
.ts-action-op{font-style:italic;color:var(--amber)!important;font-size:11.5px!important;}
.ts-action-sv{font-style:italic;color:var(--pine)!important;font-size:11.5px!important;border-left:1px solid var(--border);}
.ts-th-sv{padding:7px 11px;background:rgba(16,87,66,0.10);color:var(--pine);}

/* ── Language toggle (EN / 한글) ── */
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.lang-sw{display:inline-flex;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.32);
  border-radius:20px;padding:2px;}
.lang-btn{border:none;background:none;color:rgba(255,255,255,0.95);font-family:inherit;
  font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:16px;cursor:pointer;line-height:1;}
.lang-btn.on{background:var(--cream);color:var(--plum);}
.ctitle-ko{font-size:12.5px;font-weight:600;color:var(--text2);margin:-3px 0 6px;line-height:1.4;}
.ag-name-ko{display:block;font-size:11.5px;color:var(--text3);font-weight:500;margin-top:1px;}
.ko-note{font-size:11px;color:var(--text3);margin:0 0 10px;line-height:1.5;}
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="hdr">
  <div class="hdr-top">
    <div class="wmark-wrap">
      <span class="tagline">PHOENIX · Service Manual</span>
      <span style="font-size:18px;font-weight:900;color:var(--cream);letter-spacing:0.5px;" data-i18n="title">Alarm Search</span>
    </div>
    <div class="hdr-right">
      <div class="lang-sw" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" data-lang="ko" onclick="setLang('ko')">한글</button>
      </div>
      <span class="total-badge" id="totalBadge">— alarms</span>
    </div>
  </div>
  <div class="s-wrap">
    <svg class="s-ico" width="18" height="18" viewBox="0 0 24 24" fill="none"
      stroke="rgba(255,250,235,0.6)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="sInp" class="s-inp" type="search"
      placeholder="Search alarm message, code, attribute…"
      autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="s-clr" id="sClr" aria-label="Clear">✕</button>
  </div>
  <div class="s-hint">
    <span data-i18n="try">Try:</span>
    <span class="h-ex">blood</span>
    <span class="h-ex">conductivity</span>
    <span class="h-ex">28</span>
    <span class="h-ex">pressure</span>
  </div>
</div>

<!-- ── Filters ── -->
<div class="filt" id="filtEl">
  <div class="frow">
    <div class="flbl" data-i18n="fClass">Class</div>
    <div class="seg-row" id="clsRow">
      <button class="seg on" data-v="all"><span class="sdot" style="background:#999;"></span><span data-i18n="all">All</span></button>
      <button class="seg" data-v="p" ><span class="sdot" style="background:var(--danger);"></span><span data-i18n="segP">P — Patient</span></button>
      <button class="seg" data-v="pd"><span class="sdot" style="background:#A93226;"></span><span data-i18n="segPd">Pd — Data Err</span></button>
      <button class="seg" data-v="a" ><span class="sdot" style="background:var(--amber);"></span><span data-i18n="segA">A — Attention</span></button>
      <button class="seg" data-v="b" ><span class="sdot" style="background:var(--plum);"></span><span data-i18n="segB">B — Bypass</span></button>
      <button class="seg" data-v="c" ><span class="sdot" style="background:#874D00;"></span><span data-i18n="segC">C — Caution</span></button>
      <button class="seg" data-v="d" ><span class="sdot" style="background:var(--blue);"></span><span data-i18n="segD">D — Device</span></button>
      <button class="seg" data-v="e" ><span class="sdot" style="background:var(--slate);"></span><span data-i18n="segE">E — Equipment</span></button>
      <button class="seg" data-v="w" ><span class="sdot" style="background:var(--pine);"></span><span data-i18n="segW">W — Warning</span></button>
    </div>
  </div>
  <div class="frow">
    <div class="flbl" data-i18n="fOvr">Override</div>
    <div class="seg-row" id="ovrRow">
      <button class="seg on" data-v="all" data-i18n="all">All</button>
      <button class="seg" data-v="yes">YES</button>
      <button class="seg" data-v="yes-r" data-i18n="segYesR">YES [R] — Reset</button>
      <button class="seg" data-v="no">NO</button>
    </div>
  </div>
</div>

<!-- ── Status bar ── -->
<div class="sbar" id="sbarEl">Showing all alarms</div>

<!-- ── Cards ── -->
<div class="cards" id="cardsEl"></div>
<div class="empty" id="emptyEl">
  <div class="empty-ico">🔍</div>
  <h3 data-i18n="emptyH">No alarms found</h3>
  <p data-i18n="emptyP">Try a different search term or clear the filters.</p>
</div>

<!-- ── Alarm Code List Tab ── -->
<div class="tab-panel" id="alarmPanel">
  <div class="alarm-panel-inner" id="alarmPanelInner"></div>
</div>

<!-- ── Class Guide Tab ── -->
<div class="tab-panel" id="guidePanel">
  <div class="guide-panel-inner" id="guidePanelInner"></div>
</div>

<!-- ── Bottom Navigation ── -->
<nav class="bnav">
  <button class="bnav-item on" onclick="switchBnav('search',this)">
    <svg class="bnav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <span class="bnav-label" data-i18n="navSearch">Search</span>
  </button>
  <button class="bnav-item" onclick="switchBnav('alarm',this)">
    <svg class="bnav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="bnav-label" data-i18n="navClass">By Class</span>
  </button>
  <button class="bnav-item" onclick="switchBnav('guide',this)">
    <svg class="bnav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>

  10:{"r":"Minimum: 혈액펌프 실제 유량이 설정값 또는 허용 최소값보다 낮음. Maximum: 혈액펌프 실제 유량이 설정값 또는 허용 최대값보다 높음. Undefined: 혈액펌프 엔코더 또는 로터 위치 센서 판독 오류. Line Pres: 정맥 라인이 기포감지기 하우징에 삽입되지 않음. 장비 동작: 혈액펌프 정지, 정맥라인 클램프 닫힘, 한외여과(UF) 펌프 최소값으로 감소.","m":"","oc":["혈액펌프 속도가 설정값과 다름.","정맥 라인이 기포감지기 하우징에 삽입되지 않음.","UNDEFINED","LINE PRES — Minimum: 혈액펌프 실제 유량이 설정값보다 낮음. Maximum: 혈액펌프 실제 유량이 설정값보다 높음. Undefined: 센서 판독 오류. Line Pres: 정맥 라인이 삽입되지 않음. 장비 동작: 혈액펌프 정지, 정맥라인 클램프 닫힘, 한외여과(UF) 펌프 감소."],"oa":["","","",""],"sc":["ABD 홀더 내부 스위치가 정맥 라인을 감지하지 못함.","혈액펌프 엔코더 신호 이상.","혈액펌프 엔코더 불량.","펌프 실제 유량이 설정값보다 낮거나 높음.","로터 위치 센서(왼쪽 도어와 혈액 모터 사이의 홀 센서) 중 하나가 손상됨.","혈액펌프 보드·마더보드·블러드 슬레이브 보드·프로텍티브 보드 간 연결 불량."],"sa":["스위치 정상 동작 확인: 저항계로 상태 점검 — 정맥 라인이 ABD 하우징에 삽입되면 스위치 닫힘, 삽입되지 않으면 열림. 2. 혈액펌프 엔코더 관련 모든 연결부가 단단히 체결되었는지 확인. 필요 시 수리 또는 교체.","","혈액펌프 엔코더 또는 혈액펌프 어셈블리 교체 후 재시험.","다음을 확인: • 설정값 300 ml/min 미만: 실제 유량 오차가 더블 니들 ±10%, 싱글 니들 ±30% 이내 • 설정값 300 ml/min 이상: 실제 유량 오차가 더블 니들 ±30 ml/min, 싱글 니들 ±105 ml/min 이내. 범위를 벗어나면 혈액펌프 또는 블러드 슬레이브 보드를 수리·교체.","센서 또는 연결부 손상 여부 확인. 필요 시 수리 또는 교체.","필요에 따라 청소, 수리 또는 교체."]},

  12:{"r":"혈액펌프 보드 신호. 장비 동작: 혈액펌프 정지, 한외여과(UF) 펌프 속도 최소값으로 감소.","m":"","oc":["카트리지 혈액세트 펌프 세그먼트가 혈액펌프 로터에 끼임.","혈액펌프 로터가 걸림."],"oa":["카트리지 장착 위치 확인. OVERRIDE를 눌러 혈액펌프 재시작.","혈액펌프 로터에 막힘이 없는지 확인. OVERRIDE를 눌러 혈액펌프 재시작."],"sc":["혈액펌프 보드 불량.","로터 반회전을 감지하는 홀 센서(APP 신호) 불량.","혈액펌프 보드 또는 홀 센서 배선 불량.","혈액펌프 보드·마더보드·블러드 슬레이브 보드 간 연결 불량.","블러드 슬레이브 보드 불량."],"sa":["혈액펌프 보드 교체.","홀 센서 교체 후 재시험.","배선 확인. 필요 시 청소, 수리 또는 교체.","연결부 확인. 필요 시 청소, 수리 또는 교체.","블러드 슬레이브 보드 교체."]},
  13:{"r":"장비가 카트리지 혈액세트를 감지하지 못함. 장비 동작: 없음.","m":"","oc":["정맥 및 동맥 라인이 올바른 위치에 있지 않음.","혈액펌프 로터가 걸림."],"oa":["카트리지 위치 확인. 동맥 라인은 동맥라인 클램프(있는 경우)에, 정맥 라인은 기포감지기와 정맥라인 클램프에 장착. OVERRIDE를 눌러 알람 해제.","혈액펌프 로터에 막힘이 없는지 확인. 로터를 수동으로 수평 위치에 맞춤. OVERRIDE를 눌러 알람 해제."],"sc":["로터 위치 센서 불량.","로터 자석이 없거나 거꾸로 장착됨.","엔코더 배선 불량.","로터 위치 센서와 마더보드 또는 블러드 보드 간 연결 불량.","카트리지 혈액세트는 올바른 위치에 있으나, 라인 감지 스위치(환자 센서 스위치 및 정맥 라인 위치 스위치) 고장으로 장비가 혈액펌프 로터 위치를 맞추려 함.","혈액펌프 불량.","블러드 슬레이브 보드 불량."],"sa":["로터를 수동으로 돌리며 로터 위치 센서 PCB 출력 신호를 측정하고 전환 여부 확인. 혈액펌프를 분리해 불량 부품을 수리 또는 교체.","로터 어셈블리 교체 후 재시험.","배선 수리 또는 교체 후 동작 확인.","모든 연결부가 올바르게 연결되어 있고 커넥터 핀에 부식이 없는지 확인. 5. 라인 감지 스위치가 정상 동작하는지 확인.","","혈액펌프 연결부를 수리하거나 혈액펌프 어셈블리 교체.","블러드 슬레이브 보드 교체."]},
  14:{"r":"자세한 내용은 메시지 박스 참조. 장비 동작: 장비가 RESTART 상태로 전환.","m":"","oc":["급수 없음.","배수 라인이 꺾이거나 막힘.","투석액 커넥터 위치가 잘못됨.","투석액 라인이 꺾임."],"oa":["장비에 급수가 충분한지 확인. RESTART를 눌러 계속 진행.","배수 라인이 꺾이거나 막히지 않았는지 확인. RESTART를 눌러 계속 진행.","투석액 커넥터가 현재 장비 동작에 맞는 위치에 잘 연결되었는지 확인. RESTART를 눌러 계속 진행.","투석액 라인이 꺾이지 않았는지 확인. RESTART를 눌러 계속 진행. RESTART를 한 번 눌러 알람이 해제되지 않으면 가능한 원인을 확인한 뒤 다시 RESTART를 누름. 원인이 파악되지 않은 상태에서 2~3회 이상 누르지 말 것."],"sc":["SWP 스위치(하이드롤릭 스위치) 불량으로 인한 급수 없음.","SWP1 스위치(하이드롤릭 스위치) 불량으로 장비 배수부 고압.","PI 및 PO가 감지한 하이드롤릭 내부 고압.","침전물 축적으로 유량계 D1 또는 D2가 고착됨.","P2가 정상적으로 펌핑하지 못함.","PI 또는 PO 불량.","유량 스위치 LFD 불량.","하이드롤릭 보드 불량."],"sa":["급수 입구의 SWP 상태 확인. 2. 배수 라인이 의자나 침대 아래에서 꺾이거나 막히지 않았는지 확인. 배수부 SWP1 상태 확인. 3. 투석기 커넥터가 완전히 연결되었는지 확인. 문제 발생 당시 장비 단계의 Status 화면을 참조해 밸브 상태를 점검. 열려야 할 밸브가 하이드롤릭 슬레이브 보드에 의해 통전되고 실제로 열리는지 확인.","","","Status 화면에서 투석액 유량(D1)과 D2 유량을 확인. 두 값 모두 투석액 유량과 약 30 ml/min 이내로 일치해야 함. 고온 구연산 처리 또는 열소독 수행. 고착된 유량계가 정상 판독되지 않으면 해당 유량계를 교체하고 두 유량계와 P2 펌프를 재교정.","P2 재교정을 시도하거나, 펌프 교체 후 재교정.","알람 87, 88, 94, 95 트러블슈팅 참조.","유량이 있을 때와 없을 때 LFD 스위치 커넥터의 TTL 신호를 확인. 불량 부품 점검 또는 교체.","필요에 따라 수리 또는 교체."]},
  17:{"r":"상태가 약 90초간 지속됨. 장비 동작: 문제 상태가 감지된 시점에 수행 중이던 모든 프로세스를 중지.","m":"","oc":["울트라필터/바이패스가 올바르게 장착되지 않음. 울트라필터 상부 센서(SWFS) 또는 하부 센서(SWBY)가 약 (수십) 초간 문제를 표시.","DIALYSIS 중: 장비 뒷면의 울트라필터 위치가 잘못됨.","ULTRAFILTER USE 파라미터 설정이 잘못됨."],"oa":["","",""],"sc":["SWFS 또는 SWBY 불량 또는 커넥터 분리.","스위치와 마더보드·하이드롤릭 보드 간 연결 불량.","하이드롤릭 보드 불량.",""],"sa":["스위치를 수동으로 움직여 SWB 스위치 전환을 확인. 서비스 화면에서 정상 전환되면: SWB 스위치 위치를 점검·조정.","스위치를 수동으로 움직여 SWB 스위치 전환을 확인. 서비스 화면에서 전환되지 않으면: 테스터로 스위치를 점검하고 교체. 커넥터를 린스 포트에 꽂고 뺄 때 전압이 0 V와 5 V 사이에서 전환되어야 함.","스위치를 수동으로 움직여 SWB 스위치 전환을 확인. 서비스 화면에서 전환되지 않으면: 테스터로 SWB와 마더보드 간 연결을 점검하고, 해당 연결부를 청소·수리 또는 교체.","하이드롤릭 슬레이브 보드를 수리 또는 교체한 뒤 서비스 화면에서 SWB 스위치를 확인."]},
  18:{"r":"장비 동작: ADR 중 — 장비가 정지하고 커넥터 위치가 바로잡힐 때까지 대기. DIALYSIS 중 — 준비 단계에서는 진행하지 않으며, 치료 단계에서는 자동으로 바이패스 전환.","m":"","oc":["중탄산염 농축액 커넥터 위치가 잘못되었거나 린스 포트에 완전히 삽입되지 않음."],"oa":["장비 단계에 맞는 올바른 커넥터 위치인지 확인."],"sc":["SWB 조정이 잘못됨.","마이크로스위치 SWB 불량.","SWB 스위치와 마더보드 간 연결 불량.","하이드롤릭 슬레이브 보드 불량."],"sa":["스위치를 수동으로 움직여 SWB 스위치 전환을 확인. 서비스 화면에서 정상 전환되면: SWB 스위치 위치를 점검·조정.","스위치를 수동으로 움직여 SWB 스위치 전환을 확인. 서비스 화면에서 전환되지 않으면: 테스터로 스위치를 점검하고 교체. 커넥터를 린스 포트에 꽂고 뺄 때 전압이 0 V와 5 V 사이에서 전환되어야 함.","스위치를 수동으로 움직여 SWB 스위치 전환을 확인. 서비스 화면에서 전환되지 않으면: 테스터로 SWB와 마더보드 간 연결을 점검하고, 해당 연결부를 청소·수리 또는 교체.","하이드롤릭 슬레이브 보드를 수리 또는 교체한 뒤 서비스 화면에서 SWB 스위치를 확인."]},
  21:{"r":"전도도가 설정값에 도달하지 못함. 장비 동작: 중탄산염 펌프 정지.","m":"","oc":["BiCart 카트리지가 거의 비어 있음.","BiCart 카트리지 위치가 잘못됨."],"oa":["사용자 매뉴얼 지침에 따라 BiCart 교체. OVERRIDE를 눌러 중탄산염 흡입 재개.","홀더 내 BiCart 위치가 올바른지 확인. OVERRIDE를 눌러 중탄산염 흡입 재개."],"sc":["산 제어 셀이 산 농축액을 감지하지 못함.","PB 튜브 세그먼트가 찌그러지거나 꺾임.","PB 펌프 불량.","전도도 셀의 CPC 보드 불량.","PB 펌프 구동 회로 불량.","BiCart 라인에서 대량의 공기 누설.","하이드롤릭 또는 프로텍티브 슬레이브 보드 불량."],"sa":["PB가 중탄산염 농축액을 장비로 펌핑하는지 육안 또는 Status 화면의 PB Freq로 확인. 제어 셀 수리 또는 교체.","PB의 튜브 세그먼트를 교체하고","","","","",""]},
  22:{"r":"장비 동작: ADR 중 — 장비가 정지하고 두 홀더 암이 올바른 위치로 이동할 때까지 대기. DIALYSIS 중 — 투석액 준비 단계에서는 진행하지 않으며, 치료 단계에서 두 홀더 암 중 하나라도 위치가 잘못되면 바이패스 전환.","m":"","oc":["BiCart 홀더 암 위치가 잘못되었거나 확실히 닫히지 않음."],"oa":["장비 단계에 맞게 BiCart 홀더 암 위치가 올바른지 확인."],"sc":["홀 센서 SWBK 불량.","SWBK 스위치·마더보드·하이드롤릭 보드 간 연결 불량.","하이드롤릭 슬레이브 보드 불량."],"sa":["BiCart 암을 움직여 SWBK 스위치 전환을 확인. 서비스 화면에서 전환되지 않으면: 전압계로 스위치를 점검하고 교체. 암을 열고 닫을 때 전압이 0 V와 5 V 사이에서 전환되어야 함.","BiCart 암을 움직여 SWBK 스위치 전환을 확인. 서비스 화면에서 전환되지 않으면: 저항계로 SWBK·마더보드·하이드롤릭 보드 간 연결을 점검하고, 해당 연결부를 청소·수리 또는 교체.","하이드롤릭 슬레이브 보드를 수리 또는 교체한 뒤 서비스 화면에서 SWBK 값을 확인."]},
  23:{"r":"Minimum: 중탄산염 전도도가 사용자 설정값 또는 허용 최소값보다 낮음. Maximum: 중탄산염 전도도가 사용자 설정값 또는 허용 최대값보다 높음. 장비 동작: 투석 치료 중 BYPASS로 전환.","m":"","oc":["중탄산염 농축액 용기 또는 BiCart가 거의 비어 있음.","중탄산염 농축액 커넥터가 농축액 흡입봉에 잘 끼워지지 않음.","중탄산염 농축액 흡입봉에서 대량의 공기 누설.","BiCart가 홀더에 올바르게 장착되지 않음."],"oa":["","","중탄산염 농축액 흡입봉 교체.","BiCart가 홀더에 확실히 장착되었는지 확인."],"sc":["중탄산염 전도도가 설정값 대비 너무 낮거나 너무 높음.","PB 튜브 세그먼트가 찌그러짐.","제어 셀 및/또는 보호 셀, 온도 센서, CPC 보드 또는 DTY-Monitor 보드 불량.","농축액 라인에서 공기 누설.","하이드롤릭 또는 프로텍티브 슬레이브 보드 불량.","PB 펌프 불량."],"sa":["","튜브 세그먼트 교체 후 재교정.","교정 후에도 문제가 지속되면 중탄산염 전도도 셀을 교체하고 재교정. 그래도 지속되면 B 전도도 셀의 불량 온도 센서를 교체하고 재교정. CPC 보드와 DTY-Monitor 보드의 정상 동작을 확인하고, 문제가 있으면 해당 보드 교체 후 재교정.","필요에 따라 수리 또는 교체.","보드 수리 또는 교체.","필요에 따라 수리 또는 교체."]},
  24:{"r":"중탄산염 전도도 손실로 인함. 장비 동작: 중탄산염 펌프 정지.","m":"","oc":["중탄산염 농축액 용기가 비어 있음.","중탄산염 농축액 커넥터가 농축액 흡입봉에 잘 끼워지지 않음.","중탄산염 농축액 흡입봉에서 대량의 공기 누설."],"oa":["","","중탄산염 농축액 흡입봉 교체. OVERRIDE를 눌러 계속 진행."],"sc":["전도도 셀의 CPC 보드 불량.","중탄산염 제어 셀이 농축액을 감지하지 못함.","PB 튜브 세그먼트가 찌그러지거나 꺾임.","PB 펌프 불량.","PB 펌프 구동 회로 불량.","중탄산염 농축액 라인에서 대량의 공기 누설.","PB 펌프 구동 회로·마더보드·하이드롤릭 슬레이브 또는 프로텍티브 보드 간 연결 불량.","하이드롤릭 슬레이브 또는 프로텍티브 보드 불량."],"sa":["CPC 보드 교체. 필요 시 중탄산염 전도도 점검 및 재교정.","PB가 농축액을 장비로 펌핑하는지 육안 또는 Status 화면의 PB Freq로 확인. 제어 셀을 수리 또는 교체하고 전도도와 PB 펌프를 재교정.","PB의 튜브 세그먼트를 교체하고 PB 펌프 재교정.","PB 펌프를 수리 또는 교체하고 재교정.","연결부 및/또는 PB 스테퍼 보드 수리 또는 교체. 6. 누설 부위 수리 또는 교체. 7. 불량 연결부 청소·수리 또는 교체. 8. 보드 수리 또는 교체.","","",""]},
  26:{"r":"메인 보드의 BLD SENSITIVITY 파라미터 관련. 장비 동작: 없음.","m":"","oc":["메인 보드 보호 시스템(Protection System)의 이중 이미지 내부에서 BLD SENSITIVITY 파라미터 데이터 불일치가 감지됨."],"oa":[""],"sc":["메인 보드 보호 시스템의 이중 이미지 내부에서 BLD SENSITIVITY 파라미터 데이터 불일치가 감지됨."],"sa":["메인 보드 수리 또는 교체. 메인 보드 교체 시 반드시 설정(Configuration)을 먼저 저장할 것. (알람 27) 1. 다른 혈류 속도를 입력한 뒤 파라미터를 원래 값으로 복원. 알람이 지속되면 장비 재시작. 1. 메인 보드 수리 또는 교체 — 교체 시 설정을 먼저 저장할 것."]},
  27:{"r":"메인 보드의 BLOOD FLOW 파라미터 관련. 장비 동작: 없음.","m":"","oc":["메인 보드 보호 시스템의 이중 이미지 내부에서 BLOOD FLOW 파라미터 데이터 불일치가 감지됨."],"oa":[""],"sc":["메인 보드 보호 시스템의 이중 이미지 내부에서 BLOOD FLOW 파라미터 데이터 불일치가 감지됨.",""],"sa":["혈액 누출이 없는 상태에서 Status 화면의 BLD 값이 다음 미만인지 확인: • 고감도: BLD VALUE = 152 • 저감도: BLD VALUE = 120. 표백제(Bleach) 소독 절차 수행.","혈액누출 감지기(BLD)를 교체하고 장비를 재시작해 T1 테스트 수행."]},
  28:{"r":"(혈액 누출이) … ml/min 또는 0.45 ml/min 속도로 감지됨 (HIGH 또는 LOW 감도 설정값). 장비 동작: 혈액펌프 정지, 정맥라인 클램프 닫힘, 한외여과(UF) 펌프 최소값으로 감소.","m":"","oc":["투석기에서 하이드롤릭 회로로 혈액이 누출됨.","혈액누출 센서가 오염됨.","혈액누출 센서가 오염되었고 감도가 LOW로 설정됨.","투석액 커넥터에서 대량의 공기 누설."],"oa":["투석액의 혈액 존재 여부를 검사. 양성이면 투석기와 카트리지 혈액세트를 교체. 체외순환 회로 교체 절차를 준수.","투석액의 혈액 존재 여부를 검사. 음성이면 치료 완료를 위해 센서 감도를 LOW로 낮추는 것을 고려(BLD SENSITIVITY 파라미터). OVERRIDE를 누름. 3. 투석액 검사가 음성이고 감도가 LOW인데도 알람이 지속되면 치료를 중단. 가능한 빨리 화학 소독을 수행해 혈액누출 센서를 청소. 4. 투석액 커넥터 누설 여부 확인: 장비를 BYPASS로 두고 투석액 커넥터가 투석기에 잘 끼워졌는지 확인 후 BYPASS 해제. OVERRIDE를 누름.","",""],"sc":["혈액누출 감지기가 오염됨.","혈액누출 감지기 불량.","BLD 센서·마더보드·프로텍티브 보드 간 연결 불량.","프로텍티브 보드 불량."],"sa":["혈액 누출이 없는 상태에서 Status 화면의 BLD 값이 다음 미만인지 확인: • 고감도: BLD VALUE = 152 • 저감도: BLD VALUE = 120. 표백제(Bleach) 소독 절차 수행.","혈액누출 감지기를 교체하고 장비를 재시작해 T1 테스트 수행.","불량 연결부 청소·수리 또는 교체.","보드 수리 또는 교체."]},
  29:{"r":"펌프가 스스로 올바른 위치를 잡음. 장비 동작: 없음.","m":"","oc":["혈액펌프 커버가 열려 있거나 완전히 닫히지 않음."],"oa":["혈액펌프 커버가 닫혔는지 확인하고, OVERRIDE를 눌러 알람을 해제하거나 장비를 재시작."],"sc":["혈액펌프 커버에서 자석이 빠짐.","홀 센서 보드 불량.","홀 센서 보드·혈액펌프 보드·혈액 모터·마더보드 간 연결 불량."],"sa":["검증 절차를 수행하고 필요 시 HDBPM 교정 수행 (본 매뉴얼 08 – 교정 참조).","필요에 따라 교체. (트러블슈팅 시 본 매뉴얼의 관련 표 참조)","필요에 따라 청소, 수리 또는 교체. (혈액펌프 도어 상태 및 Pump Cover 파라미터는 서비스 화면 섹션 참조)"]},
  30:{"r":"장비 동작: 혈압 모니터링이 중지되고 측정값을 사용할 수 없음.","m":"","oc":["장치 일시적 막힘."],"oa":["OVERRIDE를 눌러 알람 해제. 다른 측정은 수행하지 말 것. DIALYSIS 중이면 치료 종료까지 기다린 뒤 장비를 끄고 몇 초 후 다시 켬. IDLE 화면에서 혈압 측정을 시도."],"sc":["BPM 교정 필요.","BPM 불량.","",""],"sa":["내부 튜브가 모두 연결되어 있고 누설·꺾임이 없는지 확인. 2. 튜브 및/또는 커프를 교체하고 재시험.","OVERRIDE를 누르고 측정 재시도. 3. 커프 튜브와 커프를 새것으로 교체. 4. 측정 반복.","펌프가 작동하는지 확인. 작동하지 않으면 혈압 측정을 다시 시작하고 펌프 전압을 측정. 전압이 없으면 혈압 모니터 교체.","필요에 따라 교체. (트러블슈팅 시 본 매뉴얼의 관련 표 참조)"]},
  31:{"r":"장비 동작: 혈압 모니터링이 중지되고 측정값을 사용할 수 없음.","m":"","oc":["튜브가 꺾이거나 분리됨.","측정 중 환자가 팔을 너무 많이 움직여 BPM이 혈압을 측정하지 못함.","외부 혈압 커프 튜브 또는 커프 자체에서 누설.","커프와 장비 간 통신 문제."],"oa":["외부 튜브가 연결되어 있고 누설·꺾임이 없는지 확인. OVERRIDE를 누르고 측정 재시도.","OVERRIDE를 누르고 측정 재시도. 3. 커프 튜브와 커프를 새것으로 교체. 4. 측정 반복.","",""],"sc":["튜브가 꺾이거나 분리됨.","혈압 커프 튜브 또는 커프 자체에서 누설.","혈압 모니터 펌프 분리 또는 불량.","혈압 모니터 불량.","",""],"sa":["LD1 센서를 분리해 물컵에 넣고 Status 화면에서 센서가 물을 감지하는지 확인.","센서를 청소. 청소 후 물컵에서 다시 확인. 필요 시 교체.","LD1 센서에서 마더보드·하이드롤릭 슬레이브 보드까지의 전기 연결 확인. 감지기 출력이 공기일 때 5 V, 물일 때 0 V인지 확인. 필요 시 수리 또는 교체.","EVD1 정상 동작 확인. BT1에서 배수로 가는 퍼지 라인이 막히지 않았는지 확인.","OW4를 분리해 유로 제한 여부 시험. 필요 시 교체 후 재시험.","하이드롤릭 슬레이브 보드 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행. 전체 파라미터 목록은 서비스 섹션 참조."]},

  34:{"r":"센서가 공기를 감지했거나, 고장이거나, 청소가 필요할 수 있음. 장비 동작: ADR 중 — 장비가 정지하고 RESTART 상태로 전환. DIALYSIS 중 — 없음.","m":"","oc":["빈 농축액 용기로 인한 대량의 공기 누설.","LD2 레벨 감지기 오염.","농축액 라인이 현재 장비 단계에 맞는 위치에 있지 않음.","BiCart 홀더 암이 완전히 닫히지 않음."],"oa":["산/아세테이트, BiCart 또는 중탄산염 용기가 비었는지 확인. 이 알람은 치료 종료 시까지 유지됨.","RINSE 또는 화학 소독을 수행해 센서의 침착물을 청소.","농축액 라인이 현재 장비 단계에 맞는 위치에 있는지 확인.","BiCart 홀더 암을 닫힘 위치로 옮겨 알람을 해제하고 전체 회로가 세척되도록 함."],"sc":["레벨 센서 LD2가 정상 동작해야 함.","LD2 연결 불량.","","EVD2 및/또는 EVBP2 누설 또는 막힘.","OW5 막힘.","하이드롤릭 슬레이브 보드 불량."],"sa":["LD2 센서를 분리해 물컵에 넣고 Status 화면에서 센서가 물을 감지하는지 확인.","센서를 청소. 청소 후 물컵에서 다시 확인. 필요 시 교체.","LD2 센서에서 마더보드·하이드롤릭 슬레이브 보드까지의 전기 연결 확인. 감지기 출력이 공기일 때 5 V, 물일 때 0 V인지 확인. 필요 시 수리 또는 교체.","EVD2·EVBP2 정상 동작 확인. BT2에서 배수로 가는 퍼지 라인이 막히지 않았는지 확인.","OW5를 분리해 유로 제한 여부 시험. 필요 시 교체 후 재시험.","하이드롤릭 슬레이브 보드 수리 또는 교체."]},
  35:{"r":"(센서가) 공기를 감지했거나, 고장이거나, 청소가 필요할 수 있음. 장비 동작: ADR 중 — TIME OUT PROCESS(#190) 알람이 발생하여 절차를 중지하고 RESTART 상태로 전환. DIALYSIS 중 — 없음.","m":"","oc":["LP 레벨 감지기 오염."],"oa":["RINSE 또는 화학 소독을 수행해 센서의 침착물을 청소."],"sc":["레벨 센서 LP가 정상 동작해야 함.","LP 레벨 감지기 오염 또는 불량.","LP 연결 불량.","EVP 누설 또는 막힘.","OW3 및/또는 OR2 막힘.","하이드롤릭 슬레이브 보드 불량."],"sa":["메인 보드 교체. 메인 보드 교체 시 반드시 설정을 먼저 저장할 것.","센서를 청소. 청소 후 물컵에서 다시 확인. 필요 시 교체.","LP 센서에서 마더보드·하이드롤릭 슬레이브 보드까지의 전기 연결 확인. 감지기 출력이 공기일 때 5 V, 물일 때 0 V인지 확인. 필요 시 수리 또는 교체.","EVP 정상 동작 확인. BTP에서 배수로 가는 퍼지 라인이 막히지 않았는지 확인.","OW3와 OR2를 분리해 유로 제한 여부 시험. 필요 시 교체 후 재시험.","하이드롤릭 슬레이브 보드 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행. 전체 파라미터 목록은 서비스 섹션 참조. (알람 36) 1. IDLE 화면으로 돌아가 Configuration 메뉴에서 파라미터를 올바른 값으로 복원. 알람이 지속되면 장비 재시작."]},
  36:{"r":"메인 보드의 BYPASS 파라미터 관련. 장비 동작: 없음.","m":"","oc":["메인 보드 보호 시스템의 이중 이미지 내부에서 BYPASS 파라미터 데이터 불일치가 감지됨."],"oa":[""],"sc":["메인 보드 보호 시스템의 이중 이미지 내부에서 BYPASS 파라미터 데이터 불일치가 감지됨.","",""],"sa":["장비 전원을 끄고 SWFS가 하네스에 연결되는 커넥터를 분리한 뒤, 버튼을 눌렀을 때와 누르지 않았을 때의 저항을 측정. 저항 변화가 없으면 SWFS 교체. 저항이 단락→개방으로 변하면 하이드롤릭 회로 보드 교체. 배선 하네스 연결도 확인. 필요 시 수리 또는 교체.","연결부 확인. Status 화면에서 CD1 신호 확인. 필요 시 청소, 수리 또는 교체.","하이드롤릭 슬레이브 보드 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행. SWFS 스위치 상태와 파라미터 불일치에 관해서는 서비스 화면 섹션의 전체 파라미터 목록 참조."]},
  38:{"r":"문제 상태. 장비 동작: ADR 중 — RESTART 상태로 전환. 투석액 준비 중 — 마이크로프로세서가 스위치의 올바른 신호를 확인할 때까지 진행하지 않음. DIALYSIS 중 — 투석기 바이패스.","m":"","oc":["투석액 준비 중: 울트라필터 또는 바이패스 피팅 위치가 잘못됨.","ULTRAFILTER USE 파라미터가 잘못됨."],"oa":["","메모리에 올바른 ULTRAFILTER USE 파라미터 값이 저장되어 있는지 확인."],"sc":["마이크로스위치 불량.","SWFS 스위치·마더보드·하이드롤릭 슬레이브 보드 간 연결 불량.","하이드롤릭 슬레이브 보드 불량."],"sa":["전원을 끈 상태에서 마더보드의 각 보드를 다시 장착한 뒤 전원을 켜 동작 확인. 프로텍티브 보드의 V51이 깜빡여 통신 중임을 나타내는지 확인.","전원 공급 장치와 마더보드 간 연결 확인. 전원 공급 장치와 마더보드 양쪽 커넥터를 다시 장착. 필요 시 수리 또는 교체.","필요에 따라 교체."]},
  39:{"r":"마스터 모듈과 보호 모듈(Protection Module) 간. 장비 동작: 없음.","m":"","oc":["마스터 모듈과 보호 모듈 간 데이터 전송에서 통신 문제가 감지됨."],"oa":["알람이 해제될 때까지 몇 초간 대기. • 해제되지 않으면 통신 복구에 실패한 마지막 안전 관련 파라미터를 다시 입력. • 그래도 해제되지 않으면 장비를 껐다 켠 뒤 수행 중이던 절차를 계속 진행."],"sc":["프로텍티브 보드가 메인 컴퓨터 보드와 통신하지 않음.","프로텍티브 5 V 전원이 약 4.7 V 미만.","프로텍티브 또는 메인 보드 불량."],"sa":["전원을 끈 상태에서 마더보드의 각 보드를 다시 장착한 뒤 전원을 켜 동작 확인. 프로텍티브 보드의 V51이 깜빡여 통신 중임을 나타내는지 확인.","전원 공급 장치와 마더보드 간 연결 확인. 전원 공급 장치와 마더보드 양쪽 커넥터를 다시 장착. 필요 시 수리 또는 교체.","필요에 따라 교체."]},
  40:{"r":"LOW PH: 측정된 pH가 허용값보다 낮음. HIGH PH: 측정된 pH가 허용값보다 높음. A PUMP / B PUMP / A&B PUMPS: 투석액 유량 대비 투석액 전도도와 해당 펌프 회전 속도 간 불일치. 실제 펌프 속도가 사용 중인 농축액과 맞지 않음. 장비 동작: 투석기 바이패스. 참고: 펌프 자동교정은 투석액 준비 시작부터 phase 8까지 가능하며, phase 9 이후에는 A Pump, B Pump 또는 A&B Pumps 속성으로 알람이 발생할 때마다 가능.","m":"","oc":["","HIGH pH","A PUMP","B PUMP","A&B PUMPS — LOW PH: 측정 pH가 허용값보다 낮음. HIGH PH: 측정 pH가 허용값보다 높음. A PUMP / B PUMP / A&B PUMPS: 유량과 펌프 회전 속도 간 불일치, 실제 농축액과 맞지 않음. 장비 동작: 투석기 바이패스.","","",""],"oa":["빈 용기를 교체하고 장비가 안정될 때까지 몇 초간 대기. 2. 올바른 농축액 종류가 장비에 연결되었는지 확인. 전도도가 안정적인지 확인한 뒤 PA/PB/PA+PB 자동교정 수행. 3. 농축액 커넥터/BiCart에서 공기 누설이 없는지 확인. 4. 커넥터에 쌓인 이물질을 헹궈 제거. 5. 농축액 라인이 확실히 연결되어 있고 라인으로 기포가 유입되지 않는지 확인. 6. 투석 준비를 중지하고 카트리지 혈액세트와 투석기를 새것으로 교체. 전체 RINSE 절차 수행. 용액을 올바른 것으로 교체한 뒤 투석 준비를 다시 시작.","","","","","용액이 올바른 농축액인지 확인하거나 올바른 용액으로 교체.","산 커넥터가 린스 포트에 확실히 연결되었는지 확인.","SETUP에서 올바른 농축액 종류를 선택."],"sc":["PA/PB 세그먼트 교체 필요.","pH 프로브 교정 이탈.","농축액 라인 막힘 또는 꺾임.","농축액 펌프 내 튜브가 찌그러짐.","농축액 펌프 로터 불량.","펌프 속도 판독이 부정확함.","PA 또는 PB 스테퍼 보드 불량.","PA/PB 스테퍼 보드·마더보드·하이드롤릭 및/또는 프로텍티브 보드 간 연결 불량.","하이드롤릭 또는 프로텍티브 보드 불량."],"sa":["메인 보드 교체. 메인 보드 교체 시 반드시 설정을 먼저 저장할 것.","사용 용액의 pH 확인. • 아세테이트 투석액 pH = 6.5 – 8.2 • 중탄산염 투석액 pH = 6.5 – pHmax • DIP-1 = ON ⇒ pHmax = 7.8 • DIP-1 = OFF ⇒ pHmax = 7.6 • 준비 단계 BiCart pHmax = 8.0. pH 교정을 확인하고, 범위를 벗어나면 pH 프로브를 교정 또는 교체.","농축액 라인에 막힘이나 꺾임이 없는지 확인.","튜브가 찌그러지지 않았는지 확인. 불량 부품 수리 또는 교체.","전도도가 안정적인지 확인. 튜브 세그먼트 교체 후에도 실제 전도도가 불안정하면 로터를 교체하고 재시험.","서비스 화면에서 펌프 속도 확인. a. Pump A 속도 -10% ~ +30% b. Economy 및 UF-only 모드에서 PA = +30% c. 액상 중탄산염 사용 시 Pump B 속도 -10% ~ +30% d. Economy 및 UF-only 모드에서 PB = +30% e. 적합하고 올바른 농축액이 연결되었는지 확인. 전도도가 안정적인지 확인한 뒤 PA/PB 자동교정 수행.","서비스 화면에서 각 펌프 값이 0이 아닌지 확인. 한 펌프라도 0이면 스테퍼 보드를 수리 또는 교체.","해당 연결부 청소·수리 또는 교체.","필요에 따라 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 후 PA, PB, PUF 펌프 자동교정. 프로텍티브 CPU만 교체한 경우 Disk → Board 복원. PUF는 적절한 자동교정 필요. (알람 41) 1. Set 모드에서 파라미터를 올바른 값으로 복원. 알람이 지속되면 장비 재시작."]},
  41:{"r":"메인 보드의 CONDUCTIVITY 파라미터 관련. 장비 동작: 없음.","m":"","oc":["메인 보드 보호 시스템의 이중 이미지 내부에서 CONDUCTIVITY 파라미터 데이터 불일치가 감지됨."],"oa":[""],"sc":["메인 보드 보호 시스템의 이중 이미지 내부에서 CONDUCTIVITY 파라미터 데이터 불일치가 감지됨."],"sa":["불량 부품 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 후 PA, PB, PUF 펌프 자동교정. 프로텍티브 CPU만 교체한 경우 Disk → Board 복원."]},
  43:{"r":"장비 동작: 없음.","m":"","oc":["보호 모듈에 데이터를 저장할 때 불일치가 감지됨."],"oa":[""],"sc":["프로텍티브 보드 불량으로 보호 모듈에 데이터 저장 시 불일치가 감지됨.","",""],"sa":["Pi 및 Po 교정 확인. 필요 시 재교정 또는 교체.","P1 펌프 전압 확인. 전압이 올바르지 않으면 P1 보드를 수리 또는 교체. 전압이 올바르면 P1 펌프를 수리 또는 교체.","필요에 따라 수리 또는 교체."]},
  44:{"r":"MINIMUM: 투석액 실제 유량이 설정 유량 또는 허용 최소 유량보다 낮음. MAXIMUM: 투석액 실제 유량이 설정 유량 또는 허용 최대 유량보다 높음. UNDEFINED: 장비가 투석액 유량을 측정할 수 없음. 장비 동작: 투석기 바이패스.","m":"","oc":["장비가 불안정한 투석액 유량을 감지함.","장비 유량계 내부에 침착물 또는 이물질이 있음.","UNDEFINED — 투석액 실제 유량이 설정과 다름. MINIMUM: 실제 유량이 낮음. MAXIMUM: 실제 유량이 높음. UNDEFINED: 투석액 유량 측정 불가. 장비 동작: 투석기 바이패스."],"oa":["OVERRIDE를 눌러 치료를 계속 진행.","Descaling 또는 화학 소독 수행.",""],"sc":["Pi 또는 Po 압력 센서 불량.","P1 펌프 불량.","하이드롤릭 또는 프로텍티브 보드 불량."],"sa":["Pi 및 Po 교정 확인. 필요 시 재교정 또는 교체.","P1 펌프 전압 확인. 전압이 올바르지 않으면 P1 보드를 수리 또는 교체. 전압이 올바르면 P1 펌프를 수리 또는 교체.","필요에 따라 수리 또는 교체."]},

  60:{"r":"프로그램된 TARGET LOSS (도달). 장비 동작: 없음. 참고: 설정 파라미터 TARGET LOSS가 NO이면 알람을 OVERRIDE 할 수 있음 — 경보음과 메시지는 나타나지 않고 아이콘만 표시됨. YES이면 OVERRIDE 불가.","m":"","oc":[],"oa":[],"sc":["마이크로스위치 불량.","SWBY 스위치·마더보드·하이드롤릭 슬레이브 보드 간 연결 불량.","하이드롤릭 슬레이브 보드 불량."],"sa":["장비 전원을 끄고 SWBY가 하네스에 연결되는 커넥터를 분리한 뒤, 버튼을 눌렀을 때와 누르지 않았을 때의 저항을 측정. 저항 변화가 없으면 SWBY 교체. 저항이 단락→개방으로 변하면 하이드롤릭 회로 보드 교체. 배선 하네스 연결도 확인. 필요 시 수리 또는 교체.","서비스 화면에서 CD2 스위치 파라미터 전환 확인. 해당 연결부 청소·수리 또는 교체.","하이드롤릭 슬레이브 보드 교체."]},
  61:{"r":"장비 동작: ADR 중 — RESTART 상태로 전환. 투석액 준비 중 — 마이크로프로세서가 스위치의 올바른 신호를 확인할 때까지 진행하지 않음. DIALYSIS 중 — 투석기 바이패스.","m":"","oc":["투석액 준비 중: 장비 뒷면의 울트라필터 또는 바이패스 피팅 위치가 잘못됨.","ULTRAFILTER USE 파라미터가 잘못됨."],"oa":["울트라필터가 설치된 경우 두 마이크로스위치를 모두 덮도록 올바르게 장착되었는지 확인. 설치되지 않은 경우 클린 투석액 바이패스 피팅이 하부 브래킷에 올바르게 설치되었는지 확인.","CONFIG에 올바른 ULTRAFILTER USE 파라미터 값이 입력되었는지 확인."],"sc":["마이크로스위치 불량.","SWBY 스위치·마더보드·하이드롤릭 슬레이브 보드 간 연결 불량.","하이드롤릭 슬레이브 보드 불량."],"sa":["장비 전원을 끄고 SWBY가 하네스에 연결되는 커넥터를 분리한 뒤, 버튼을 눌렀을 때와 누르지 않았을 때의 저항을 측정. 저항 변화가 없으면 SWBY 교체. 저항이 단락→개방으로 변하면 하이드롤릭 회로 보드 교체. 배선 하네스 연결도 확인. 필요 시 수리 또는 교체.","서비스 화면에서 CD2 스위치 파라미터 전환 확인. 해당 연결부 청소·수리 또는 교체.","하이드롤릭 슬레이브 보드 교체."]},

  71:{"r":"(헤파린 펌프가) 켜지지 않음. 장비 동작: 없음.","m":"","oc":["치료 시작 시 헤파린 주입이 시작되지 않음.","헤파린 프로그램이 필요 없음."],"oa":["소독액 용기 잔량 확인. RESTART를 눌러 현재 프로세스 진행. 2. 소독액 커넥터가 소독액 흡입봉에 올바르게 위치했는지 확인. RESTART를 눌러 현재 프로세스 진행. 3. 전체 린스 절차 수행. 4. 투석 준비를 중지하고 전체 린스 절차 수행. 문제가 지속되면 서비스 요청. 5. 치료 종료까지 대기. RINSEBACK 후 린스 절차 수행 시도.","OVERRIDE를 눌러 알람 해제. (이 파라미터는 NO 또는 YES로 설정 가능 — NO로 설정하면 알람이 꺼져 나타나지 않음.) (알람 72: 소독액 탱크 수위가 현재 단계 요구와 맞지 않음 — TIME OUT PROCESS(#190) 알람 표시 후 장비 정지)"],"sc":["소독액 탱크 고수위 센서 오염.","소독액 탱크 고수위 센서 불량.","소독액 고수위 센서·마더보드·하이드롤릭 슬레이브 보드 간 연결 불량.","PS 튜브 세그먼트가 찌그러지거나 꺾임.","하이드롤릭 슬레이브 보드 불량."],"sa":["","","불량 연결부 청소·수리 또는 교체.","PS 펌프의 튜브 세그먼트 교체.","필요에 따라 수리 또는 교체."]},

  84:{"r":"하이드롤릭. 장비 동작: 히터 꺼짐, 장비가 정지하고 RESTART 상태로 전환.","m":"","oc":["탈기 루프 문제."],"oa":["RESTART를 눌러 프로세스 재시작. RESTART를 한 번 눌러 알람이 해제되지 않으면 가능한 원인을 확인한 뒤 다시 RESTART를 누름. 원인이 파악되지 않은 상태에서 2~3회 이상 누르지 말 것."],"sc":["오리피스 OR1 막힘.","LFP 불량.","PC 펌프 불량, 미교정 또는 캐비테이션 발생. PC 캐비테이션 시작 후 최저 온도 알람이 발생할 수 있음.","R1 또는 R2 교정 이탈.","급수 또는 탈기 루프에 공기 존재.","탈기 루프 막힘.","히터 캐비티 막힘.","LFP·마더보드·하이드롤릭 슬레이브 보드 간 연결 불량.","하이드롤릭 슬레이브 보드 불량."],"sa":["투석액 커넥터가 현재 장비 단계에 맞는 위치에 있는지 확인한 뒤 RESTART를 누름.","장비의 현재 단계에 따라 투석액 커넥터가 투석기 또는 장비에 잘 끼워졌는지 확인한 뒤 RESTART를 누름.","외부 투석액 라인이 꺾이지 않았는지 확인한 뒤 RESTART를 누름.","외부 투석액 라인에 공기가 있는지 확인한 뒤 RESTART를 누름.","환자 처방(한외여과 속도)이 맞는지 확인. 환자 처방에 어긋나지 않는다면 혈류량 감소를 고려.","투석기 혈액측의 응고 또는 막힘 확인. 필요 시 투석기 교체.","투석액 유량 감소를 고려.","다이어프램 Neutralization 절차 수행 (5.A – 특수 절차 참조). RESTART를 한 번 눌러 알람이 해제되지 않으면 가능한 원인을 확인한 뒤 다시 RESTART를 누름. 원인이 파악되지 않은 상태에서 2~3회 이상 누르지 말 것.","필요에 따라 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행. (알람 87 MAXIMUM: 투석기 입구에서 허용치보다 높은 압력 감지)"]},

  90:{"r":"1. DIALYSIS 중 ⇒ 46°C (114.8°F) 2. 화학 소독 중 ⇒ 42°C (107.6°F) 3. Heat 또는 Heat Citric 소독 중 ⇒ 110°C (230°F). 장비 동작: 히터 꺼짐.","m":"","oc":["장비에 RESTART 상태가 있었음.","장비 오작동.","급수 온도가 너무 높음."],"oa":["환자 안전 확인. 이전 RESTART 상태 여부 확인. 온도가 떨어질 때까지 대기 — 히터는 자동으로 다시 켜짐.","DIALYSIS를 중단하고 서비스 요청.","급수 온도 확인 (사양 섹션 참조)."],"sc":["TP, TPS 센서 또는 히터 구동 회로 문제.","연결 불량.","하이드롤릭 보드 불량."],"sa":["Status 화면에서 TP(제어) 온도와 TPS(보호) 온도가 거의 같은지 확인. 같다면 위 한계값과 일치하는지 확인하고, 일치하면 트라이액 단락으로 이 알람이 발생했는지 점검. 차이가 크면 외부 계측기로 어느 프로브가 정확한지 확인한 뒤 프로브를 교체하고 온도 시스템 교정.","센서·마더보드·하이드롤릭 간 연결 확인. 필요 시 청소, 수리 또는 교체.","필요에 따라 수리 또는 교체."]},
  94:{"r":"투석기 입구에서 허용치보다 (낮은 압력). 장비 동작: DIALYSIS 중 — 압력이 -350 mmHg 미만이면 UF 펌프 정지. -450 mmHg 미만이면 UF 펌프 정지 및 (RESTART 전환).","m":"","oc":["투석액 커넥터 위치가 잘못됨.","투석액 커넥터 위치는 맞으나 잘 삽입되지 않음.","외부 투석액 라인 꺾임.","하이드롤릭 회로 내부에 다량의 공기 존재.","사용 투석기 대비 UF 속도가 너무 높음.","투석기 혈액측 응고 또는 막힘.","투석액 유량이 현재 투석기에 맞지 않음."],"oa":["투석액 커넥터가 현재 장비 단계에 맞는 위치에 있는지 확인한 뒤 RESTART를 누름. 2. 장비의 현재 단계에 따라 투석액 커넥터가 투석기 또는 장비에 잘 끼워졌는지 확인한 뒤 RESTART를 누름.","","외부 투석액 라인이 꺾이지 않았는지 확인한 뒤 RESTART를 누름.","외부 투석액 라인에 공기가 있는지 확인한 뒤 RESTART를 누름. 5. 사용 투석기에 맞는 UF 속도인지 확인. 환자 처방에 어긋나지 않는다면 혈류량 감소를 고려한 뒤 RESTART를 누름.","","투석기 혈액측의 응고 또는 막힘 확인. 필요 시 투석기 교체. 7. 투석액 유량 감소를 고려. RESTART를 한 번 눌러 알람이 해제되지 않으면 가능한 원인을 확인한 뒤 다시 RESTART를 누름. 원인이 파악되지 않은 상태에서 2~3회 이상 누르지 말 것.",""],"sc":["PI 압력 정확도 드리프트.","PI 센서 불량.","침착물로 인한 D1 막힘.","P1, D1, P2, D2 불량.","하이드롤릭 라인 막힘.","EVDS1, EV1이 막혔거나 켜지지 않음.","PI·마더보드·하이드롤릭 보드 간 연결 불량.","하이드롤릭 보드 불량."],"sa":["PI 교정 후 교정 결과 확인.","필요에 따라 교체 및 재교정.","D1 유량 출력이 거의 0까지 감소했을 수 있음. Status 화면에서 D1 유량 확인. 0이면 구연산/산 처리 절차 수행. D1이 완전히 막히면 세척 절차가 시작되지 않을 수 있음 — 부품 교체 후 재시험.","D1과 D2가 현재 장비 단계에 맞는 속도로 동작하는지 확인. 불량 부품 수리 또는 교체 후 재시험.","PI 이전 하이드롤릭 튜브에 막힘이 없는지 확인.","각 밸브의 구동 전압을 측정해 EVDS1과 EV1이 켜지는지 확인. 통전되면 실제로 열리는지, 밸브 내부에 이물질이 없는지 확인.","필요에 따라 청소, 수리 또는 교체.","필요에 따라 수리 또는 교체."]},

  100:{"r":"장비 동작: 모든 하이드롤릭 모듈 펌프 정지. DIALYSIS 중 투석기 바이패스.","m":"","oc":["RO 분배 시스템 압력 저하.","급수 연결이 분리됨.","급수 밸브가 닫혀 있음.","급수 필터 막힘."],"oa":["","급수를 올바른 급수 밸브에 연결.","급수 밸브가 열려 있는지 확인.","장비 급수 필터 막힘 여부 확인. 필터가 막히면 시스템을 흐르는 수량이 감소함. 문제 해결 후 치료 (재개). ADR 중 장비는 (재시작 필요)."],"sc":["SWP 불량 또는 분리.","SWP 미교정.","SWP·마더보드·하이드롤릭 보드 간 연결 불량.","하이드롤릭 보드 불량."],"sa":["서비스 화면에 엔코더 신호가 표시되는지 확인. 모터가 회전 중이라면 펌프 보드 불량일 수 있음. 필요 시 수리 또는 교체.","필요에 따라 청소, 수리 또는 교체.","필요에 따라 수리 또는 교체.","필요에 따라 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행. (P1 구동 명령에 대한 정상 응답이 없어 RESTART 상태로 전환)"]},

  106:{"r":"오작동을 나타냄. 장비 동작: ADR 중 — 장비가 정지하고 RESTART 상태로 전환. DIALYSIS 중 — 없음.","m":"","oc":["DIALYSIS 중: P2 펌프 구동 명령 실패.","ADR 중: P2 펌프 구동 명령 실패.","ADR 중: 장비가 재시작되지 않는 경우."],"oa":["PA 자동교정 반복.","","필요에 따라 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행. P2 상태와 P2_FLOW, P2_FREQ 파라미터 확인 — phase 19에서 P2 유량은 (D2 유량과) 거의 같아야 함. 전체 파라미터 목록은 서비스 화면 섹션 참조. (알람 107: 문제로 인해 자동교정이 수행되지 않음)"],"sc":["P2 모터 드라이브 보드 또는 P2 엔코더 불량.","P2 모터 드라이브 보드 엔코더·마더보드·하이드롤릭 슬레이브 보드 간 연결 불량.","하이드롤릭 슬레이브 보드 불량."],"sa":["스테퍼 보드 수리 또는 교체 후 PA 자동교정 재시험.","스테퍼 모터 수리 또는 교체.","PA 세그먼트 교체를 고려."]},

  114:{"r":"장비 동작: 한외여과가 최대값으로 설정됨. 참고: Pi 또는 Po에서 고압이 감지되면 #114 알람 직전에 #87(Pi 고압) 또는 #88(Po 고압) 알람이 자주 발생함. 또한 감지 압력이 +500 mmHg를 초과하면 (장비가 RESTART 상태로 전환).","m":"","oc":["","","","",""],"oa":["외부 투석액 라인이 꺾이지 않았는지 확인.","외부 투석액 라인에 공기가 있는지 확인. 투석액 커넥터가 투석기 또는 장비에 잘 끼워졌는지 확인.","환자 처방(한외여과 속도)이 맞는지 확인. 환자 처방에 어긋나지 않는다면 혈액펌프 속도 감소를 고려.","투석기 혈액측 또는 카트리지 혈액세트의 응고·막힘 확인. 필요 시 투석기와 카트리지 혈액세트 교체.","투석액 유량 감소를 고려. 7. 다이어프램 Neutralization 절차 수행 (5.A – 특수 절차 참조)."],"sc":["PI/PO 압력 정확도 드리프트.","PI/PO 센서 불량.","침착물로 인한 D2 막힘.","P1, D1, P2, D2 불량.","하이드롤릭 라인 막힘 — 필터 F5 막힘 가능성.","EV2, OW11, 열교환기 폐색 가능성.","PI/PO·마더보드·프로텍티브 보드 간 연결 불량.","프로텍티브 보드 불량."],"sa":["PI/PO 교정 후 교정 결과 확인.","필요에 따라 교체 및 재교정.","D2 유량 출력이 거의 0까지 감소했을 수 있음. Status 화면에서 D2 유량 확인. 0이면 구연산/산 처리 절차 수행. D2가 완전히 막히면 세척 절차가 시작되지 않을 수 있음 — 부품 교체 후 재시험.","D1/P1과 D2/P2가 현재 장비 단계에 맞는 속도로 동작하는지 확인. 불량 부품 수리 또는 교체 후 재시험.","필터 F5가 깨끗하고 PI/PO 이후 하이드롤릭 튜브에 막힘이 없는지 확인.","Status 화면의 투석액 유량이 실제 유량과 30 ml 이내인지 확인. 아니면 D1 교정 수행.","필요에 따라 청소, 수리 또는 교체.","필요에 따라 수리 또는 교체."]},
  115:{"r":"장비 동작: 한외여과 정지 후 최소값으로 설정. 참고: Pi 또는 Po에서 저압이 감지되면 #115 알람 직전에 #94(Pi 저압) 또는 #95(Po 저압) 알람이 자주 발생함. 또한 감지 압력이 -450 mmHg 미만이 되면 RESTART 상태로 전환되고 RESTART 창이 활성화됨. 알람 해제 방법은 #94 또는 #95 알람 설명도 참조.","m":"","oc":["","","",""],"oa":["외부 투석액 라인이 꺾이지 않았는지 확인.","외부 투석액 라인에 공기가 있는지 확인. 투석액 커넥터가 투석기 또는 장비에 잘 끼워졌는지 확인. 4. 환자 처방(한외여과 속도)이 맞는지 확인. 환자 처방에 어긋나지 않는다면 혈액펌프 속도 증가를 고려.","투석기 혈액측 또는 카트리지 혈액세트의 응고·막힘 확인. 필요 시 교체.","투석액 유량 증가를 고려."],"sc":["PI/PO 압력 정확도 드리프트.","PI/PO 센서 불량.","침착물로 인한 D1 막힘.","P1, D1, P2, D2 불량.","하이드롤릭 라인 막힘.","EVDS1, EV1이 막혔거나 켜지지 않음.","PI/PO·마더보드·프로텍티브 보드 간 연결 불량.","프로텍티브 보드 불량."],"sa":["PI/PO 교정 후 교정 결과 확인.","필요에 따라 교체 및 재교정.","D1 유량 출력이 거의 0까지 감소했을 수 있음. Status 화면에서 D1 유량 확인. 0이면 구연산/산 처리 절차 수행. D1이 완전히 막히면 세척 절차가 시작되지 않을 수 있음 — 부품 교체 후 재시험.","D1/P1과 D2/P2가 현재 장비 단계에 맞는 속도로 동작하는지 확인. 불량 부품 수리 또는 교체 후 재시험.","PI/PO 이전 하이드롤릭 튜브에 막힘이 없는지 확인.","각 밸브의 구동 전압을 측정해 EVDS1과 EV1이 켜지는지 확인. 통전되면 실제로 열리는지, 밸브 내부에 이물질이 없는지 확인.","필요에 따라 청소, 수리 또는 교체.","필요에 따라 수리 또는 교체."]},

  132:{"r":"사용자가 Configuration 화면에서 (설정한 범위). 장비 동작: 없음.","m":"","oc":["환자 수축기 혈압이 설정 범위를 벗어남.","커프가 올바르게 착용되지 않음.","측정 중 환자가 움직임.","혈압 커프가 정상 작동하지 않음."],"oa":["OVERRIDE를 눌러 알람 리셋. 수동 혈압 커프로 측정값 확인. 내부 규정 참조. 측정 재시도.","환자 팔다리의 커프를 확인 및/또는 다시 착용. OVERRIDE를 눌러 알람 리셋. 측정 재시도.","OVERRIDE를 눌러 알람 리셋. 측정 재시도.","커프와 튜브를 교체하고 측정 재시도. 올바르게 교정된 수동 혈압계로 비교 측정. 판독값이 비슷하지 않으면 서비스 요청."],"sc":["T1 테스트 실패.","CPU (Test 1), EPROM CRC (Test 2), Comparator (Test 3), RAM (Test 4).","배터리 (Test 5).","24 V 전원 차단 (Test 10).","정맥 클램프 (Test 11).","밸브 명령 (Test 13)."],"sa":["전원을 껐다 켜서 재확인. T1 테스트의 자세한 설명은 본 매뉴얼의 소프트웨어 설명 섹션 참조.","정맥 라인은 기포감지기 안에 있어야 함. 투석 프로세스 Fast Recovery 절차를 다시 수행해야 함. 혈액이 응고되었으면 환자 분리.","","","",""]},
  133:{"r":"장비 동작: GENERAL SAFE STATE.","m":"","oc":["준비 중 T1 테스트 실패.","투석 프로세스 Fast Recovery를 수행했으나 정맥 라인이 기포감지기 밖에 있었음."],"oa":["투석액 커넥터가 바이패스 포트에 올바르게 위치했는지 확인. 투석액 준비를 반복. T1 테스트가 다시 실패하면 실패한 T1 테스트를 기록하고 서비스 요청.","정맥 라인은 기포감지기 안에 있어야 함. 투석 프로세스 Fast Recovery 절차를 다시 수행해야 함. 혈액이 응고되었으면 환자 분리."],"sc":["T1 테스트 실패.","CPU (Test 1), EPROM CRC (Test 2), Comparator (Test 3), RAM (Test 4).","배터리 (Test 5).","24 V 전원 차단 (Test 10).","정맥 클램프 (Test 11).","밸브 명령 (Test 13).","정맥압 및 동맥압 (Test 14).","혈액(동맥) 펌프 (Test 15).","PI 및 PO 압력 센서 (Test 16).","PUF 및 P2 펌프 (Test 21)."],"sa":["전원을 껐다 켜서 재확인. T1 테스트의 자세한 설명은 본 매뉴얼의 소프트웨어 설명 섹션 참조.","","","","","","","","",""]},
  134:{"r":"MINIMUM: 측정 온도가 설정값보다 2°C 낮거나 허용 최소값(34°C) 미만. MAXIMUM: 측정 온도가 설정값보다 2°C 높거나 허용 최대값(39.5°C) 초과. UNDEFINED: 장비가 온도를 측정할 수 없음. 장비 동작: 투석기 바이패스.","m":"","oc":["이전 RESTART 상태로 인한 일시적인 투석액 유량 불안정.","투석액 온도가 안전 한계를 초과함.","장비가 최근에 켜져 아직 작동 온도에 도달하지 않음.","장비 내부 오작동."],"oa":["","","","DIALYSIS 중단."],"sc":["온도 센서 TP 또는 TPS 교정 이탈.","기준 계측기와 TP·TPS가 나타내는 실제 온도가 사양을 벗어남.","하이드롤릭 슬레이브 보드 불량.","프로텍티브 슬레이브 보드 불량."],"sa":["서비스 화면의 제어(TP)·보호(TPS) 온도값과 기준 계측기로 읽은 실제 온도를 비교. 한 센서만 범위를 벗어나면 온도 교정을 시도하거나 해당 센서·연결부를 수리 또는 교체. 2. 히터 구동 회로가 정상 동작하는지 확인. 히터 저항이 도통되는지, 릴레이 RCH와 트라이액이 단락(상시 ON)되지 않았는지 확인.","","하이드롤릭 슬레이브 보드 교체 후 재시험.","프로텍티브 슬레이브 보드 교체 후 재시험."]},
  135:{"r":"메인 보드의 TEMPERATURE 파라미터 관련. 장비 동작: 없음.","m":"","oc":["메인 보드 보호 시스템의 이중 이미지 내부에서 TEMPERATURE 파라미터 데이터 불일치가 감지됨.","장비 내부 오작동."],"oa":["","DIALYSIS 중단."],"sc":["메인 보드 보호 시스템의 이중 이미지 내부에서 TEMPERATURE 파라미터 데이터 불일치가 감지됨.","","",""],"sa":["서비스 화면 1페이지의 제어(TP)·보호(TPS) 온도값과 기준 계측기로 읽은 실제 온도를 비교. 한 센서만 범위를 벗어나면 온도 교정을 시도하거나 해당 센서·연결부를 수리 또는 교체. 실제 온도가 사양을 벗어나면 히터 제어 신호를 점검.","히터 구동 회로가 정상 동작하는지 확인. 히터 저항이 도통되는지, 릴레이 RCH와 트라이액이 단락(상시 ON)되지 않았는지 확인.","하이드롤릭 슬레이브 보드 교체 후 재시험.","프로텍티브 슬레이브 보드 교체 후 재시험."]},
  136:{"r":"(DIALYSIS 중) 보호 프로브(TPS) 온도가 최소 30초간 50°C(122°F) 초과. DIALYSIS 외: • 보호 프로브(TPS) 온도가 최소 30초간 105°C(221°F) 초과 • 하이드롤릭 프로브 측정 온도가 최소 5분간 107°C(224.6°F) 초과 • 하이드롤릭 프로브 측정 온도가 80°C(176°F) 초과 상태에서 최소 5분간 변동폭 0.1°C 미만. 장비 동작: GENERAL SAFE STATE.","m":"","oc":["DIALYSIS 중: 이전 RESTART 상태로 투석액 유량이 불안정해짐.","투석액 온도가 안전 한계를 초과함.","장비 내부 오작동."],"oa":["Phoenix 사용자 매뉴얼 5.A – 특수 절차의 투석 프로세스 Fast Recovery 절차 참조. 문제가 지속되면 환자 분리.","급수 온도 확인 (사양 섹션 참조).","DIALYSIS 중단."],"sc":["온도 센서 TP 또는 TPS 교정 이탈.","기준 계측기와 TP·TPS가 나타내는 실제 온도가 사양을 벗어남.","하이드롤릭 슬레이브 보드 불량.","프로텍티브 슬레이브 보드 불량."],"sa":["PFS 이후 하이드롤릭 튜브에 막힘이 없는지 확인.","교정 후 확인하거나 필요 시 교체.","불량 연결부 청소·수리 또는 교체.","하이드롤릭 보드 수리 또는 교체."]},
  138:{"r":"허용값. 장비 동작: DIALYSIS 및 ADR 중 RESTART 상태로 전환.","m":"","oc":["클린 투석액 울트라필터 막힘."],"oa":["치료가 시작된 경우 투석액 유량을 낮춰 진행 중인 투석을 계속할 수 있음. 치료 종료 후 절차에 따라 울트라필터 교체."],"sc":["PFS 이후 하이드롤릭 회로 막힘.","압력 센서 PFS 교정 이탈 또는 불량.","PFS 압력 센서·마더보드·하이드롤릭 보드 간 연결 불량.","하이드롤릭 보드 불량."],"sa":["PFS 이후 하이드롤릭 튜브에 막힘이 없는지 확인.","교정 후 확인하거나 필요 시 교체.","불량 연결부 청소·수리 또는 교체.","하이드롤릭 보드 수리 또는 교체."]},
  139:{"r":"장비 동작: 없음.","m":"","oc":["자동교정 중 농축액이 교체되었거나 농축액이 소진됨.","자동교정 중 전도도가 불안정함.","PA 펌프 자동교정 중 정전."],"oa":["장비가 안정될 때까지 몇 초간 대기하거나 올바른 산/아세테이트 용기인지 확인한 뒤 PA 자동교정 반복. 필요 시 장비를 재부팅하고 PA 자동교정 반복.","산/아세테이트 커넥터가 올바른 흡입봉에 잘 삽입되었는지, 산/아세테이트 전도도가 안정적인지 확인한 뒤 PA 자동교정 반복. 필요 시 장비를 재부팅하고 PA 자동교정 반복. 3. 장비를 껐다 켠 뒤 PA 자동교정을 다시 수행.",""],"sc":["알람으로 인해 PA 자동교정 중 투석액 유량이 불안정함.","제어 또는 보호 전도도가 정확하지 않음.","PA 세그먼트 교체 필요.","PA 펌프 튜브 세그먼트가 찌그러지거나 꺾임.","PA 펌프 드라이브 보드 불량.","하이드롤릭 보드 불량."],"sa":["유량이 불안정했던 원인 확인. PA 자동교정 중 다른 알람이 발생할 수 있으므로 해당 알람을 트러블슈팅. 경우에 따라 B 전도도가 A 전도도 시스템에 영향을 줄 수 있음. 2. Status 화면의 A 전도도 값이 제어·보호 모두 정확한지 확인. 아니면 A 전도도를 교정하고 PA 자동교정 재시험.","","PA 세그먼트 교체를 고려. 4. 튜브 세그먼트를 수리 또는 교체하고 장비 재시작 후 교정 재시도.","","필요에 따라 수리 또는 교체.","필요에 따라 수리 또는 교체."]},
  140:{"r":"장비 동작: 없음. 참고: 이 알람은 액상 중탄산염 사용 시에만 발생.","m":"","oc":["",""],"oa":["장비가 안정될 때까지 몇 초간 대기하거나 올바른 중탄산염 농축액인지 확인한 뒤 PB 자동교정 반복. 필요 시 장비를 껐다 켜고 PB 자동교정 반복.","중탄산염 커넥터가 올바른 흡입봉에 잘 삽입되었는지, 중탄산염 전도도가 안정적인지 확인한 뒤 PB 자동교정 반복. 필요 시 장비를 껐다 켜고 PB 자동교정 반복. 3. 장비를 껐다 켠 뒤 PB 자동교정을 다시 수행."],"sc":["알람으로 인해 PB 자동교정 중 투석액 유량이 불안정함.","제어 또는 보호 전도도가 정확하지 않음.","PB 세그먼트 교체 필요.","PB 펌프 튜브 세그먼트가 찌그러지거나 꺾임.","PB 펌프 드라이브 보드 불량.","하이드롤릭 보드 불량."],"sa":["유량이 불안정했던 원인 확인. PB 자동교정 중 다른 알람이 발생할 수 있으므로 해당 알람을 트러블슈팅. 2. Status 화면의 B 전도도 값이 제어·보호 모두 정확한지 확인. 아니면 B 전도도를 교정하고 PB 자동교정 재시험.","","PB 세그먼트 교체를 고려. 4. 튜브 세그먼트를 수리 또는 교체하고 장비 재시작 후 교정 재시도.","","필요에 따라 수리 또는 교체.","필요에 따라 수리 또는 교체."]},
  141:{"r":"장비 동작: 없음.","m":"","oc":["PUF 연동(Peristaltic) 펌프의 튜브 세그먼트가 새것이라 늘려줄(길들이기) 필요가 있음.","이전 RESTART 상태에서 자동교정 실패.","PUF 펌프 자동교정 중 정전."],"oa":["","IDLE 화면에서 투석 준비와 PUF 자동교정을 다시 시작. 3. 장비를 껐다 켠 뒤 PUF 자동교정을 다시 수행.",""],"sc":["투석 치료 중 이 파라미터는 올바른 UF 속도 유지를 위한 PUF 펌프 보정값임. PUF 자동교정 후 치료 중 이 값은 약 1 ± 0.04 이어야 함. 이는 보통 펌프 출력이 최초 자동교정 판독값에서 치료 중 판독값으로 변했음을 의미함.","PUF 튜브 세그먼트가 사양을 벗어나거나 불량. 자동교정 중 PUF 펌프는 파라미터 L FEEDBACK에 맞춰짐.","PUF 펌프 보드에서 잘못된 정보.","프로텍티브 PCB 불량.","PUF 펌프 자동교정 중 정전.","UF 뷰렛 충전·배출 관련 유로에 제한.","투석액 유량 불안정."],"sa":["환자 처방(한외여과 속도)이 맞는지 확인. 환자 처방에 어긋나지 않는다면 혈액펌프 속도 증가를 고려. 투석기 사양 준수.","CONFIG 메뉴에서 이 파라미터 한계 변경을 고려.","혈액펌프를 정지시킨 원인을 해결하고 혈액펌프 재시작.","투석액 라인이 꺾이거나 클램프로 막히지 않았는지 확인.","알람 한계 재조정.","알람 상태가 지속되면 카트리지 혈액세트 위치 확인. 압력 포드 다이어프램이 찌그러지지 않았는지 확인. 필요 시 다이어프램 중립 위치 절차 수행 (5.A 특수 절차 참조).","PC, P1, D1, P2, D2가 교정되어 있는지 확인. (알람 142: 정맥압과 Pi 압력 트랜스듀서의 차이가 사용자 설정값에 도달. TMP 파라미터가 NO이면 한 번 리셋 가능, YES이면 OVERRIDE 불가 — 알람 상태 지속 시 화면 표시. 싱글 니들 모드에서는 비활성.)"]},
  142:{"r":"사용자가 설정한 MINIMUM TMP 파라미터. 장비 동작: 없음. 참고: 설정에서 TMP 파라미터가 NO이면 알람이 한 번 나타난 뒤 리셋할 수 있고 다시 나타나지 않음. YES이면 OVERRIDE 할 수 없으며 알람 상태가 지속되는 동안 터치스크린에 표시됨. TMP 아이콘과 시각 알람은 YES/NO와 관계없이 표시됨. 참고: 싱글 니들 모드에서는 막관통압 알람이 비활성.","m":"","oc":["","","","","",""],"oa":["환자 처방(한외여과 속도)이 맞는지 확인. 환자 처방에 어긋나지 않는다면 혈액펌프 속도 증가를 고려. 투석기 사양 준수.","CONFIG 메뉴에서 이 파라미터 한계 변경을 고려.","혈액펌프를 정지시킨 원인을 해결하고 혈액펌프 재시작.","투석액 라인이 꺾이거나 클램프로 막히지 않았는지 확인.","알람 한계 재조정.","알람 상태가 지속되면 카트리지 혈액세트 위치 확인. 압력 포드 다이어프램이 찌그러지지 않았는지 확인. 필요 시 다이어프램 중립 위치 절차 수행 (5.A 특수 절차 참조)."],"sc":["Pi 압력 센서 교정 이탈.","정맥압 센서 교정 이탈.","정맥압 센서 씰 불량.","혈액펌프 로터가 혈액 튜브 세그먼트를 충분히 폐색하지 못함(Under-occlusion).","정맥압 센서~블러드 보드 또는 PI 압력 센서~하이드롤릭 슬레이브 보드 간 신호 수집 계통 불량."],"sa":["메인 Compact Flash 또는 메인 보드 교체. 메인 보드 교체 시 반드시 설정을 먼저 저장할 것.","정맥압 센서 정확도 확인. 필요 시 재교정. 3. 장비 전면의 정맥압 센서 씰을 교체하고 재시험. 4. 혈액펌프 로터 교체 후 재시험.","","","블러드·PIB·하이드롤릭 보드와 마더보드 간 연결 확인. 필요 시 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 후 PA, PB, PUF 펌프 자동교정. 프로텍티브 CPU만 교체한 경우 Disk → Board 복원. 압력 트랜스듀서 교체 시 교정·검증 필수. (다음 알람) 1. Set 모드에서 파라미터를 올바른 값으로 확인. 알람이 지속되면 장비 재시작."]},
  143:{"r":"메인 보드의 UFR 파라미터 관련. 장비 동작: 없음.","m":"","oc":["메인 보드 보호 시스템의 이중 이미지 내부에서 UFR 파라미터 데이터 불일치가 감지됨."],"oa":[""],"sc":["메인 보드 보호 시스템의 이중 이미지 내부에서 UFR 파라미터 데이터 불일치가 감지됨.","","","","","","",""],"sa":["교정 후 교정 결과 확인.","PFS 센서 교체, 교정 및 검증.","알람 압력점 약 950 mmHg 또는 PFS-PI > 650 mmHg 도달. 밸브에서 EV1 구동 전압 24 V로 동작 시험. 밸브 플래퍼 마모 및 밸브 내 이물질 점검.","필요에 따라 청소, 수리 또는 교체.","보드 수리 또는 교체.","물질수지(Mass balance) 관련 부품 EVUFO, EVUF, OW10, EV1S, PS의 내부·외부 누설 확인.","필요에 따라 청소, 수리 또는 교체.","필요에 따라 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 후 PA, PB, PUF 펌프 자동교정. 프로텍티브 CPU만 교체한 경우 Disk → Board 복원. PUF는 적절한 자동교정 필요. 뷰렛 고/저수위 센서 상태와 UF 파라미터는 서비스 화면 섹션 참조. (알람 146: 클린 투석액 울트라필터 관련 압력이 허용 최대값 초과)"]},
  146:{"r":"허용 최대값을 초과하는 측정값을 기록함. 장비 동작: DIALYSIS 및 ADR 중 RESTART 상태로 전환.","m":"","oc":["클린 투석액 울트라필터 막힘.","투석액 커넥터 위치가 잘못됨.","투석액 커넥터가 올바르게 위치하지 않음."],"oa":["치료 중이면 투석액 유량을 낮춰 진행 중인 투석을 계속할 수 있음. 치료 종료 후 절차에 따라 울트라필터 교체.","장비의 현재 단계에 따라 투석기 커넥터를 바이패스 커넥터 또는 투석기에 올바르게 연결한 뒤 RESTART를 누름.","장비의 현재 단계에 따라 투석액 커넥터가 투석기 또는 장비에 올바르게 위치했는지 확인. RESTART를 눌러 현재 동작 재시작."],"sc":["PFS 교정 불량.","PFS 불량.","EV1 막힘 또는 폐색.","PFS 압력 센서·마더보드·하이드롤릭 보드 간 연결 불량.","하이드롤릭 보드 불량."],"sa":["교정 후 교정 결과 확인.","PFS 센서 교체, 교정 및 검증.","알람 압력점 약 950 mmHg 또는 PFS-PI > 650 mmHg 도달. 밸브에서 EV1 구동 전압 24 V로 동작 시험. 밸브 플래퍼 마모 및 밸브 내 이물질 점검.","필요에 따라 청소, 수리 또는 교체.","보드 수리 또는 교체."]},
  147:{"r":"커넥터 또는 범위를 벗어난 판독값. 장비 동작: RESTART 상태로 전환.","m":"","oc":["울트라필터 전단(Pre Ultrafilter) 센서 문제 감지.","","",""],"oa":["정맥라인 클램프에 막힘이 없는지 확인. 클램프에는 정맥 라인만 삽입해야 함.","정맥라인 클램프를 조심스럽게 청소 (세척/소독 섹션 참조).","문제가 지속되면 서비스 요청.","필요에 따라 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행. (알람 148: 정맥라인 클램프가 닫혀야 할 때 열려 있거나 열려야 할 때 닫혀 있음)"],"sc":["PFS 불량.","PFS·마더보드·하이드롤릭 보드 간 연결 불량.","PFS 교정 필요.","하이드롤릭 보드 불량.","",""],"sa":["광학 센서 교체 후 재시험.","클램프 보드 교체 후 재시험.","블러드 보드 교체 후 재시험.","전자석 교체.","해당 연결부 청소·수리 또는 교체.","보드 수리 또는 교체 후 재시험."]},
  148:{"r":"닫혀야 할 때 열려 있거나 열려야 할 때 닫혀 있음. 장비 동작: 없음.","m":"","oc":["정맥라인 클램프 막힘.","정맥라인 클램프 오염.","장비 내부 오작동."],"oa":["정맥라인 클램프에 막힘이 없는지 확인. 클램프에는 정맥 라인만 삽입해야 함.","정맥라인 클램프를 조심스럽게 청소 (세척/소독 섹션 참조).","문제가 지속되면 서비스 요청."],"sc":["클램프 센서 불량.","클램프 보드 불량.","블러드 보드 불량.","전자석 불량.","클램프 보드와 마더보드·프로텍티브·블러드 보드 간 연결 불량.","블러드 또는 프로텍티브 보드 불량."],"sa":["광학 센서 교체 후 재시험.","클램프 보드 교체 후 재시험.","블러드 보드 교체 후 재시험.","전자석 교체.","해당 연결부 청소·수리 또는 교체.","보드 수리 또는 교체 후 재시험."]},

  152:{"r":"메인 보드의 MAX VEN PRESSURE 파라미터 관련. 장비 동작: 없음.","m":"","oc":["메인 보드 보호 시스템의 이중 이미지 내부에서 MAX VEN PRESSURE 파라미터 데이터 불일치가 감지됨."],"oa":["메인 Compact Flash 또는 메인 보드 교체. 메인 보드 교체 시 반드시 설정을 먼저 저장할 것. (알람 153 HIGH LIMIT: 센서 허용 범위를 벗어남) 1. 정맥 라인의 혈류 제한 확인 — 꺾임, 클램프, 정맥 바늘 응고, 환자 정맥 접근부 흐름 불량 등. 정맥압이 적정 범위로 돌아오면 알람 해제. 2. 바늘 크기, 혈류 속도, 항응고제 용량 재평가에 유의."],"sc":["메인 보드 보호 시스템의 이중 이미지 내부에서 MAX VEN PRESSURE 파라미터 데이터 불일치가 감지됨.","","","",""],"sa":["모든 연결부가 올바르게 연결되어 있고 커넥터 핀에 부식이 없는지 확인.","정맥압 센서 교체 후 교정.","정맥 센서 재교정.","블러드 슬레이브 보드 교체.","프로텍티브 슬레이브 보드 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행."]},
  153:{"r":"장비 동작: 혈액펌프 정지, 정맥라인 클램프 닫힘, 한외여과 최소값으로 감소.","m":"","oc":["환자 정맥 접근부 또는 정맥 라인으로의 혈류 제한.","치료 중 혈액농축 및/또는 환자의 불충분한 헤파린화로 정맥압이 다소 상승하여, 고정 혈류 속도에서 해당 바늘의 압력이 증가함."],"oa":["",""],"sc":["정맥압 센서와 PIB 보드 간 또는 PIB 보드와 마더보드 간 연결 불량.","정맥압 센서 불량.","센서 교정 이탈.","블러드 슬레이브 보드 불량.","프로텍티브 슬레이브 보드 불량."],"sa":["모든 연결부가 올바르게 연결되어 있고 커넥터 핀에 부식이 없는지 확인.","정맥압 센서 교체 후 교정.","정맥 센서 재교정.","블러드 슬레이브 보드 교체.","프로텍티브 슬레이브 보드 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 후 PA, PB, PUF 펌프 자동교정. 프로텍티브 CPU만 교체한 경우 Disk → Board 복원. 압력 트랜스듀서 교체 시 교정·검증 필수. (알람 154 HIGH LIMIT: 측정값이 Configuration 메뉴에서 설정한 MAX VEN PRESSURE보다 큼)"]},
  154:{"r":"사용자가 Configuration 메뉴에서 설정한 PRESSURE 값. 장비 동작: 혈액펌프 정지, 정맥라인 클램프 닫힘(참고 참조), 한외여과 최소값으로 감소. 참고: 창에 \"Decrease venous pressure\" 메시지가 표시됨. OVERRIDE는 정맥압이 MAX VEN PRESSURE 초과이면서 +450 mmHg 미만일 때만 정맥라인 클램프를 엶. 이 경우 \"Push OVERRIDE To Open The Venous Clamp\" 메시지가 표시됨.","m":"","oc":[],"oa":[],"sc":["정맥압 센서와 PIB 보드 간 또는 PIB 보드와 마더보드 간 연결 불량.","정맥압 센서 불량.","센서 교정 이탈.","블러드 슬레이브 보드 불량.","프로텍티브 슬레이브 보드 불량."],"sa":["모든 연결부가 올바르게 연결되어 있고 커넥터 핀에 부식이 없는지 확인.","정맥압 센서 교체 후 교정.","정맥 센서 재교정.","블러드 슬레이브 보드 교체.","프로텍티브 슬레이브 보드 교체."]},
  155:{"r":"1. MINIMUM: 정맥압 센서 측정값이 +10 mmHg 미만이거나 사용자가 선택해 압력 그래프에 표시된 최소 범위보다 낮음. 2. MAXIMUM: 정맥압 센서 측정값이 사용자가 선택해 압력 그래프에 표시된 허용 최대 범위보다 높음. 3. UNDEFINED: 정맥압 수집 오류. 장비 동작: 혈액펌프 정지, 정맥라인 클램프 닫힘, 한외여과 최소값으로 감소. 참고: 사용자 메시지 영역에 다음 메시지가 표시됨:","m":"","oc":["MAXIMUM: 정맥압 센서 측정값이 그래프의 허용 최대 범위보다 높음.","UNDEFINED: 정맥압 수집 오류. 장비 동작: 혈액펌프 정지, 정맥라인 클램프 닫힘, 한외여과 감소."],"oa":["",""],"sc":["카트리지 혈액세트와 정맥 씰 사이의 에어 인터페이스 불량.","정맥압 트랜스듀서 교정 이탈.","정맥압 센서 불량.","정맥압 센서와 PIB 보드 간 또는 PIB 보드와 마더보드 간 연결 불량.","블러드 슬레이브 보드 불량.","프로텍티브 슬레이브 보드 불량."],"sa":["씰 교체 후 재시험.","교정 후 재시험.","정맥압 센서 교체 후 교정.","모든 연결부가 올바르게 연결되어 있고 커넥터 핀에 부식이 없는지 확인.","블러드 슬레이브 보드 교체.","프로텍티브 슬레이브 보드 교체."]},

  187:{"r":"전압. 장비 동작: 혈액 감지 전(환자 미연결)에는 없음. DIALYSIS 중 — 알람 160이 발생해 GENERAL SAFE STATE 유발. 경고: 환자 연결 후 이 신호는 #160(Class P 신호, Class P 알람 섹션 참조)이 되어 GENERAL SAFE STATE를 유발하고 장비를 정지시킴.","m":"","oc":[""],"oa":["준비 종료 시까지 알람이 지속되면 DIALYSIS로 진행하지 말 것."],"sc":["전원 공급 장치 고장.","DC 전원 케이블 하네스 불량.","프로텍티브 보드 불량."],"sa":["소프트웨어 설명의 정보를 이용해 실패한 T1 테스트를 트러블슈팅.","커넥터(마더보드 J37)가 깨끗한지 확인하고 다시 장착한 뒤 전압 시험.","프로텍티브 보드 교체 후 재시험. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 후 PA, PB, PUF 펌프 자동교정. 프로텍티브 CPU만 교체한 경우 Disk → Board 복원. (알람 188: T1 테스트 실패에도 계속할지 사용자 확인 요청)"]},
  188:{"r":"T1 테스트 실패에도 정상 운전을 계속할지 (확인 요청) (테스트 설명은 소프트웨어 설명 섹션 참조). 장비 동작: 없음.","m":"","oc":["T1 테스트 실패."],"oa":["T1 테스트 실패에도 진행하려면 OVERRIDE 후 CONFIRM을 누름. 어떤 테스트가 실패했는지 서비스에 알릴 것. 테스트 실패에도 치료를 계속하는 경우 실패한 테스트 관련 파라미터를 주의 깊게 모니터링해야 함."],"sc":["T1 테스트 실패.",""],"sa":["소프트웨어 설명의 정보를 이용해 실패한 T1 테스트를 트러블슈팅. (알람 189: MINIMUM UFR 상태가 4분 이상 지속 — 메시지가 몇 초간 표시 후 자동으로 사라지며, 상태가 지속되면 반복 표시) 1. MINIMUM UFR 액션 키 선택을 해제해 한외여과 속도를 설정값으로 복원. Fluid Removal 알람을 피하려면 Target Loss 또는 UFR 조정이 필요할 수 있음.","치료를 계속하려면 알람 상태를 해결."]},
  189:{"r":"장비 동작: 없음. 참고: 이 메시지는 터치스크린에 몇 초간 표시된 뒤 자동으로 사라짐. 상태가 지속되면 4분마다 표시됨.","m":"","oc":["",""],"oa":["알람 상태를 해결한 뒤 RESTART 키를 누름.","치료를 계속하려면 알람 상태를 해결. (시간 초과로 RESTART 단계로 전환)"],"sc":["UF/소독 뷰렛의 HI/LOW 레벨 센서 또는 LP, LD1, LD2 레벨 센서 관련 문제.","히터가 보정 온도에 도달하지 못함."],"sa":["확인: • 레벨 센서가 정상 판독하는지 물컵에서 확인 • 레벨 센서 청소 필요 여부 • 레벨 센서와 하이드롤릭 보드 간 연결.","히터가 가열되는지 확인. 히터 구동 회로 확인."]},

  274:{"r":"장비 동작: 바이패스 전환, 한외여과(UF) 펌프 정지, 혈액펌프 정지, 정맥라인 클램프 닫힘. 참고: #274 알람의 경보음은 MUTE 버튼으로 끌 수 없음.","m":"","oc":[],"oa":[],"sc":["프로텍티브 보드와 하이드롤릭/블러드 보드 간 연결 불량.","하이드롤릭 또는 블러드 보드 불량."],"sa":["메인 Compact Flash를 교체하고 소프트웨어를 다시 로드한 뒤 재시험. 문제가 지속되면 메인 보드 교체. 메인 보드 교체 시 반드시 설정을 먼저 저장할 것.","PCB를 하나씩 교체해 문제 위치 확인. 불량 보드 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행. (알람 277: 보호 시스템 이중 이미지 내부 AUTOEMPTYING 파라미터 불일치) 1. CONFIG에서 파라미터를 올바른 값으로 복원. 알람이 지속되면 장비 재시작."]},
  277:{"r":"메인 보드의 AUTOEMPTYING 파라미터 관련. 장비 동작: 없음.","m":"","oc":["메인 보드 보호 시스템의 이중 이미지 내부에서 AUTOEMPTYING 파라미터 데이터 불일치가 감지됨."],"oa":[""],"sc":["메인 보드 보호 시스템의 이중 이미지 내부에서 AUTOEMPTYING 파라미터 데이터 불일치가 감지됨.",""],"sa":["메인 Compact Flash를 교체하고 소프트웨어를 다시 로드한 뒤 재시험. 문제가 지속되면 메인 보드 교체. 메인 보드 교체 시 반드시 설정을 먼저 저장할 것. (알람 279: P2 자동교정 중 문제 — 서비스 교정 중에만 발생, P2 자동교정 진행 안 됨) 1. 트러블슈팅 불필요 — 이 알람은 교정 환경에서만 발생. 1. 자동교정을 중지. 교정 툴 상단 튜브를 장비의 수(male) 소독액 커넥터에 연결하고 P2 자동교정 재시작.","자동교정을 중지. 교정 툴에 물이 절반 이상 채워져 있어야 함. P2 자동교정 재시작. 3. 자동교정을 중지. 누설 지점을 찾아 해당 부품을 수리 또는 교체. P2 자동교정 재시작."]},

  294:{"r":"AutoEmptying 절차. 장비 동작: 혈액펌프 정지, 정맥라인 클램프 닫힘.","m":"","oc":["Autoemptying 절차 중 환자 센서가 혈액을 감지함.","정맥 라인이 환자 센서에 올바르게 위치하지 않음.","환자 센서 오염."],"oa":["Autoemptying 절차는 400 ml 후 정지됨. OVERRIDE를 누르면 100 ml가 추가로 주입됨. 2. 환자 센서 내 정맥 라인 위치 확인.","","환자 센서를 조심스럽게 청소."],"sc":["환자 센서 교정 이탈.","환자 센서 고장.","혈액라인 센서 불량. 이 스위치는 환자 센서와 ABD 센서 사이에 위치함.","환자 센서·PIB 보드·마더보드·블러드 보드 간 연결 불량.","PIB 보드 불량.","프로텍티브 보드 불량."],"sa":["불량 연결부 청소·수리 또는 교체.","마더보드와 전원 공급 장치 양쪽에서 전원 전압 확인.","불량 보드 수리 또는 교체. (트러블슈팅 시 본 매뉴얼의 관련 표 참조)","필요에 따라 청소, 수리 또는 교체.","필요에 따라 수리 또는 교체. 교체한 경우 관련된 모든 센서 확인.","필요에 따라 수리 또는 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 후 PA, PB, PUF 펌프 자동교정. 프로텍티브 CPU만 교체한 경우 Disk → Board 복원. (알람 295 COMMUNICATION TIMEOUT: 블러드 슬레이브 보드와 메인 보드 간 통신 문제 감지)"]},

  296:{"r":"보드. 장비 동작: 없음.","m":"","oc":["Bio 슬레이브 보드 일시적 데이터 과부하. 한 번에 너무 많은 정보가 Bio 슬레이브 마이크로프로세서로 전송됨."],"oa":[""],"sc":["메인 보드·마더보드·Bio 슬레이브 보드 간 연결 불량.","전원 공급 장치 전압 이상.","Bio 슬레이브 보드 불량.",""],"sa":["마더보드와 전원 공급 장치 양쪽에서 5 V 확인. 전원부는 정상인데 마더보드에서 낮으면 메인 DC 전원 분배 하네스를 다시 장착하고 재시험. 그래도 문제가 있으면 전원 하네스 교체. 전원부에서 낮으면 전원 공급 장치의 5 V 저하 원인 점검.","필요에 따라 청소, 수리 또는 교체.","Bio 슬레이브 보드와 메인 보드를 하나씩 분리했다가 다시 연결하고 재시험.","보드를 하나씩 교체해 불량 보드 확인. 필요 시 수리 또는 교체."]},
  297:{"r":"장비 동작: 없음.","m":"","oc":["일시적인 통신 문제.","알람이 해제되지 않고 장비가 동작을 멈춘 경우."],"oa":["알람이 해제될 때까지 몇 초간 대기.","사용자 매뉴얼 5.A – 특수 절차의 투석 프로세스 Fast Recovery 절차 참조."],"sc":["+5 V 전원이 허용 한계 미만.","Bio 슬레이브 보드·마더보드·메인 보드 간 연결 불량.","Bio 슬레이브 보드 또는 메인 보드 연결 문제 또는 불량.","Bio 슬레이브 보드 및 메인 보드 불량."],"sa":["마더보드와 전원 공급 장치 양쪽에서 5 V 확인. 전원부는 정상인데 마더보드에서 낮으면 메인 DC 전원 분배 하네스를 다시 장착하고 재시험. 그래도 문제가 있으면 전원 하네스 교체. 전원부에서 낮으면 전원 공급 장치의 5 V 저하 원인 점검.","필요에 따라 청소, 수리 또는 교체.","Bio 슬레이브 보드와 메인 보드를 하나씩 분리했다가 다시 연결하고 재시험.","보드를 하나씩 교체해 불량 보드 확인. 필요 시 수리 또는 교체."]},
  299:{"r":"장비 동작: 없음.","m":"","oc":["LD1 레벨 감지기 오염."],"oa":["RINSE 또는 화학 소독을 수행해 센서의 침착물을 청소."],"sc":["레벨 센서 LD1이 정상 동작해야 함.","LD1 레벨 감지기 오염 또는 불량.","LD1 연결 불량.","EVD1 누설 또는 막힘.","OW4 또는 OR2 막힘.","하이드롤릭 슬레이브 보드 불량."],"sa":["Status 화면에서 투석액 유량 모니터링. ADR 절차 중 유량이 반응하지 않으면 유량계 교체 후 재교정.","불량 연결부 청소·수리 또는 교체 후 재시험.","필요에 따라 수리 또는 교체. (트러블슈팅 시 본 매뉴얼의 관련 표 참조)","EVD1 정상 동작 확인. BT1에서 배수로 가는 퍼지 라인이 막히지 않았는지 확인.","OW4를 분리해 유로 제한 여부 시험. 필요 시 교체 후 재시험.","하이드롤릭 슬레이브 보드 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행. (장비가 수집한 LD1 센서 파라미터는 서비스 섹션의 전체 파라미터 목록 참조.) (알람 300: 투석액 유량 변화에 (유량계가 반응하지 않음))"]},
  300:{"r":"장비 동작: 없음.","m":"","oc":["이물질이 유량계 기어를 막음."],"oa":["Descaling 또는 고온 구연산 절차 수행. 유량계가 완전히 막히면 ADR을 시작할 수 없음."],"sc":["이물질이 유량계 기어를 막음.","유량계·마더보드·하이드롤릭 보드 간 연결 불량.","하이드롤릭 보드 불량."],"sa":["Status 화면에서 투석액 유량 모니터링. ADR 절차 중 유량이 반응하지 않으면 유량계 교체 후 재교정.","불량 연결부 청소·수리 또는 교체 후 재시험.","필요에 따라 수리 또는 교체. (트러블슈팅 시 본 매뉴얼의 관련 표 참조)"]},

  302:{"r":"사용자가 BYPASS를 선택함. 장비 동작: 없음. DIALYSIS 중 — 장비가 DIALYSIS 모드이고 정맥 라인에서 혈액이 감지된 상태에서 활성화됨. 장비가 BYPASS로 전환된 지 6분 후 터치스크린에 알람이 표시됨.","m":"","oc":["하이드롤릭 슬레이브 보드 일시적 데이터 과부하. 한 번에 너무 많은 정보가 하이드롤릭 슬레이브 마이크로프로세서로 전송됨.","장비가 바이패스에서 벗어나지 못함."],"oa":["BYPASS 액션 키를 눌러 장비의 바이패스를 해제.","Phoenix 사용자 매뉴얼 5.A – 특수 절차의 투석 프로세스 Fast Recovery 절차 참조. (알람 304 HYDRAULIC CARD COMM. TIMEOUT: 하이드롤릭 슬레이브 보드와 메인 보드 간 통신 문제 감지) 1. 알람이 해제될 때까지 몇 초간 대기. Phoenix 사용자 매뉴얼 5.A – 특수 절차의 Fast Recovery 절차 참조."],"sc":["메인 보드·마더보드·하이드롤릭 보드 간 연결 불량.","전원 공급 장치 전압 이상.","하이드롤릭 보드 불량."],"sa":["불량 연결부 청소·수리 또는 교체.","마더보드와 전원 공급 장치 양쪽에서 전원 전압 확인.","불량 보드 수리 또는 교체. (트러블슈팅 시 본 매뉴얼의 관련 표 참조) 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행."]},
  304:{"r":"메인 보드. 장비 동작: 없음.","m":"","oc":["하이드롤릭 슬레이브 보드 일시적 데이터 과부하. 한 번에 너무 많은 정보가 하이드롤릭 슬레이브 마이크로프로세서로 전송됨."],"oa":[""],"sc":["메인 보드·마더보드·하이드롤릭 보드 간 연결 불량.","전원 공급 장치 전압 이상.","하이드롤릭 보드 불량.",""],"sa":["SET 모드에서 동맥압 바 그래프를 선택하고 CONFIRM을 누름. OVERRIDE를 눌러 혈액펌프 재시작.","카트리지 연결부와 환자 접근부를 주의 깊게 확인. OVERRIDE를 눌러 혈액펌프 재시작.","동맥 라인과 환자 동맥 접근부의 꺾임, 클램프, 기타 제한(동맥 바늘 응고, 환자 동맥 접근부 흐름 불량 등) 확인. OVERRIDE를 눌러 혈액펌프 재시작. 환자 처방에 어긋나지 않는다면 동맥압을 관찰하며 혈류량을 천천히 높이는 것을 고려.","다이어프램 중립 위치 절차 수행 (특수 절차 섹션 참조). OVERRIDE를 눌러 혈액펌프 재시작."]},
  305:{"r":"MINIMUM: 동맥압 센서 측정값이 사용자가 선택해 동맥압 바 그래프에 표시된 최소 범위보다 낮음. MAXIMUM: 동맥압 센서 측정값이 사용자가 선택해 동맥압 바 그래프에 표시된 허용 최대 범위보다 높음. UNDEFINED: 동맥압 수집 오류. 장비 동작: 혈액펌프 정지, 한외여과 속도 최소값으로 감소, 정맥라인 클램프 닫힘. 참고: 사용자 메시지 영역에 \"Check blood line and patient's access. Press Override to restart the Pump.\" 메시지가 표시됨.","m":"","oc":["","MAXIMUM","UNDEFINED — MINIMUM: 동맥압 센서 측정값이 바 그래프 최소 범위보다 낮음. MAXIMUM: 동맥압 센서 측정값이 바 그래프 허용 최대 범위보다 높음. UNDEFINED: 동맥압 수집 오류. 장비 동작: 혈액펌프 정지, 한외여과 속도 감소, 정맥라인 클램프 닫힘.",""],"oa":["SET 모드에서 동맥압 바 그래프를 선택하고 CONFIRM을 누름. OVERRIDE를 눌러 혈액펌프 재시작.","카트리지 연결부와 환자 접근부를 주의 깊게 확인. OVERRIDE를 눌러 혈액펌프 재시작.","동맥 라인과 환자 동맥 접근부의 꺾임, 클램프, 기타 제한(동맥 바늘 응고, 환자 동맥 접근부 흐름 불량 등) 확인. OVERRIDE를 눌러 혈액펌프 재시작. 환자 처방에 어긋나지 않는다면 동맥압을 관찰하며 혈류량을 천천히 높이는 것을 고려.","다이어프램 중립 위치 절차 수행 (특수 절차 섹션 참조). OVERRIDE를 눌러 혈액펌프 재시작. (원인이 파악·제거되지 않은 상태에서 ! ARTERIAL PRESSURE #305 알람을 해제하기 위해 (OVERRIDE를 반복하지 말 것).)"],"sc":["카트리지 혈액세트와 동맥 씰 사이의 에어 인터페이스 불량.","동맥압 트랜스듀서 교정 이탈.","동맥압 센서 불량.","동맥압 센서와 PIB 보드 간 또는 PIB 보드와 마더보드 간 연결 불량.","블러드 슬레이브 보드 불량.","프로텍티브 슬레이브 보드 불량."],"sa":["모든 연결부가 올바르게 연결되어 있고 커넥터 핀에 부식이 없는지 확인.","동맥압 센서 교체 후 교정.","동맥 센서 재교정 후 시험.","블러드 슬레이브 보드 교체.","프로텍티브 슬레이브 보드 교체.","프로텍티브 슬레이브 보드 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 후 PA, PB, PUF 펌프 자동교정. 프로텍티브 CPU만 교체한 경우 Disk → Board 복원. 압력 트랜스듀서 교체 시 교정·검증 필수. (알람 306: 측정값이 사용자가 설정한 MIN ART PRESSURE 값 미만)"]},
  306:{"r":"Configuration 메뉴 (설정값). 장비 동작: 혈액펌프 정지, 한외여과 속도 최소값으로 감소, 정맥라인 클램프 닫힘.","m":"","oc":["동맥 라인이 환자에게서 분리되었을 수 있음.","혈액펌프 속도가 너무 빠름.","동맥 라인이 꺾이거나 클램프로 막히거나 제한됨.","치료 중 혈액농축 및/또는 환자의 불충분한 헤파린화로 동맥압이 다소 감소하여, 고정 혈류 속도에서 해당 바늘의 압력이 낮아짐."],"oa":["카트리지 연결부와 환자 접근부를 주의 깊게 확인. OVERRIDE를 눌러 혈액펌프 재시작.","환자 처방에 어긋나지 않는다면 혈류량 감소를 고려. OVERRIDE를 눌러 혈액펌프 재시작.","동맥 라인과 환자 동맥 접근부의 꺾임, 클램프, 기타 제한(동맥 바늘 응고, 환자 동맥 접근부 흐름 불량 등) 확인. OVERRIDE를 눌러 혈액펌프 재시작.","바늘 크기, 혈류 속도, 항응고제 용량 재평가에 유의. OVERRIDE를 눌러 혈액펌프 재시작. (원인이 파악·제거되지 않은 상태에서 ! ARTERIAL PRESSURE LIMIT #306 알람을 해제하기 위해 (OVERRIDE를 반복하지 말 것).)"],"sc":["동맥압 센서와 PIB 보드 간 또는 PIB 보드와 마더보드 간 연결 불량.","동맥압 센서 불량.","센서 교정 이탈.","블러드 슬레이브 보드 불량.","프로텍티브 슬레이브 보드 불량."],"sa":["메인 Compact Flash를 교체하고 소프트웨어를 다시 로드한 뒤 재시험. 문제가 지속되면 메인 보드 교체. 메인 보드 교체 시 반드시 설정을 먼저 저장할 것.","동맥압 센서 교체 후 교정.","동맥 센서 재교정 후 시험.","블러드 슬레이브 보드 교체.","프로텍티브 슬레이브 보드 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 후 PA, PB, PUF 펌프 자동교정. 프로텍티브 CPU만 교체한 경우 Disk → Board 복원. 압력 트랜스듀서 교체 시 교정·검증 필수. (알람 307: 보호 시스템 이중 이미지 내부 ARTERIAL 파라미터 불일치) 1. Set 모드에서 파라미터를 올바른 값으로 복원. 알람이 지속되면 장비 재시작."]},
  307:{"r":"메인 보드의 보호 시스템. 장비 동작: 없음.","m":"","oc":["메인 보드 보호 시스템의 이중 이미지 내부에서 ARTERIAL 파라미터 데이터 불일치가 감지됨."],"oa":[""],"sc":["메인 보드 보호 시스템의 이중 이미지 내부에서 ARTERIAL 파라미터 데이터 불일치가 감지됨.","",""],"sa":["환자 센서 LED를 교정한 뒤 교정 결과 확인. 2. 배선 연결이 양호한지 확인. 환자 센서 불량 — 필요 시 수리 또는 교체. 3. 보드 수리 또는 교체. 관련된 모든 센서 확인.","투석액 준비 중 혈액펌프가 가동 중일 때 알람이 발생하면 진행할 수 없음. 장비를 끄고, 기포감지기에서 정맥 라인을 분리한 뒤 부드러운 천으로 환자 센서와 그 주변 기포감지기 표면을 조심스럽게 청소. 정맥 라인을 기포감지기에 다시 삽입하고 장비를 켬. PRIME 또는 RECIRCULATION 중 알람이 발생하면 장비가 강제로 PATIENT CONNECT 화면으로 전환됨. 현재 투석 치료 종료 후 새 투석을 시작하기 전에 위 절차대로 환자 센서를 청소. (PRIME 중에는 #342 알람이 함께 발생할 수 있음 — 해제 방법은 해당 알람 설명 참조.)","보드 수리 또는 교체."]},
  308:{"r":"장비 동작: 혈액펌프 정지. 참고: 장비에 표준 부저가 설치된 경우 #308 알람의 경보음은 낮은 음의 변조음임.","m":"","oc":[""],"oa":["투석액 준비 중 혈액펌프가 가동 중일 때 알람이 발생하면 진행할 수 없음. 장비를 끄고, 기포감지기에서 정맥 라인을 분리한 뒤 부드러운 천으로 환자 센서와 그 주변 기포감지기 표면을 조심스럽게 청소. 정맥 라인을 기포감지기에 다시 삽입하고 장비를 켬. PRIME 또는 RECIRCULATION 중 알람이 발생하면 장비가 강제로 PATIENT CONNECT 화면으로 전환됨. 현재 투석 치료 종료 후 새 투석을 시작하기 전에 위 절차대로 환자 센서를 청소. (PRIME 중에는 #342 알람이 함께 발생할 수 있음 — 해제 방법은 해당 알람 설명 참조.)"],"sc":["환자 센서 교정 이탈.","환자 센서 불량 또는 배선 연결 불량.","환자 센서를 구동하는 PIB 보드 회로 불량.","프로텍티브 보드 불량."],"sa":["환자 센서 LED를 교정한 뒤 교정 결과 확인. 2. 배선 연결이 양호한지 확인. 환자 센서 불량 — 필요 시 수리 또는 교체. 3. 보드 수리 또는 교체. 관련된 모든 센서 확인.","","","보드 수리 또는 교체."]},

  318:{"r":"알람. 장비 동작: 혈액펌프 꺼짐.","m":"","oc":["카트리지 혈액세트가 생리식염수로 채워져 있으면 압력이 0 mmHg와 다를 수 있음.","T1 테스트의 정맥/동맥 압력 테스트 중 카트리지 혈액세트가 잘못 장착됨.","혈액펌프 커버가 열려 있음.","자석이 오염됨."],"oa":["카트리지 식염수 라인과 동맥·정맥 라인을 클램프로 막음. 동맥·정맥 접근 라인을 대기에 개방. 터치스크린의 압력 표시가 0 mmHg 쪽으로 감소해야 함.","정맥 라인은 기포감지기에 삽입되고 도어가 닫혀 있어야 함. 혈액펌프 커버도 닫혀 있어야 함. 카트리지 혈액세트를 다시 장착하고 T1 테스트 재시작.","혈액펌프 커버를 닫음. 커버가 확실히 잠겼는지 확인.","에틸알코올(90°) 또는 이소프로필알코올(70°)을 적신 부드러운 천으로 혈액펌프 커버 뒤의 자석을 조심스럽게 청소."],"sc":["정맥 또는 동맥압 트랜스듀서 교정 이탈.","혈액펌프 도어에서 자석이 떨어짐.","도어 센서 불량.","홀 센서·마더보드·블러드 슬레이브 보드 간 연결 불량.","자석 불량.","블러드 슬레이브 보드 불량.","자석이 거꾸로 장착됨."],"sa":["정맥 또는 동맥압 센서 교정 절차 수행.","혈액펌프 도어의 자석 유무 확인. 없으면 혈액펌프 도어 교체.","혈액펌프를 분리하고 혈액펌프 로터 PCB 교체. 부품 확인 중 Status 화면에서 신호 확인.","홀 센서 보드와 마더보드·블러드 슬레이브 보드 간 연결이 깨끗하고 양호한지 확인. 연결 확인 중 Status 화면에서 신호 확인.","혈액펌프 도어 교체.","블러드 슬레이브 보드 교체 후 동작 확인.","혈액펌프 도어 교체."]},
  319:{"r":"(압력이) 0 mmHg에 가깝지 않음. 장비 동작: 이 시점에서 정지하며 테스트를 더 진행하지 않음.","m":"","oc":["카트리지 혈액세트가 생리식염수로 채워져 있으면 압력이 0 mmHg와 다를 수 있음.","T1 테스트의 정맥/동맥 압력 테스트 중 카트리지 혈액세트가 잘못 장착됨.","혈액펌프 커버가 열려 있음.","자석이 오염됨."],"oa":["카트리지 식염수 라인과 동맥·정맥 라인을 클램프로 막음. 동맥·정맥 접근 라인을 대기에 개방. 터치스크린의 압력 표시가 0 mmHg 쪽으로 감소해야 함.","정맥 라인은 기포감지기에 삽입되고 도어가 닫혀 있어야 함. 혈액펌프 커버도 닫혀 있어야 함. 카트리지 혈액세트를 다시 장착하고 T1 테스트 재시작.","혈액펌프 커버를 닫음. 커버가 확실히 잠겼는지 확인.","에틸알코올(90°) 또는 이소프로필알코올(70°)을 적신 부드러운 천으로 혈액펌프 커버 뒤의 자석을 조심스럽게 청소."],"sc":["정맥 또는 동맥압 트랜스듀서 교정 이탈.","혈액펌프 도어에서 자석이 떨어짐.","도어 센서 불량.","홀 센서·마더보드·블러드 슬레이브 보드 간 연결 불량.","자석 불량.","블러드 슬레이브 보드 불량.","자석이 거꾸로 장착됨."],"sa":["장비를 껐다 켬. 서비스 작업 중 문제가 발생하면 모의 투석 치료를 수행 또는 반복. (알람 321 DUPLICATE STATION: 이 장비에 할당된 STATION ID가 다른 장비에서 사용 중(중복) — 오류 해결 시 자동 리셋, \"STATION ID ERROR\" 알람도 함께 표시) 1. 장비의 STATION ID가 클리닉에 게시된 STATION ID와 일치하는지 확인. 다른 스테이션도 확인. 잘못된 장비의 STATION ID를 변경해 중복을 해소. CentryNet 옵션이 설치되지 않았거나 사용하지 않는 경우 옵션을 OFF로 전환해야 함. 네트워크 컨트롤러는 치료 중 데이터를 보관했다가 장비가 온라인으로 복귀하면 수집함.","DIALYSIS 중 이 알람이 발생하면 투석 프로세스 Fast Recovery 수행. Phoenix 사용자 매뉴얼 5.A – 특수 절차의 Fast Recovery 절차 참조.","혈액펌프를 분리하고 혈액펌프 로터 PCB 교체. 부품 확인 중 Status 화면에서 신호 확인.","홀 센서 보드와 마더보드·블러드 슬레이브 보드 간 연결이 깨끗하고 양호한지 확인. 연결 확인 중 Status 화면에서 신호 확인.","혈액펌프 도어 교체.","블러드 슬레이브 보드 교체 후 동작 확인.","혈액펌프 도어 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행. 혈액펌프 도어 상태와 Pump Cover 파라미터는 서비스 화면 섹션 참조. (알람 320: 알람 상태 관련 코드)"]},
  321:{"r":"네트워크. 장비 동작: 환자 시스템에는 영향 없음. 오류 상태가 해결되면 자동 리셋. \"CENTRYNET: STATION ID ERROR\" 알람도 함께 표시됨.","m":"","oc":["동일한 STATION ID 번호가 이미 다른 장비에 할당됨.","",""],"oa":["CentryNet 관련 모든 설정 항목 확인.","스테이션을 네트워크에 추가 (방법은 통신 섹션 참조).","장비 수와 수집 데이터량에 맞게 폴링 타이머 한계를 변경해야 할 수 있음."],"sc":["네트워크 통신이 중단됨.","RS485 인터페이스 카드 불량."],"sa":["네트워크 내 케이블 연결 확인. 데이터 송수신이 되도록 필요 시 연결 조정.","카드로 연결된 모든 케이블 확인. 인터페이스 카드 LED가 정상 점등되는지 확인. 필요 시 인터페이스 카드 교체. CentryNet 옵션이 설치되지 않았거나 사용하지 않는 경우 옵션을 OFF로 전환해야 함. 네트워크 컨트롤러는 치료 중 데이터를 보관했다가 장비가 온라인으로 복귀하면 수집함."]},
  322:{"r":"(예상 폴링 시간 내에 장비가 폴링을 받지 못함). 장비 동작: 환자 시스템에는 영향 없음. 오류 상태가 해결되면 자동 리셋. PATIENT ID/STOP COLLECT 키 비활성. 아이콘이 Off-Line 표시로 바뀜.","m":"","oc":["설정 항목이 잘못됨.","CentryNet 네트워크 컨트롤러에 이 스테이션이 프로그래밍되지 않음.","Offline Timeout(폴링 타이머) 한계를 초과함."],"oa":["CentryNet 관련 모든 설정 항목 확인.","스테이션을 네트워크에 추가 (방법은 통신 섹션 참조).","장비 수와 수집 데이터량에 맞게 폴링 타이머 한계를 변경해야 할 수 있음."],"sc":["네트워크 통신이 중단됨.","RS485 인터페이스 카드 불량.","",""],"sa":["네트워크 내 케이블 연결 확인. 데이터 송수신이 되도록 필요 시 연결 조정.","카드로 연결된 모든 케이블 확인. 인터페이스 카드 LED가 정상 점등되는지 확인. 필요 시 인터페이스 카드 교체.","네트워크 컨트롤러가 다른 장비 폴링을 마칠 때까지 대기.","CentryNet 옵션을 OFF로 하고 해당 치료 기록은 수기로 작성. 다음 치료 때 CentryNet을 다시 ON으로 하여 문제가 해소되었는지 확인. 5. CentryNet 옵션을 OFF로 하고 CentryNet 없이 장비 사용 계속. CENTRYNET: STATION OFFLINE #322 알람 메시지와 트러블슈팅 안내 참조. 1. 네트워크 내 케이블 연결 확인. 데이터 송수신이 되도록 필요 시 연결 조정."]},
  323:{"r":"(모든) 데이터베이스가 네트워크 컨트롤러에 수집됨. 장비 동작: 환자 시스템에는 영향 없음. 오류 상태가 해결되면 자동 리셋.","m":"","oc":["치료가 정상 종료(RINSEBACK, DESCALING, FINAL RINSE 등)되었으나 해당 치료의 모든 데이터가 아직 네트워크 컨트롤러에 수집되지 않음.","STOP COLLECT 액션 키를 눌렀으나 현재 치료의 모든 데이터가 아직 네트워크 컨트롤러에 수집되지 않음.","네트워크 컨트롤러가 다른 장비를 폴링 중.","내부 (오류)로 CentryNet이 이 치료의 일부 기록을 수집할 수 없음.","스테이션이 오프라인 상태 — 결국 STATION OFFLINE 알람 상태가 발생함."],"oa":["","데이터 수집이 완료될 때까지 몇 분 대기한 뒤 STOP COLLECT를 다시 누름.","네트워크 컨트롤러가 다른 장비 폴링을 마칠 때까지 대기.","CentryNet 옵션을 OFF로 하고 해당 치료 기록은 수기로 작성. 다음 치료 때 CentryNet을 다시 ON으로 하여 문제가 해소되었는지 확인. 5. CentryNet 옵션을 OFF로 하고 CentryNet 없이 장비 사용 계속. CENTRYNET: STATION OFFLINE #322 알람 메시지와 트러블슈팅 안내 참조.",""],"sc":["네트워크 통신이 중단됨.","RS485 인터페이스 카드 불량.","",""],"sa":["CentryNet 관련 모든 설정 항목 확인. 2. 조치 불필요 — 통신 프로세스가 완료될 때까지 대기하면 알람이 자동 해제됨. 3. 조치 불필요 — 통신 프로세스가 완료될 때까지 대기하면 알람이 자동 해제됨. 4. 알람이 발생한 장비의 STATION ID가 클리닉에 게시된 STATION ID와 일치하는지 확인. 한 장비의 STATION ID를 변경해 중복을 해소.","필요 시 인터페이스 카드 교체.","스테이션 재할당 시도. Station ID 번호가 올바른지 확인. 번호가 변경되었으면 PHOENIX 컴퓨터 보드를 점검. 4. 다음을 확인: • 네트워크 케이블 신호선 손상 — 도통 점검 또는 네트워크 케이블 테스트 세트 사용 • CentryNet 프로그램 오작동 — CentryNet 프로그램 점검 • 네트워크 컨트롤러 오작동 — 네트워크 컨트롤러 하드웨어 점검.","STATION ID가 클리닉 내 실제 위치와 일치하는지 확인. 치료 중이 아니면 PHOENIX를 재부팅해 STATION ID 할당을 재초기화. 1. 장비와 벽면 케이블 연결 확인. 데이터 송수신이 되도록 필요 시 연결 조정."]},
  325:{"r":"해당 스테이션의 PHOENIX 장비 ID, 또는 장비가 해당 스테이션에 할당되지 않음(할당 대기). 장비 동작: 환자 시스템에는 영향 없음. 오류 상태가 해결되면 자동 리셋.","m":"","oc":["설정 항목이 잘못됨.","새 STATION ID를 처리 중.","장비 또는 CentryNet 옵션이 방금 켜져 통신을 설정 중.","두 스테이션이 동일한 STATION ID를 가짐 — 화면에 CENTRYNET: DUPLICATE STATION(알람 #321) 메시지가 나타남.","CentryNet에서 STATION ID 할당이 손실되었거나 변경됨."],"oa":["CentryNet 관련 모든 설정 항목 확인. 2. 조치 불필요 — 통신 프로세스가 완료될 때까지 대기하면 알람이 자동 해제됨. 3. 조치 불필요 — 통신 프로세스가 완료될 때까지 대기하면 알람이 자동 해제됨. 4. 알람이 발생한 장비의 STATION ID가 클리닉에 게시된 STATION ID와 일치하는지 확인. 한 장비의 STATION ID를 변경해 중복을 해소.","","","","STATION ID가 클리닉 내 실제 위치와 일치하는지 확인. 치료 중이 아니면 PHOENIX를 재부팅해 STATION ID 할당을 재초기화."],"sc":["장비에서 네트워크 컨트롤러로의 통신 실패 — PC Rx 케이블 선 손상.","RS485 인터페이스 카드 불량.","스테이션이 스테이션 할당을 잃음.","네트워크 컨트롤러가 이 장비와 통신하지 않음."],"sa":["","자석 또는 WHO 도어 교체. 3. SWW까지의 하네스 도통 확인. 필요 시 수리 또는 교체.","스테이션 재할당 시도. Station ID 번호가 올바른지 확인. 번호가 변경되었으면 PHOENIX 컴퓨터 보드를 점검. 4. 다음을 확인: • 네트워크 케이블 신호선 손상 — 도통 점검 또는 네트워크 케이블 테스트 세트 사용 • CentryNet 프로그램 오작동 — CentryNet 프로그램 점검 • 네트워크 컨트롤러 오작동 — 네트워크 컨트롤러 하드웨어 점검. (CentryNet 옵션 미설치/OFF 시 기록은 사용자가 수기로 관리. 네트워크 컨트롤러는 치료 중 데이터를 보관함.) (알람 326: WHO 도어가 닫혀야 하는 운전 단계에서 열려 있음) 1. 도어가 닫혔는지 확인. 1. 도어를 열고 닫은 상태에서 SWW 양단 전압 측정. 전압이 변하지 않으면 스위치 불량. 필요 시 수리 또는 교체.","필요에 따라 교체. 보드 교체 시 Disk → 해당 보드로 데이터 복원(현재 장비 SW 버전), 모든 센서 점검·교정. CPU(Micro 68HC11)만 교체한 경우 DATA RESTORE 수행."]},

  343:{"r":"유량계 드리프트로 인함. 장비 동작: 없음. 참고: 사용자 메시지 영역에 \"치료 중 Flow Balance 알람이 발생할 수 있음. 치료 종료 시 최대 시간으로 Descale 권장, 또는 지금 산 기반 화학 소독 수행\" 메시지가 표시됨.","m":"","oc":[""],"oa":["OVERRIDE를 눌러 알람 해제. 투석 준비를 중지하고 IDLE 화면으로 돌아감. DESCALING 또는 화학 소독으로 유량계 침착물을 청소한 뒤 투석 준비 재시작. 문제가 지속되면 장비를 끄고 서비스 요청. 2. OVERRIDE를 눌러 알람 해제. 투석 준비를 중지하고 IDLE 화면으로 돌아감. 투석 준비 재시작. 문제가 지속되면 장비를 끄고 서비스 요청."],"sc":["D2 유량계·마더보드·프로텍티브 보드 간 연결 불량.","하이드롤릭 회로에서 물/공기 누설.","유량계 노화 또는 유량계 교정 드리프트로 테스트 실패.","하이드롤릭 또는 프로텍티브 슬레이브 보드 불량.","P1 펌프 불량으로 투석액 유량 불안정."],"sa":["불량 연결부 청소·수리 또는 교체 후 재시험.","하이드롤릭 회로 누설 확인. 누설 지점을 찾아 해당 부품을 수리 또는 교체.","유량계 재교정. 교정 중 \"Component out of range\" 메시지가 나타나면 유량계 교체.","보드를 하나씩 교체해 문제 위치 확인. 보드 수리 또는 교체.","필요에 따라 수리 또는 교체. (트러블슈팅 시 본 매뉴얼의 관련 표 참조)"]},
  351:{"r":"장비 동작: 혈액펌프 정지, 정맥라인 클램프 닫힘. 참고: 장비가 정맥압 값의 변화를 감지하지 못하면 OVERRIDE가 효과 없음.","m":"","oc":["","","","",""],"oa":["혈액 라인과 환자 접근부의 꺾임, 클램프, 기타 제한 확인. OVERRIDE를 눌러 혈액펌프를 재시작하고 알람 해제.","카트리지 혈액세트에 응고가 없는지 확인. OVERRIDE를 눌러 혈액펌프를 재시작하고 알람 해제.","OVERRIDE를 눌러 혈액펌프를 재시작하고 알람 해제.","다이어프램 중립 위치 절차 수행 (5.A – 특수 절차 참조). OVERRIDE를 눌러 혈액펌프를 재시작하고 알람 해제.","OVERRIDE를 눌러 혈액펌프를 재시작하고 알람 해제. 라인을 클램프에 장착."],"sc":["카트리지 혈액세트와 정맥 씰 사이의 에어 인터페이스 불량.","정맥압 트랜스듀서 교정 이탈.","정맥압 센서 불량.","정맥압 센서와 PIB 보드 간 또는 PIB 보드와 마더보드 간 연결 불량.","블러드 슬레이브 보드 불량.","프로텍티브 슬레이브 보드 불량."],"sa":["씰 교체 후 재시험.","교정 후 재시험.","정맥압 센서 교체 후 교정.","모든 연결부가 올바르게 연결되어 있고 커넥터 핀에 부식이 없는지 확인.","블러드 슬레이브 보드 교체.","프로텍티브 슬레이브 보드 교체."]},

  353:{"r":"배터리 백업 키트(BACKUP KIT). 장비 동작: RINSE 중 — 없음. 소독 및 DIALYSIS 중 — 히터 꺼짐.","m":"","oc":["RINSE 또는 소독 중 AC 전원 차단.","DIALYSIS의 투석액 준비 단계~환자 연결 전 AC 전원 차단.","DIALYSIS 치료 단계 중 AC 전원 차단.","DIALYSIS의 EMPTYING 또는 DESCALING 중 AC 전원 차단."],"oa":["","","",""],"sc":["전원 공급 장치 퓨즈 단선.","배터리 백업과 마더보드 간 연결 불량(UPS_ON 신호).","하이드롤릭 슬레이브 보드와 마더보드(J31 커넥터) 간 연결 불량(UPS_ON 신호)."],"sa":["전원 공급 장치의 \"N\"과 \"L\" 라인 사이에 주전원 전압이 있는지 확인. 없으면 전원 공급 장치 교체.","장비를 끄고 배터리 백업을 분리. 장비를 켰을 때 알람이 여전히 있으면 UPS_ON 신호 확인. UPS_ON 신호가 High이면 전원 공급 장치 교체.","장비를 끄고 배터리 백업을 분리. 장비를 켰을 때 알람이 여전히 있으면 UPS_ON 신호 확인. UPS_ON 신호가 Low이면 하이드롤릭 슬레이브 보드 교체."]},
  354:{"r":"THRESH 퍼센트. (TARGET Kt/V THRESH 파라미터는 IDLE 모드의 CONFIG\\Kt/V 화면에서 설정.) 장비 동작: 없음. 참고: 사용자 메시지 영역에 \"Clearance/Qb 일치 여부 확인, 치료 시간/처방 일치 여부 확인, SET 모드에서 목표 수정 후 OVERRIDE를 눌러 메시지 취소\" 메시지가 표시됨. 참고: \"FORECAST KT/V DOES NOT MATCH RX..\" #354 알람은 TARGET Kt/V THRESH 파라미터가 0이 아닌 값으로 설정되고 TARGET Kt 또는 TARGET Kt/V 값이 확인/입력된 경우에만 발생함.","m":"","oc":[""],"oa":["응고 원인을 파악하고 투석기 교체. OVERRIDE를 눌러 알람 해제. 2. 환자 접근부의 바늘 위치가 올바른지 확인. 환자 처방에 어긋나지 않는다면 혈류량 감소를 고려. OVERRIDE를 눌러 알람 해제. 3. 선택한 투석기가 처방 투석량을 전달하기에 적합한지 확인. OVERRIDE를 눌러 알람 해제. 4. 환자 처방이 올바른지 확인. 환자 처방에 어긋나지 않는다면 혈류 속도 증가를 고려. OVERRIDE를 눌러 알람 해제. 5. 투석액 커넥터를 올바르게 연결. OVERRIDE를 눌러 알람 해제. 6. 환자 처방이 올바른지 확인. 환자 처방에 어긋나지 않는다면 TREATMENT TIME 증가를 고려. OVERRIDE를 눌러 알람 해제. 7. 환자 처방이 올바른지 확인. 프로그램된 TARGET Kt 및/또는 TARGET Kt/V 값 변경, 또는 TARGET Kt/V THRESH 파라미터를 더 낮게 설정하는 것을 고려. OVERRIDE를 눌러 알람 해제. (알람 355 Kt/Kt/V TARGET ACHIEVED) 1. OVERRIDE를 눌러 알람 해제. 2. OVERRIDE를 눌러 알람 해제."],"sc":[],"sa":[]},
  355:{"r":"(VOL OF DISTRIB·DRY WEIGHT 파라미터 미확인 시) DEPURATED VOLUME이 TARGET Kt 값 이상. VOL OF DISTRIB·DRY WEIGHT 파라미터 확인 시: IONIC Kt/V가 TARGET Kt/V 값 이상. 장비 동작: 없음. 참고: CONFIG에서 TARGET Kt/V Reached 파라미터를 NO 또는 YES로 설정 가능. NO이면 Kt - Kt/V TARGET ACHIEVED 알람이 꺼져 나타나지 않음. YES이면 알람이 한 번 나타난 뒤 OVERRIDE로 리셋할 수 있고 같은 치료 중에는 다시 나타나지 않음. (관련 파라미터 값을 변경하면 치료 중 알람이 다시 나타날 수 있음.)","m":"","oc":[""],"oa":["겹쳐 표시되는 창의 안내를 따름: 기포감지기에서 정맥 라인을 분리하고 부드러운 천으로 정맥 라인, 환자 센서, 그 주변 기포감지기 표면을 조심스럽게 청소. 정맥 라인을 기포감지기에 다시 삽입. 터치스크린 아이콘 영역에 \"No blood detected\" 환자 센서 아이콘이 표시되는지 확인한 뒤 CONFIRM을 눌러 알람 해제. (청소·건조 후에도 혈액이 감지되면 W! Blood sensed in venous line #359 알람 메시지가 창에 다시 표시됨. 사용자는 정해진 최대 시간 내에 정맥 라인을 분리해 환자 센서와 정맥 라인을 건조할 수 있음.)"],"sc":[],"sa":[]},
  359:{"r":"투석기 (프라이밍 전) 혈액펌프가 가동 중. 장비 동작: 혈액펌프 정지. 참고: 알람 발생 시 다음 창이 겹쳐 표시됨 — 라인에 혈액이 있으면 CONFIRM을 누름. 또는: 환자 센서에서 정맥 라인 분리 → 정맥 라인과 환자 센서 슬롯 청소·건조 → 정맥 라인을 환자 센서에 다시 장착 → 투석액 준비가 완료되었으면 CONFIRM을 누름.","m":"","oc":[""],"oa":["겹쳐 표시되는 창의 안내를 따름: 기포감지기에서 정맥 라인을 분리하고 부드러운 천으로 정맥 라인, 환자 센서, 그 주변 기포감지기 표면을 조심스럽게 청소. 정맥 라인을 기포감지기에 다시 삽입. 터치스크린 아이콘 영역에 \"No blood detected\" 환자 센서 아이콘이 표시되는지 확인한 뒤 CONFIRM을 눌러 알람 해제. (청소·건조 후에도 혈액이 감지되면 W! Blood sensed in venous line #359 알람 메시지가 창에 다시 표시됨. 사용자는 정해진 최대 시간 내에 정맥 라인을 분리해 환자 센서와 정맥 라인을 건조할 수 있음.)"],"sc":["환자 센서 교정 이탈.","환자 센서 불량 또는 배선 연결 불량.","환자 센서를 구동하는 PIB 보드 회로 불량.","프로텍티브 보드 불량."],"sa":["환자 센서 LED를 교정한 뒤 교정 결과 확인. 2. 배선 연결이 양호한지 확인. 환자 센서 불량 — 필요 시 수리 또는 교체. 3. 보드 수리 또는 교체. 관련된 모든 센서 확인.","","","보드 수리 또는 교체."]}
