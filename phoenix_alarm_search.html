    fClass:"클래스", fOvr:"오버라이드", all:"전체",
    segP:"P — 환자", segPd:"Pd — 데이터 오류", segA:"A — 주의 요망", segB:"B — 바이패스", segC:"C — 경고(Caution)",
    segD:"D — 장치", segE:"E — 설비", segW:"W — 경고(Warning)", segYesR:"YES [R] — 리셋 필요",
    emptyH:"검색 결과 없음", emptyP:"다른 검색어를 입력하거나 필터를 해제하세요.",
    navSearch:"검색", navClass:"클래스별", navGuide:"클래스 안내",
    alarms:"개 알람", alarm:"개 알람", noRes:"검색 결과 없음", showing:"", of:"/", showingAll:"전체",
    lReason:"알람 발생 원인", lMachine:"장비 동작", lOp:"사용자 (원인 → 조치)",
    lSv:"서비스 (원인 → 조치)", cause:"원인", dClass:"알람 클래스", dAttr:"속성 / 세부 유형", dOvr:"오버라이드",
    notes:"참고", koNote:"※ 한글은 서비스 매뉴얼 영문의 참고 번역입니다. 장비 화면 메시지·버튼명은 영문 그대로 표기하며, 판단이 애매할 때는 EN 원문을 기준으로 하세요."}
};
var LANG = 'en';
try { if (localStorage.getItem('phxAlarmLang') === 'ko') LANG = 'ko'; } catch(e) {}
function t(k){ return I18N[LANG][k]; }
function clsInfo(c){
  var ci = CLASS_INFO[c] || CLASS_INFO['sp'];
  if (LANG !== 'ko') return ci;
  var k = CLASS_KO[c] || CLASS_KO['sp'];
  return {label:k.label, css:ci.css, desc:k.desc};
}
function ovrInfo(o){
  var oi = OVR_INFO[o] || OVR_INFO['no'];
  if (LANG !== 'ko') return oi;
  return {label:oi.label, css:oi.css, desc:OVR_KO[o] || OVR_KO['no']};
}
function countLabel(n){ return LANG==='ko' ? n+t('alarms') : n+' '+(n!==1?'alarms':'alarm'); }
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
  document.getElementById('sInp').placeholder = t('ph');
  document.querySelectorAll('.lang-btn').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lang')===LANG); });
  document.getElementById('totalBadge').textContent = countLabel(ALARMS.length);
}
function setLang(l){
  if (l === LANG) return;
  LANG = l;
  try { localStorage.setItem('phxAlarmLang', l); } catch(e) {}
  applyLang();
  var keep = OS;
  var cur = document.querySelector('.bnav-item.on');
  var tab = document.getElementById('alarmPanel').classList.contains('on') ? 'alarm'
          : document.getElementById('guidePanel').classList.contains('on') ? 'guide' : 'search';
  if (tab === 'search') { go(); OS = keep; Object.keys(keep).forEach(function(k){ if(keep[k]){ var d=document.getElementById('det_'+k), c=document.getElementById('chev_'+k); if(d)d.classList.add('open'); if(c)c.classList.add('open'); } }); }
  else switchBnav(tab, cur);
}

/* ════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════ */
var SQ='', CF='all', OF='all', OS={};
applyLang();

/* ════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════ */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hi(s,ws){
  if(!ws||!ws.length) return esc(s);
  var r=esc(s);
  ws.forEach(function(w){
    if(!w) return;
    r=r.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  });
  return r;
}

/* ════════════════════════════════════════════
   RENDER CARDS
   ════════════════════════════════════════════ */
function render(list){
  var ws = SQ ? SQ.trim().toLowerCase().split(/\s+/) : [];
  var cards = document.getElementById('cardsEl');
  var empty = document.getElementById('emptyEl');
  var sbar  = document.getElementById('sbarEl');

  if(!list.length){
    cards.innerHTML=''; cards.style.display='none'; empty.style.display='block';
    sbar.innerHTML=t('noRes');
    return;
  }
  cards.style.display=''; empty.style.display='none';

  if(SQ||CF!=='all'||OF!=='all'){
    sbar.innerHTML = LANG==='ko' ? '<b>'+list.length+'</b> / '+ALARMS.length+'개 알람 표시'
                                 : 'Showing <b>'+list.length+'</b> of '+ALARMS.length+' alarms';
  } else {
    sbar.innerHTML = LANG==='ko' ? '전체 <b>'+ALARMS.length+'</b>개 알람 표시'
                                 : 'Showing all <b>'+ALARMS.length+'</b> alarms';
  }
  if(LANG==='ko') sbar.innerHTML += '<div class="ko-note" style="margin:4px 0 0">'+esc(t('koNote'))+'</div>';

  cards.innerHTML = list.map(function(a){
    var key = 'a'+a.code;
    var isOpen = OS[key];
    var ci = clsInfo(a.cls);
    var oi = ovrInfo(a.ovr);
    var attrTxt = (LANG==='ko' && ATTR_KO[a.attr]) ? ATTR_KO[a.attr] : a.attr;
    var attrTags = attrTxt ? attrTxt.split('/').map(function(t){
      return '<span class="attr-tag">'+esc(t.trim())+'</span>';
    }).join('') : '';

    var ts = (LANG==='ko' && TS_KO[a.code]) || TS[a.code] || null;
    var tsHtml = '';
    if(ts){
      if(ts.r){
        tsHtml += '<div class="ts-sec">'+
          '<div class="ts-lbl lbl-reason">\u26a1 '+t('lReason')+'</div>'+
          '<div class="ts-reason">'+esc(ts.r)+'</div>'+
        '</div>';
      }
      if(ts.m){
        tsHtml += '<div class="ts-sec">'+
          '<div class="ts-lbl lbl-machine">\u2699 '+t('lMachine')+'</div>'+
          '<div class="ts-machine">'+esc(ts.m)+'</div>'+
        '</div>';
      }
      var maxP = Math.max(ts.oc.length, ts.oa.length, ts.sc.length, ts.sa.length);
      if(maxP > 0){
        var pairRows = '';
        for(var pi=0; pi<maxP; pi++){
          var ocTxt = pi<ts.oc.length ? '<span class="ts-num">'+(pi+1)+'.</span>'+esc(ts.oc[pi]) : '';
          var oaTxt = pi<ts.oa.length ? '\u2192 <span class="ts-num">'+(pi+1)+'.</span>'+esc(ts.oa[pi]) : '';
          var scTxt = pi<ts.sc.length ? '<span class="ts-num">'+(pi+1)+'.</span>'+esc(ts.sc[pi]) : '';
          var saTxt = pi<ts.sa.length ? '\u2192 <span class="ts-num">'+(pi+1)+'.</span>'+esc(ts.sa[pi]) : '';
          pairRows +=
            '<div class="ts-pair">'+
              '<div class="ts-cause">'+ocTxt+'</div>'+
              '<div class="ts-cause ts-cause-sv">'+scTxt+'</div>'+
            '</div>'+
            '<div class="ts-pair ts-pair-action">'+
              '<div class="ts-action ts-action-op">'+oaTxt+'</div>'+
              '<div class="ts-action ts-action-sv">'+saTxt+'</div>'+
            '</div>';
        }
        tsHtml += '<div class="ts-sec">'+
          '<div class="ts-pair-header">'+
            '<div class="ts-lbl lbl-op" style="margin-bottom:0">\ud83d\udc64 '+t('lOp')+'</div>'+
            '<div class="ts-lbl lbl-sv" style="margin-bottom:0">\ud83d\udd27 '+t('lSv')+'</div>'+
          '</div>'+
          '<div class="ts-table">'+
            '<div class="ts-thead">'+
              '<div class="ts-th-op">'+t('cause')+'</div>'+
              '<div class="ts-th-sv">'+t('cause')+'</div>'+
            '</div>'+
            '<div class="ts-pairs">'+pairRows+'</div>'+
          '</div>'+
        '</div>';
      }
    }
    return '<div class="card">'+
      '<div class="chead" onclick="toggle(\''+key+'\')">'+
        '<span class="abadge">'+esc(a.code)+'</span>'+
        '<div class="cbody">'+
          '<div class="ctitle">'+hi(a.msg,ws)+'</div>'+
          (LANG==='ko' && MSG_KO[a.code] ? '<div class="ctitle-ko">'+hi(MSG_KO[a.code],ws)+'</div>' : '')+
          '<div class="cmeta">'+
            '<span class="cbadge '+ci.css+'">'+esc(ci.label)+'</span>'+
            '<span class="obadge '+oi.css+'">'+esc(oi.label)+'</span>'+
          '</div>'+
          (attrTags ? '<div class="attr-tags">'+attrTags+'</div>' : '')+
        '</div>'+
        '<div class="chev'+(isOpen?' open':'')+'\" id="chev_'+key+'">&#9662;</div>'+
      '</div>'+
      '<div class="cdet'+(isOpen?' open':'')+'\" id="det_'+key+'">'+
        '<div class="cdet-in">'+
          '<div class="dsec">'+
            '<div class="dlbl">&#9658; '+t('dClass')+'</div>'+
            '<div class="dbox">'+
              '<strong>'+esc(ci.label)+'</strong><br>'+esc(ci.desc)+
            '</div>'+
          '</div>'+
          (attrTxt ? '<div class="dsec"><div class="dlbl">&#9658; '+t('dAttr')+'</div><div class="sbox">'+hi(attrTxt,ws)+'</div></div>' : '')+
          '<div class="dsec">'+
            '<div class="dlbl">&#9658; '+t('dOvr')+'</div>'+
            '<div class="abox"><strong>'+esc(oi.label)+'</strong> &mdash; '+esc(oi.desc)+'</div>'+
          '</div>'+
          tsHtml+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');

}

function toggle(key){
  var det  = document.getElementById('det_'+key);
  var chev = document.getElementById('chev_'+key);
  if(!det) return;
  if(OS[key]){OS[key]=0;det.classList.remove('open');if(chev)chev.classList.remove('open');}
  else{OS[key]=1;det.classList.add('open');if(chev)chev.classList.add('open');}
}

/* ════════════════════════════════════════════
   SEARCH + FILTER
   ════════════════════════════════════════════ */
function go(){
  var ws = SQ ? SQ.trim().toLowerCase().split(/\s+/) : [];
  var list = ALARMS.slice();
  if(CF !== 'all') list = list.filter(function(a){ return a.cls === CF; });
  if(OF !== 'all'){
    if(OF==='yes')   list = list.filter(function(a){ return a.ovr==='yes'||a.ovr==='cond'; });
    else if(OF==='yes-r') list = list.filter(function(a){ return a.ovr==='yes-r'; });
    else if(OF==='no')    list = list.filter(function(a){ return a.ovr==='no'||a.ovr==='sp'; });
  }
  if(ws.length) list = list.filter(function(a){
    var h = [String(a.code), a.msg, a.attr, a.cls, MSG_KO[a.code]||''].join(' ').toLowerCase();
    return ws.every(function(w){ return h.indexOf(w)>=0; });
  });
  list.sort(function(a,b){ return a.code - b.code; });
  OS={};
  render(list);
}

var sInp=document.getElementById('sInp');
var sClr=document.getElementById('sClr');
sInp.addEventListener('input',function(){SQ=sInp.value;sClr.className=SQ.length?'s-clr show':'s-clr';go();});
sClr.addEventListener('click',function(){sInp.value='';SQ='';sClr.className='s-clr';go();});

document.getElementById('clsRow').addEventListener('click',function(e){
  var b=e.target;while(b&&!b.classList.contains('seg'))b=b.parentElement;
  if(!b)return;
  document.querySelectorAll('#clsRow .seg').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on');CF=b.getAttribute('data-v');go();
});
document.getElementById('ovrRow').addEventListener('click',function(e){
  var b=e.target;while(b&&!b.classList.contains('seg'))b=b.parentElement;
  if(!b)return;
  document.querySelectorAll('#ovrRow .seg').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on');OF=b.getAttribute('data-v');go();
});

/* ════════════════════════════════════════════
   BY CLASS TAB
   ════════════════════════════════════════════ */
function renderAlarmPanel(){
  var order = ['p','pd','a','b','c','d','e','w','sp'];
  var html = '';
  order.forEach(function(cls){
    var rows = ALARMS.filter(function(a){ return a.cls===cls; });
    if(!rows.length) return;
    var ci = clsInfo(cls);
    html += '<div class="ag">'+
      '<div class="ag-header">'+
        '<span class="cbadge '+ci.css+'">'+esc(ci.label)+'</span>'+
        '<span class="ag-cnt">'+countLabel(rows.length)+'</span>'+
      '</div>'+
      '<div class="ag-list">';
    rows.forEach(function(a){
      html += '<div class="ag-row" onclick="jumpTo(\'a'+a.code+'\')">'+
        '<span class="ag-code">'+esc(a.code)+'</span>'+
        '<span class="ag-name">'+esc(a.msg)+(LANG==='ko' && MSG_KO[a.code] ? '<span class="ag-name-ko">'+esc(MSG_KO[a.code])+'</span>' : '')+'</span>'+
        '<span class="ag-arr">›</span>'+
      '</div>';
    });
    html += '</div></div>';
  });
  document.getElementById('alarmPanelInner').innerHTML = html;
}

function jumpTo(key){
  switchBnav('search', document.querySelector('.bnav-item'));
  setTimeout(function(){
    OS[key]=1; go();
    setTimeout(function(){
      var el=document.getElementById('det_'+key);
      if(el) el.closest('.card').scrollIntoView({behavior:'smooth',block:'center'});
    },350);
  },80);
}

/* ════════════════════════════════════════════
   CLASS GUIDE TAB
   ════════════════════════════════════════════ */
function renderGuidePanel(){
  var order = ['p','pd','a','b','c','d','e','w','sp'];
  var colors = {p:'var(--danger)',pd:'#A93226',a:'var(--amber)',b:'var(--plum)',
    c:'#874D00',d:'var(--blue)',e:'var(--slate)',w:'var(--pine)',sp:'var(--text3)'};
  var count = {};
  ALARMS.forEach(function(a){ count[a.cls]=(count[a.cls]||0)+1; });
  var html = '';
  order.forEach(function(cls){
    var ci = clsInfo(cls);
    var n = count[cls]||0;
    html += '<div class="guide-card">'+
      '<div class="guide-head">'+
        '<div class="guide-cls-badge" style="background:rgba(0,0,0,0.05);color:'+colors[cls]+';border:2px solid '+colors[cls]+';">'+
          cls.toUpperCase()+
        '</div>'+
        '<div>'+
          '<div class="guide-title">'+esc(ci.label)+'</div>'+
          '<div class="guide-sub">'+countLabel(n)+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="guide-body">'+esc(ci.desc)+'</div>'+
    '</div>';
  });

  /* Notes */
  html += '<div style="background:var(--white);border-radius:var(--r);padding:16px;border:1px solid var(--border);margin-top:4px;">'+
    '<div style="font-size:11px;font-weight:800;color:var(--pine);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">📋 '+t('notes')+'</div>'+
    '<div style="font-size:13px;color:var(--text2);line-height:1.7;">'+
    (LANG==='ko' ?
      '<b>Note 1</b> — MINIMUM TRANSMEMBRANE PRESSURE (코드 142): CONFIG 메뉴에서 TMP 파라미터가 NO이면 OVERRIDE 불가, YES이면 리셋 가능.<br><br>'+
      '<b>Note 2</b> — VENOUS PRESSURE HIGH LIMIT (코드 154): OVERRIDE는 측정 정맥압이 +450 mmHg 미만일 때만 효과가 있으며, 그 이상이면 안전 시스템 작동이 해제되지 않음.<br><br>'+
      '<b>Note 3</b> — W! CONTINUE DESPITE T1 FAILURE (코드 188): 알람 상태를 RESET 하려면 <strong>OVERRIDE</strong> 버튼을 누른 뒤 <strong>CONFIRM</strong> 버튼을 누름.'+
      '<div class="ko-note" style="margin:12px 0 0">'+esc(t('koNote'))+'</div>'
    :
      '<b>Note 1</b> — MINIMUM TRANSMEMBRANE PRESSURE (Code 142): If TMP parameter is set to NO in CONFIG menu, alarm cannot be overridden; if set to YES, alarm can be reset.<br><br>'+
      '<b>Note 2</b> — VENOUS PRESSURE HIGH LIMIT (Code 154): OVERRIDE only has effect if measured venous pressure is less than +450 mmHg, otherwise safety activation is not removed.<br><br>'+
      '<b>Note 3</b> — W! CONTINUE DESPITE T1 FAILURE (Code 188): To RESET the alarm condition, press the <strong>OVERRIDE</strong> button then press the <strong>CONFIRM</strong> button.')+
    '</div>'+
  '</div>';
  document.getElementById('guidePanelInner').innerHTML = html;
}

/* ════════════════════════════════════════════
   TAB SWITCH
   ════════════════════════════════════════════ */
function switchBnav(tab, el){
  document.querySelectorAll('.bnav-item').forEach(function(b){b.classList.remove('on');});
  if(el) el.classList.add('on');

  var isSearch = (tab==='search');
  var filtEl   = document.getElementById('filtEl');
  var sbarEl   = document.getElementById('sbarEl');
  var cardsEl  = document.getElementById('cardsEl');
  var emptyEl  = document.getElementById('emptyEl');

  filtEl.style.display  = isSearch ? '' : 'none';
  sbarEl.style.display  = isSearch ? '' : 'none';
  cardsEl.style.display = isSearch ? '' : 'none';
  emptyEl.style.display = 'none';

  document.getElementById('alarmPanel').classList.toggle('on', tab==='alarm');
  document.getElementById('guidePanel').classList.toggle('on', tab==='guide');

  if(tab==='alarm')  renderAlarmPanel();
  if(tab==='guide')  renderGuidePanel();
  if(tab==='search'){ cardsEl.style.display=''; go(); }
}

/* ════ INIT ════ */
go();
</script>
