<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prismaflex Alarm Search · Vantive</title>
<style>
:root{--plum:#72256B;--plum-d:#58184F;--sage:#CDDFD7;--bg:#F6F0EA;--plum-light:rgba(114,37,107,0.09);
--cream:#FFFAEB;--pine:#105742;--pine-light:rgba(16,87,66,0.10);
--euca:#6CA07A;--euca-light:rgba(108,160,122,0.12);
--amber:#986A24;--amber-light:rgba(176,125,46,0.12);
--danger:#AE4048;--danger-light:rgba(174,64,72,0.10);
--caution:#986A24;--caution-light:rgba(176,125,46,0.12);
--white:#FFFFFF;--text:#1B1219;--text2:#6B5468;--text3:#9B879A;
--border:rgba(114,37,107,0.12);--border-p:rgba(114,37,107,0.14);
--shadow:0 2px 14px rgba(0,0,0,0.06);--r:14px;--r-xs:5px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}
.hdr{background:linear-gradient(90deg,#58184F 0%,#72256B 26%,#105742 62%,#6CA07A 100%);
border-bottom:1px solid rgba(255,255,255,0.15);box-shadow:0 2px 16px rgba(88,24,79,0.25);
padding:16px 18px 0;position:sticky;top:0;z-index:200;overflow:hidden;}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;position:relative;z-index:2;}
.wmark-wrap{display:flex;flex-direction:column;gap:4px;}
.wmark-img{height:26px;width:auto;max-width:100px;display:block;}
.tagline{font-size:13.5px;font-weight:700;color:rgba(255,250,235,0.55);letter-spacing:1.8px;text-transform:uppercase;}
.total-badge{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.32);
color:#fff;font-size:11px;font-weight:700;padding:5px 13px;border-radius:20px;flex-shrink:0;margin-top:2px;}
.s-wrap{position:relative;margin-bottom:10px;z-index:2;}
.s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;}
.s-inp{width:100%;padding:12px 42px 12px 44px;background:rgba(255,250,235,0.13);
border:1.5px solid rgba(255,250,235,0.22);border-radius:12px;font-size:14px;color:var(--cream);
outline:none;font-family:inherit;transition:background .18s,border-color .18s;}
.s-inp:focus{background:rgba(255,250,235,0.22);border-color:rgba(255,250,235,0.45);}
.s-inp::placeholder{color:rgba(255,250,235,0.62);}
.s-clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);
background:rgba(255,250,235,0.22);border:none;border-radius:50%;
width:22px;height:22px;font-size:12px;cursor:pointer;color:var(--cream);
font-weight:700;display:none;line-height:22px;text-align:center;}
.s-clr.show{display:block;}
.s-hint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:12px;
font-size:11px;color:rgba(255,250,235,0.58);position:relative;z-index:2;}
.h-arr{color:rgba(255,250,235,0.75);font-weight:800;letter-spacing:-1px;}
.h-ex{background:rgba(255,250,235,0.14);border:1px solid rgba(255,250,235,0.18);
color:rgba(255,250,235,0.9);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;}
.filt{background:var(--bg);padding:12px 18px;border-bottom:1px solid var(--border);}
.flbl{font-size:9.5px;font-weight:800;color:var(--pine);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:7px;}
.seg-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.seg-row::-webkit-scrollbar{display:none;}
.seg{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;
cursor:pointer;user-select:none;white-space:nowrap;background:rgba(114,37,107,0.06);color:var(--text2);
border:1.5px solid transparent;transition:all .15s ease;font-family:inherit;display:inline-flex;align-items:center;}
.seg.on{background:var(--plum);color:#fff;border-color:var(--plum);}
.seg:active{transform:scale(0.95);}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;flex-shrink:0;}
.frow{margin-bottom:10px;}.frow:last-child{margin-bottom:0;}
.sbar{padding:8px 18px 6px;font-size:12px;color:var(--text2);background:var(--bg);}
.sbar b{color:var(--plum);font-weight:700;}
.cards{padding:8px 14px 32px;display:flex;flex-direction:column;gap:9px;}
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);
border:1px solid var(--border);overflow:hidden;}
.chead{display:flex;align-items:flex-start;gap:10px;padding:13px 13px 11px;cursor:pointer;}
.catbadge{display:inline-flex;align-items:center;justify-content:center;min-width:80px;padding:3px 8px;
border-radius:var(--r-xs);font-size:10px;font-weight:800;white-space:nowrap;flex-shrink:0;margin-top:2px;text-transform:uppercase;}
.cat-Warning{background:var(--danger-light);color:var(--danger);border:1px solid rgba(174,64,72,0.22);}
.cat-Caution{background:var(--caution-light);color:var(--caution);border:1px solid rgba(176,125,46,0.22);}
.cat-Advisory{background:var(--pine-light);color:var(--pine);border:1px solid rgba(16,87,66,0.2);}
.cat-Malfunction{background:var(--plum-light);color:var(--plum);border:1px solid var(--border-p);}
.cbody{flex:1;min-width:0;}
.ctitle{font-size:13.5px;font-weight:700;line-height:1.45;margin-bottom:4px;color:var(--text);}
.cmeta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.chev{color:var(--text3);flex-shrink:0;margin-top:2px;width:22px;height:22px;
display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,0.04);border-radius:50%;transition:transform .25s ease,background .15s,color .15s;}
.chev.open{transform:rotate(180deg);background:var(--plum-light);color:var(--plum);}
.cdet{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1);}
.cdet.open{max-height:4000px;border-top:1px solid var(--border);}
.cdet-in{padding:15px 13px 18px;background:rgba(255,250,235,0.5);}
.dsec{margin-bottom:13px;}.dsec:last-child{margin-bottom:0;}
.dlbl{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;color:var(--pine);
text-transform:uppercase;letter-spacing:1.2px;margin-bottom:7px;}
.darr{color:var(--plum);font-weight:900;font-size:10px;letter-spacing:-1px;}
.dbox,.abox,.sbox{font-size:13.5px;line-height:1.75;border-radius:10px;padding:11px 13px;}
.dbox{color:var(--text);background:var(--white);border:1px solid var(--border);}
.abox{color:#6E4A12;background:var(--amber-light);border:1px solid rgba(176,125,46,0.22);}
.sbox{color:var(--pine);font-weight:500;background:var(--euca-light);border:1px solid rgba(108,160,122,0.25);}
.cause-table{display:flex;flex-direction:column;gap:10px;}
.cause-row{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.cause-hdr{font-size:12px;font-weight:700;color:var(--text);padding:9px 12px 7px;border-bottom:1px solid var(--border);
background:rgba(0,0,0,0.02);line-height:1.5;}
.cause-actions{display:flex;flex-direction:column;gap:0;}
.action-row{padding:8px 12px;font-size:13px;line-height:1.7;}
.action-row+.action-row{border-top:1px solid var(--border);}
.action-lbl{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:3px;}
.action-lbl.op{color:var(--amber);}
.action-lbl.svc{color:var(--pine);}
.action-txt{color:var(--text);}
mark{background:rgba(114,37,107,0.13);color:var(--plum);border-radius:2px;padding:0 1px;}
.empty{text-align:center;padding:60px 24px;color:var(--text2);display:none;}
.empty-ico{font-size:46px;margin-bottom:12px;opacity:.4;}
.empty h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.empty p{font-size:13px;}
/* -- Language toggle (EN / 한글) -- */
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.lang-sw{display:inline-flex;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.32);border-radius:20px;padding:2px;}
.lang-btn{border:none;background:none;color:rgba(255,255,255,0.95);font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:16px;cursor:pointer;line-height:1;}
.lang-btn.on{background:var(--cream);color:var(--plum);}
.ctitle-ko{font-size:12.5px;font-weight:600;color:var(--text2);margin:-1px 0 5px;line-height:1.4;}
.ko-note{font-size:11px;color:var(--text3);margin:4px 0 0;line-height:1.5;}
</style>
</head>

var ALARMS_KO=[{"n":"액세스 압력 극음압","d":"액세스 압력이 \"Access Extremely Negative\" 경고 한계보다 더 음압일 때 알람 발생. 참고: 작동점(operating point)은 알람, 혈류 변경 등 이벤트 이후 설정되는 압력값임. 압력이 (작동 범위로) 돌아오면 이 알람은 자동 해제되며, 자동 해제 시간 동안 모니터는 경보음을 내지 않음.","c":[{"c":"환자가 움직이거나, 기침하거나, 흡인 중임.","o":"자동 해제 시도를 위해 15초 대기. 참고: 자동 해제에 실패하면 비자동해제 화면에서 압력이 정상으로 돌아올 때까지 기다린 뒤 CONTINUE를 누름.","s":""},{"c":"액세스 라인이 클램프로 막히거나, 꺾이거나, 부분적으로 막힘.","o":"참고: 자동 해제에 실패하면 비자동해제 화면에서 압력이 정상으로 돌아올 때까지 기다린 뒤 CONTINUE를 누름.","s":""},{"c":"액세스 카테터가 응고되었거나 정맥 내 위치가 벗어남,","o":"병원 (프로토콜)에 따라 액세스 카테터를 세척/재배치","s":""},{"c":"또는 액세스 기구 대비 혈류 속도가 너무 높음.","o":"(병원) 프로토콜. 액세스 샘플 포트로 생리식염수를 주입해 음압을 해소하거나 혈류 속도를 낮춤. CONTINUE를 누름.","s":""},{"c":"액세스 압력 센서 고장.","o":"치료를 종료하고 서비스 요청. 참고: 위 조치로 알람이 해제되지 않으면 STOP/DISCONNECT로 세트를 교체해 알람을 해제할 수 있음. 새 세트에서도 알람이 재발하면 STOP/DISCONNECT로 치료를 종료하고 서비스 요청.","s":""},{"c":"액세스 기구 대비 혈류 속도가 너무 높음.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 액세스 압력 확인. 진단에서 압력 편차가 있으면 다음 서비스 조치 참조. 압력이 정상이면 서비스 진단 6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 혈액펌프 유량 확인. 값이 잘못되면 혈액펌프 교체."},{"c":"액세스 압력 측정 실패. 참고:","o":"","s":"압력 센서 기능 확인 —"},{"c":"흔한 근본 원인은 자가 테스트(self-test) 중단임.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽). 압력 센서와 ARPS 압력 회로의 누설 확인. 누설이 있으면 압력 포드 실링 콘, 압력 센서, 압력 밸브, ARPS 펌프 또는 ARPS 회로를 조치. 진단에서 압력 편차가 있으면 다음 서비스 조치 참조."},{"c":"액세스 압력 센서 고장.","o":"","s":"교정 수행 (6.6.5 \"Calibration Screen – Pressure Sensors Calibration\", 250쪽). 6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 확인. 압력 편차가 있으면 압력 센서 교체."}]},{"n":"액세스 압력 극양압","d":"액세스 압력이 \"Access Extremely Positive\" 경고 한계보다 더 양압일 때 알람 발생.","c":[{"c":"외부 장치(사용 중인 경우)가 혈액을","o":"외부 장치의 공급 압력을 낮춤.","s":""},{"c":"너무 높은 압력으로 공급함.","o":"(외부 장치의 공급 압력을 낮춤.)","s":""},{"c":"외부 장치가 공급하는 혈압에 비해","o":"혈류 속도를 높임. 알람 화면으로 돌아가","s":""},{"c":"혈류 속도가 너무 낮게 설정됨.","o":"CONTINUE를 누름.","s":""},{"c":"(외부 장치의 공급 압력을 낮춤.)","o":"","s":""},{"c":"액세스 압력 센서 고장.","o":"치료를 종료하고 서비스 요청. 참고: 위 조치로 알람이 해제되지 않으면 STOP/DISCONNECT로 세트를 교체해 알람을 해제할 수 있음. 새 세트에서도 알람이 재발하면 STOP/DISCONNECT로 치료를 종료하고 서비스 요청.","s":""},{"c":"액세스 압력 측정 실패.","o":"자가 테스트를 수행해 압력 포드 멤브레인을 재배치. 알람을 해제해 Status 화면으로 이동. SYSTEM TOOLS를 누르고 SELF-TEST 수행. 문제가 지속되면 STOP/DISCONNECT로 세트 교체. 새 세트에서도 알람이 재발하면 STOP/DISCONNECT로 치료를 종료하고 서비스 요청.","s":""},{"c":"외부 장치 대비 혈류 속도가 너무 낮음.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 액세스 압력 확인. 압력이 정상이면 서비스 진단 6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 혈액펌프 유량 확인. 값이 잘못되면 혈액펌프 교체. 값이 정상이면 압력 센서 점검으로 진행."},{"c":"액세스 압력 측정 실패. 참고:","o":"","s":"압력 센서 기능 확인 —"},{"c":"흔한 근본 원인은 자가 테스트(self-test) 중단임.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽). 값이 잘못되면 교정 수행 (6.6.5 \"Calibration Screen – Pressure Sensors Calibration\", 250쪽). 6.5.4에서 압력 확인. 값이 여전히 잘못되면 압력 센서 교체."},{"c":"액세스 압력 센서 고장.","o":"","s":"교정 수행 (6.6.5 \"Calibration Screen – Pressure Sensors Calibration\", 250쪽). 6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 확인. 압력 편차가 있으면 압력 센서 교체."}]},{"n":"혈액 내 공기","d":"","c":[{"c":"라인 분리, 연결부 누설, 세트가","o":"혈액 액세스와 세트의 누설 또는","s":""},{"c":"완전히 프라이밍되지 않음, 리턴 라인이 공기","o":"분리 가능성 확인. 참고: 세트 전체에 공기가","s":""},{"c":"감지기에 장착되지 않음.","o":"있으면 DISCONNECT를 눌러 새 세트를 장착·프라이밍. 가능한 원인을 조치. 리턴 압력이 음압(NEGATIVE)이 될 때까지 위쪽 화살표를 누름. 실패하면 수동 절차로 진행 — PRISMAFLEX 사용자 매뉴얼 8.XX 11장 \"Air in blood - manual air removal\" 참조. RELEASE CLAMP를 눌러 공기를 제거하고 환자 혈액을 리턴 라인/탈기 챔버로 끌어옴. 필요 시 화살표로 챔버 수위를 조정. 준비되면 CONTINUE를 누름.","s":""},{"c":"튜브 내 공기/거품.","o":"알람이 반복되면 기포감지기 도어를 열고 튜브 내 공기/거품을 확인하고, 탈기 챔버 수위를 점검. 기포감지기 도어를 닫음. CONTINUE를 누름.","s":""}]},{"n":"백 용량 오류","d":"Variable Empty Bag 방식을 선택한 경우에만 해당. 이 알람은 프라이밍 중에만 나타남.","c":[{"c":"식별된 용액 백의 액량이","o":"알람 화면의 세 가지 옵션 중 하나를 선택.","s":""},{"c":"현재 허용 용량(Allowed Volume)과 맞지 않음.","o":"(알람) 화면. 주의! KEEP BAG은 현재 허용 용량과 총 용량이 같은, 일부만 찬 백을 사용할 때만 선택할 것.","s":""},{"c":"저울에 백이 없음.","o":"저울에 적절한 백을 검. CONTINUE를 누름. 참고: 저울에 여러 백을 걸 경우 모든 백의 총 용량이 해당 저울의 허용 용량을 초과하면 안 됨.","s":""},{"c":"저울에 이물체가 있음.","o":"이물체를 제거. CONTINUE를 누름.","s":""},{"c":"식별된 용액 백이 부분적으로 지지되고 있음","o":"부분 지지를 제거. CONTINUE를 누름.","s":""},{"c":"(자유롭게 매달려 있지 않음).","o":"","s":""}]},{"n":"백/용기 비어 있음","d":"이 알람은 프라이밍 중에만 나타남.","c":[{"c":"식별된 용액 백이 비어 있음.","o":"새 백을 연결. CONTINUE를 누름.","s":""},{"c":"식별된 용액 백이 부분적으로 지지되고 있음","o":"부분 지지를 제거. CONTINUE를 누름.","s":""},{"c":"(자유롭게 매달려 있지 않음).","o":"","s":""}]},{"n":"배터리 부족","d":"주전원이 계속 끊겨 있고 배터리(백업 배터리 포함)가 방전됨 (현지 확인 필요).","c":[{"c":"주전원이 끊겼고 배터리가","o":"환자가 치료 중이면 STOP 소프트키를 눌러","s":""},{"c":"방전됨.","o":"치료 종료. SETUP 모드에서 환자가 연결된 경우 DISCONNECT 소프트키로 환자 분리 후 장비를 끔. END 모드에서 환자가 연결된 경우 OVERRIDE 소프트키로 치료를 종료하고 장비를 끔.","s":""},{"c":"장비 전원 플러그가 빠져 있고 배터리가","o":"전원 코드를 연결. STOP을 누르고","s":""},{"c":"방전됨.","o":"RESUME을 선택해 치료 재시작.","s":""}]},{"n":"혈액누출 감지","d":"알람 조건 지연 시간이 있음 (최대 …). 알람 OVERRIDE 시간은 2분. 모니터 (계속 감시).","c":[{"c":"혈액누출 감지기 위치의 배출(effluent) 라인에 기포가 있음.","o":"OVERRIDE를 눌러 기포를 밀어냄. 기포가","s":""},{"c":"감지기에 장착되지 않음.","o":"반복되면(배출액 탈기) 배출 라인 꺾임을 확인하거나 한외여과 속도를 낮춤.","s":""},{"c":"배출 라인이 혈액누출 감지기에 올바르게 장착되지 않음.","o":"라인을 감지기 아래에서 위로 밀어 넣고","s":""},{"c":"감지기에 장착되지 않음.","o":"튜브 가이드를 따라 확실히 배치. OVERRIDE를 누름. 알람 해제 후 System Tools 화면에서 Normalize BLD를 누르고 안내를 따름. 경고! 치료 진행 중(Run Mode)에 배출 라인을 혈액누출 감지기에서 뺐다가 다시 넣은 경우 반드시 혈액누출 감지기를 재정규화해야 함.","s":""},{"c":"감지기를 통과하는 튜브 경로에 액체 또는 이물질이 있음.","o":"감지기에서 라인을 제거. \"치실질\"하듯","s":""},{"c":"감지기에 장착되지 않음.","o":"보풀 없는 천과 이소프로필알코올로 감지기 내부를 청소. 완전히 건조. 배출 라인을 물로 닦고 완전히 건조. 라인을 감지기와 튜브 가이드에 다시 장착. OVERRIDE를 누름. 알람 해제 후 System Tools 화면에서 Normalize BLD를 누르고 안내를 따름. 경고! 치료 진행 중(Run Mode)에 배출 라인을 혈액누출 감지기에서 뺐다가 다시 넣은 경우 반드시 혈액누출 감지기를 재정규화해야 함.","s":""},{"c":"필터 멤브레인 누설.","o":"STOP으로 세트 교체. 배출액 샘플을 혈액 검사실에 보내 세포 수 검사.","s":""},{"c":"TPE: 혈장 내 유형 성분 또는 지질,","o":"OVERRIDE를 누름. 치환 속도 및/또는","s":""},{"c":"변색된 혈장.","o":"환자 혈장 손실 속도를 낮춤. 참고: 알람이 해제되지 않으면 STOP으로 세트를 교체할 수 있음. 새 세트와 낮춘 유량에서도 알람이 재발하면 치료 중단.","s":""}]},{"n":"칼슘 라인 미연결","d":"","c":[{"c":"칼슘 주입 라인이 시린지에","o":"전용 칼슘 주입 라인을 시린지에 연결.","s":""},{"c":"연결되지 않음.","o":"(시린지에 연결.) CONTINUE를 누름.","s":""},{"c":"잘못된 라인이 연결됨.","o":"\"Citrate – Calcium, PRISMAFLEX Syringe Pump\" 방식 선택 시 칼슘 주입에는 전용 주입 라인만 사용.","s":""},{"c":"일회용 세트의 사용하지 않는(보관된) 시린지 라인이","o":"일회용 세트의 사용하지 않는 라인을 클램프로 막고","s":""},{"c":"칼슘 (시린지)에 연결됨.","o":"치료 내내 사용하지 않고 둠.","s":""},{"c":"연결되지 않음.","o":"\"Citrate – Calcium, PRISMAFLEX Syringe Pump\" 방식 선택 시. CHANGE SYR/LINE 소프트키를 누르고 화면 안내에 따라 전용 칼슘 주입 라인을 시린지에 연결.","s":""},{"c":"잘못된 크기의 시린지가 장착됨.","o":"\"Citrate – Calcium, PRISMAFLEX Syringe Pump\" 방식 선택 시 허용된 브랜드의 50 mL 시린지만 사용.","s":""},{"c":"시린지 내 공기.","o":"CHANGE SYR/LINE을 누름. 안내에 따라 가득 찬 시린지를 장착하고 알람 화면으로 돌아감. CONTINUE를 누름.","s":""}]},{"n":"칼슘 라인 막힘","d":"","c":[{"c":"칼슘 주입 라인이 클램프로 막힘.","o":"칼슘 주입 라인 클램프를 풂. CONTINUE를 누름.","s":""},{"c":"칼슘 주입 라인 장착 오류.","o":"칼슘 주입 라인을 점검해 클램프, 꺾임, 기타 막힘을 제거. 꺾임을 막기 위해 시린지 펌프 위의 클립을 칼슘 주입 라인에 사용. CONTINUE를 누름. 참고: 알람이 반복되면 CHANGE SYR/LINE 소프트키로 시린지와 칼슘 주입 라인을 모두 교체.","s":""}]},{"n":"칼슘 시린지 비어 있음","d":"이 알람은 프라이밍 중에만 나타남.","c":[{"c":"칼슘 시린지가 비어 있음.","o":"CHANGE SYR/LINE 소프트키를 누르고 화면 안내에 따라 가득 찬 시린지를 장착한 뒤 알람 화면으로 돌아감. CONTINUE를 누름.","s":""}]},{"n":"라인 막힘","d":"참고! PRISMALUNG 치료에서는 압력이 200 mmHg 미만으로 떨어지면 알람 (발생).","c":[{"c":"라인 중 하나가 클램프로 막힘.","o":"라인 클램프를 풂. REPRIME을 누름.","s":""},{"c":"일회용 세트 폐색.","o":"DISCONNECT를 누름. 세트 교체.","s":""},{"c":"하나 이상의 압력 센서 고장.","o":"DISCONNECT를 누름. 서비스 요청.","s":""},{"c":"하나 이상의 압력 센서 고장.","o":"","s":"알람이 액세스 또는 리턴 라인에 해당하면 6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 센서 확인. 압력 편차가 있으면 교정 수행 (6.6.5, 250쪽) 후 6.5.4에서 압력 재확인. 값이 여전히 잘못되면 압력 센서 교체. 알람이 백 라인 중 하나에 해당하면 해당 저울 점검 — 저울 \"Weight\" 알람(Caution)의 서비스 조치, 관찰 항목 Incorrect Weight Change 참조."}]},{"n":"라인 교차","d":"","c":[{"c":"라인이 교차되거나 엉킴.","o":"라인과 백 설치를 확인·수정. REPRIME을 누름.","s":""},{"c":"저울에 이물체가 있음.","o":"물체를 제거. REPRIME을 누름.","s":""},{"c":"하나 이상의 저울 고장.","o":"DISCONNECT를 누르고 장비를 끔. 서비스 요청.","s":""},{"c":"하나 이상의 저울 고장.","o":"","s":"6.5.3 \"Diagnose Screen – Scale Diagnose\"(224쪽)에서 저울 기능 확인. 필요 시 저울 교정 (6.6.3 \"Calibration Screen – Scales Calibration\", 247쪽). PRISMAFLEX 컨트롤 유닛을 다시 구동해 새 Prime 수행. 알람이 재발하면 저울 교체."}]},{"n":"배출액 백 가득 참","d":"이 알람은 프라이밍 중에만 나타남.","c":[{"c":"배출액 백이 가득 참.","o":"알람 화면 안내에 따라 새 배출액 백을 연결. CONTINUE를 누름.","s":""},{"c":"배출액 저울에 이물체가 있음.","o":"이물체를 제거. CONTINUE를 누름.","s":""}]},{"n":"배출액 백 오류","d":"배출액 백 용량이 허용 용량과 맞지 않음 (예: 배출액 허용 용량이 9000 mL인데 저울에 다른 백). 이 알람은 프라이밍 중에만 나타남.","c":[{"c":"배출액 허용 용량이 9000 mL인데","o":"저울에 건 5000 mL 백을","s":""},{"c":"빈 5000 mL 백이 저울에 걸려 있음.","o":"9000 mL 백으로 교체하거나 MODIFY BAG을 눌러 배출액 허용 용량을 변경. CONTINUE를 누름.","s":""},{"c":"저울에 백이 없음.","o":"저울에 적절한 백을 검. CONTINUE를 누름.","s":""},{"c":"배출액 백이 부분적으로 지지되고 있음","o":"부분 지지를 제거. CONTINUE를 누름.","s":""},{"c":"(자유롭게 매달려 있지 않음).","o":"","s":""}]},{"n":"배출 라인이 BLD에 없음","d":"","c":[{"c":"새 세트의 배출 라인이 혈액누출","o":"조치 후 RETEST를 누름. 알람이 재발하면,","s":""},{"c":"감지기에 장착되지 않음.","o":"DISCONNECT를 누르고 새 세트를 장착. 새 세트에서도 알람이 재발하면 서비스 요청.","s":""},{"c":"혈액누출 감지기 고장.","o":"DISCONNECT를 누르고 세트 제거. 서비스 요청.","s":""},{"c":"혈액누출 감지기 내 라인이 비어 있지 않음.","o":"","s":"조치 후 RETEST를 누름."},{"c":"혈액누출 감지기 고장.","o":"","s":"6.5.9 \"Diagnose Screen – BLD (Blood Leak Detector)\"(234쪽)에서 혈액누출 감지기 기능 확인. 오작동이면 혈액누출 감지기 교체."}]},{"n":"필터 응고","d":"필터 압력 강하가 사용 중인 필터 한계를 초과하거나 \"TMP Excessive\" 주의 한계에 도달함. 참고: MARS FLUX 필터의 TMP 값은 (해당) 치료에서 고려하지 않음 — PRISMAFLEX 매뉴얼 \"Pressure management\" 섹션 참조.","c":[{"c":"필터에 응고가 생김. 참고: 응고는","o":"STOP/DISCONNECT로 세트 교체. 환자","s":""},{"c":"보통 혈액 유로의 불충분한 항응고로 인함.","o":"응고 지표를 검사하고 필요 시","s":""},{"c":"(혈액 유로.)","o":"항응고제 주입을 조정.","s":""},{"c":"혈액 유로의 라인이 클램프로 막힘.","o":"라인 클램프를 풂. CONTINUE를 누름.","s":""},{"c":"사용 중인 필터 대비 한외여과 속도가 너무 높음.","o":"CONTINUE를 누른 뒤 치환액 유량 및/또는 PBP 용액 유량 및/또는 환자 제수 속도를 낮춤.","s":""},{"c":"압력 측정 실패.","o":"자가 테스트를 수행해 압력 포드 멤브레인을 재배치.","s":""},{"c":"\"Systemic, PRISMAFLEX syringe","o":"STOP/DISCONNECT를 누르고","s":""},{"c":"pump\" 항응고 중: 항응고제","o":"세트 교체. 시린지가 시린지 펌프에 올바르게 장착되고","s":""},{"c":"주입 실패.","o":"치료 중 플런저가 위로 움직이는지 확인. 플런저가 움직이지 않으면 시린지 펌프 고장. 원하면 시린지 라인을 의학적으로 허용되는 대체 항응고제 주입 장치에 연결. 펌프 수리를 위해 서비스 요청.","s":""},{"c":"\"Citrate - Calcium\" 항응고 중:","o":"STOP/DISCONNECT를 누르고","s":""},{"c":"구연산 주입 실패.","o":"(세트 교체.) PBP 펌프가 정상 동작하는지 확인. PBP 펌프 고장 시 서비스 요청.","s":""},{"c":"CRRT MARS 치료 중: MARS","o":"혈액누출이 확인되면","s":""},{"c":"모니터가 혈액누출을 감지함.","o":"STOP/DISCONNECT를 누르고 세트 교체. 확인되지 않으면 MARS 모니터를 트러블슈팅하고 CONTINUE를 누름.","s":""},{"c":"항응고제 주입 실패.","o":"","s":"시린지 펌프 진단 테스트 수행 (6.5.7 \"Diagnose Screen – Syringe Pump\", 230쪽). 진단 테스트 실패 시 시린지 펌프 교체."},{"c":"PBP 펌프 고장.","o":"","s":"PBP 펌프 진단 테스트 수행 (6.5.2 \"Diagnose Screen – Pumps Diagnose\", 222쪽). 진단 테스트 실패 시 PBP 펌프 교체."}]},{"n":"필터 압력 극양압","d":"필터 포드 압력이 ≥450 mmHg이면 알람 발생.","c":[{"c":"필터 압력 포드와 필터 사이 라인 또는","o":"라인 조치 후 CONTINUE를 누름.","s":""},{"c":"필터와 탈기 챔버 사이 라인이 클램프로 막히거나 꺾임.","o":"","s":""},{"c":"장비가 높은 리턴 압력으로 운전 중이며","o":"FLOW SETTINGS를 누르고 혈류 속도를","s":""},{"c":"필터에서 응고가 시작됨.","o":"낮춤. 카테터 확인.","s":""},{"c":"과도한 압력.","o":"RELEASE CLAMP를 눌러 리턴 라인의 과압을 해소. 원하면 혈류 속도를 낮추고 CONTINUE를 누름. 참고: RELEASE CLAMP 키는 클램프 닫힘이 필요한 다른 알람이 없을 때만 사용 가능. 운전이 시작되면 필터 압력이 떨어짐. (필터 응고가 문제가 되면 해당 Advisory 또는 Warning 알람이 발생.) 참고 2: 위 조치로 알람이 해제되지 않으면 STOP/DISCONNECT로 세트를 교체할 수 있음. 새 세트에서도 재발하면 STOP/DISCONNECT로 치료를 종료하고 서비스 요청.","s":""},{"c":"필터 압력 센서 고장.","o":"STOP/DISCONNECT로 치료 종료. 서비스 요청.","s":""},{"c":"CRRT MARS 치료 중: MARS","o":"혈액누출이 확인되면","s":""},{"c":"모니터가 혈액누출을 감지함.","o":"STOP/DISCONNECT를 누르고 세트 교체. 확인되지 않으면 MARS 모니터를 트러블슈팅하고 CONTINUE를 누름.","s":""},{"c":"필터 압력 측정 실패.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 센서 기능 확인. 진단에서 압력 편차가 있으면 다음 서비스 조치 참조."},{"c":"필터 압력 센서 고장.","o":"","s":"교정 수행 (6.6.5 \"Calibration Screen – Pressure Sensors Calibration\", 250쪽). 6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 확인. 압력 편차가 있으면 압력 센서 교체."}]},{"n":"누액 감지","d":"누액 감지기가 누설을 감지함.","c":[{"c":"드립 트레이에서 누설이 감지됨.","o":"다음을 확인:","s":""},{"c":"기타 가능한 원인:","o":"● 모든 연결부가 단단하고 누설이 없음.","s":""},{"c":"누액 감지기 부위가 젖어 있음.","o":"● 모든 백에 누설이 없음. ● 모든 라인이 연결되어 있고 누설이 없음. ● 드립 트레이에 액체가 없음. 드립 트레이를 말리고 센서를 닦음. REPRIME/CONTINUE를 눌러 치료 재개. 문제가 반복되면 센서가 건조 ""},{"c":"주입 실패.","o":"치료 중 플런저가 위로 움직이는지 확인. 플런저가 움직이지 않으면 시린지 펌프 고장. 원하면 시린지 라인을 의학적으로 허용되는 대체 항응고제 주입 장치에 연결. 펌프 수리를 위해 서비스 요청.","s":""},{"c":"\"Citrate - Calcium\" 항응고 중:","o":"STOP/DISCONNECT를 누르고","s":""},{"c":"구연산 주입 실패.","o":"(세트 교체.) PBP 펌프가 정상 동작하는지 확인. PBP 펌프 고장 시 서비스 요청.","s":""},{"c":"항응고제 주입 실패.","o":"","s":"시린지 펌프 진단 테스트 수행 (6.5.7 \"Diagnose Screen – Syringe Pump\", 230쪽). 알람이 재발하면 시린지 펌프 교체."},{"c":"PBP 펌프 고장.","o":"","s":"PBP 펌프 진단 테스트 수행 (6.5.2 \"Diagnose Screen – Pumps Diagnose\", 222쪽). 진단 테스트 실패 시 PBP 펌프 교체."}]},{"n":"정전","d":"장비 (전원이 빠진) 후 15초 넘게 전원이 끊김.","c":[{"c":"주전원 차단 — 장비 전원이 갑자기","o":"혈액 유로 점검. 응고되었으면 STOP으로","s":""},{"c":"빠짐.","o":"세트 교체. 유로가 응고되지 않았으면 CONTINUE를 누름 (알람이 해제되고 정전 시점부터 치료 재시작). 참고: 정전 중 세트를 수동으로 분리했다면 STOP → CHANGE SET으로 새 세트로 치료를 계속하거나, STOP → END TREATMENT로 치료를 종료.","s":""}]},{"n":"재순환 시간 초과","d":"","c":[{"c":"재순환 시간이 제조사 설정","o":"STOP RECIRC.를 누르고","s":""},{"c":"한계를 초과함.","o":"치료를 재개.","s":""}]},{"n":"리턴 분리","d":"리턴 압력이 +10 mmHg보다 낮으면 알람 발생 (+10 mmHg 초과로 돌아오면 해제). 작동점이 +10 mmHg보다 낮으면 알람이 재발함. 혈액펌프 (재)시작 시 작동점이 (낮으면) 알람이 한 번 발생하며, 이후 Advisory \"Cannot Detect Return\" 알람으로 이어질 수 있음. 참고: 작동점은 알람, 혈류 변경 등 이벤트 이후 설정되는 압력값임.","c":[{"c":"리턴 라인 또는 카테터가 분리됨.","o":"리턴 카테터가 리턴 라인과 환자 양쪽에 확실히 연결되었는지 확인. 치료를 재개하려면 CONTINUE를 누름.","s":""},{"c":"챔버 모니터 라인이 리턴 압력 포트에","o":"STOP을 누르고 CHANGE SET으로","s":""},{"c":"올바르게 연결되지 않았거나 유체 차단막(fluid barrier)이 젖음.","o":"새 세트를 장착/프라이밍. 유체 차단막 젖음이 반복되면 서비스 요청.","s":""},{"c":"탈기 챔버 이전 혈액 유로가","o":"가능하면 조치. CONTINUE를 누름. 불가능하면","s":""},{"c":"막힘.","o":"STOP을 누르고 CHANGE SET으로 새 세트를 장착/프라이밍.","s":""},{"c":"리턴 압력 센서 고장.","o":"STOP으로 치료 종료. 서비스 요청.","s":""},{"c":"새 세트에서 유체 차단막이 젖음.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 센서와 ARPS 압력 회로의 누설 확인. 누설이 있으면 압력 센서, 압력 밸브, ARPS 펌프 또는 ARPS 회로를 조치. 진단에서 압력 편차가 있으면 다음 서비스 조치 참조."},{"c":"리턴 압력 센서 고장.","o":"","s":"교정 수행 (6.6.5 \"Calibration Screen – Pressure Sensors Calibration\", 250쪽). 6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 확인. 압력 편차가 있으면 압력 센서 교체."}]},{"n":"리턴 압력 극양압","d":"리턴 압력이 \"Return Extremely Positive\" 경고 한계보다 더 양압일 때 알람 발생. 압력이 정상으로 돌아오면 자동 해제되며, (자동 해제 시간 동안) 모니터는 경보음을 내지 않음.","c":[{"c":"환자가 움직이거나, 기침하거나, 흡인 중임.","o":"자동 해제 시도를 위해 15초 대기. 참고: 자동 해제에 실패하면 비자동해제 화면에서 압력이 정상으로 돌아올 때까지 기다린 뒤 CONTINUE를 누름.","s":""},{"c":"리턴 라인이 클램프로 막히거나 꺾임.","o":"조치 후 자동 해제 시도를 기다림. 참고: 자동 해제에 실패하면 비자동해제 화면에서 압력이 정상으로 돌아올 때까지 기다린 뒤 RELEASE CLAMP, 이어 CONTINUE를 누름.","s":""},{"c":"리턴 카테터가 응고되었거나 정맥 내 위치가 벗어남,","o":"병원 프로토콜에 따라 리턴 카테터를 세척/재배치","s":""},{"c":"또는 혈류 속도가 너무 높음.","o":"하거나 혈류 속도를 낮춤. RELEASE CLAMP를 눌러 리턴 라인의 과압을 해소. CONTINUE를 누름. 참고: RELEASE CLAMP는 클램프 닫힘이 필요한 다른 알람이 없을 때만 사용 가능.","s":""},{"c":"리턴 압력 센서 고장.","o":"치료를 종료하고 서비스 요청. 위 조치로 알람이 해제되지 않으면 STOP/DISCONNECT로 세트를 교체해 알람을 해제할 수 있음. 새 세트에서도 재발하면 STOP/DISCONNECT로 치료를 종료하고 서비스 요청.","s":""}]},{"n":"리턴 압력 하강","d":"리턴 압력이 작동점보다 50 mmHg (낮아지면) 알람 발생.","c":[{"c":"리턴 라인 또는 카테터의","o":"리턴 카테터가 리턴 라인과 환자 양쪽에","s":""},{"c":"누설 또는 분리 가능성.","o":"확실히 연결되었는지 확인. 치료를 재개하려면 CONTINUE를 누름.","s":""},{"c":"환자가 움직이거나 이동 중임.","o":"CONTINUE를 누름.","s":""},{"c":"탈기 챔버 이전 혈액 유로가","o":"가능하면 조치. CONTINUE를 누름. 불가능하면","s":""},{"c":"막히거나 누설됨.","o":"STOP을 누르고 CHANGE SET으로 새 세트를 장착/프라이밍.","s":""},{"c":"소수성 멤브레인이 젖었거나","o":"STOP을 누르고 CHANGE SET으로","s":""},{"c":"서비스 라인이 분리됨.","o":"새 세트를 장착/프라이밍. 새 세트에서도 유체 차단막이 다시 젖으면 서비스 요청.","s":""},{"c":"리턴 압력 센서 고장.","o":"STOP으로 치료 종료. 서비스 요청.","s":""},{"c":"CRRT MARS 치료 중: MARS","o":"혈액누출이 확인되면 STOP을 누르고 세트","s":""},{"c":"모니터가 혈액누출을 감지함.","o":"교체. 확인되지 않으면 MARS 모니터를 트러블슈팅하고 CONTINUE를 누름.","s":""},{"c":"새 세트에서 유체 차단막이 젖음.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 센서와 ARPS 압력 회로의 누설 확인. 누설이 있으면 압력 센서, 압력 밸브, ARPS 펌프 또는 ARPS 회로를 조치. 진단에서 압력 편차가 있으면 다음 서비스 조치 참조."},{"c":"리턴 압력 센서 고장.","o":"","s":"교정 수행 (6.6.5 \"Calibration Screen – Pressure Sensors Calibration\", 250쪽). 6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 확인. 압력 편차가 있으면 압력 센서 교체."}]},{"n":"저울 열림","d":"이 알람은 프라이밍 중에만 나타남.","c":[{"c":"저울이 완전히 닫히지 못하게 하는 물체가 있음,","o":"가능한 원인을 점검·조치.","s":""},{"c":"백이 고리에 잘못 걸림, 운반","o":"저울 바를 장비 쪽으로 밀어 닫힘 위치에 잠기게 함. CONTINUE를 누름.","s":""},{"c":"바 트레이 중앙에 있지 않거나 손잡이가 아래(바닥 쪽)로 돌려지지 않음.","o":"","s":""},{"c":"저울 센서 고장.","o":"DISCONNECT를 누름. 서비스 요청.","s":""},{"c":"저울 센서 고장.","o":"","s":"6.5.3 \"Diagnose Screen – Scale Diagnose\"(224쪽)에서 저울 센서 기능 확인. 센서 테스트 실패 시 저울 교체."}]},{"n":"세트 분리","d":"필터 압력이 +10 mmHg보다 낮으면 알람 발생 (+10 mmHg 초과로 돌아오면 해제).","c":[{"c":"필터 압력 포드가 장착되지 않았거나","o":"포드의 이물질을 청소하고 필요 시","s":""},{"c":"센서 하우징에 이물질이 있음.","o":"다시 장착. OVERRIDE를 눌러 알람을 해제하고 SYSTEM TOOLS에서 자가 테스트를 수행해 포드 멤브레인 재배치. 포드 문제가 반복되면 STOP으로 세트 교체. 새 세트에서도 알람이 재발하면 치료를 종료하고 서비스 요청.","s":""},{"c":"혈액펌프와 필터 사이 라인이","o":"라인이 확실히 연결되었는지 확인.","s":""},{"c":"분리됨.","o":"치료를 재개하려면 OVERRIDE를 누름.","s":""},{"c":"필터 압력 포드 이전 혈액 유로가","o":"가능하면 조치. OVERRIDE를 누름. 불가능하면","s":""},{"c":"막힘.","o":"STOP을 누르고 CHANGE SET으로 새 세트를 장착/프라이밍.","s":""},{"c":"액세스 기구 대비 혈류 속도가 너무 낮음.","o":"혈류 속도를 높이고 OVERRIDE를 누름.","s":""},{"c":"필터 압력 센서 고장.","o":"STOP으로 치료 종료. 서비스 요청.","s":""},{"c":"리턴 라인 분리 및 리턴","o":"리턴 라인과 카테터를 확인하고","s":""},{"c":"압력 알람 고장.","o":"필요 시 조치. 유체 차단막이 젖었으면 STOP → CHANGE SET으로 새 세트를 장착/프라이밍. 젖지 않았으면 OVERRIDE를 눌러 알람을 해제하고 Status 화면으로 이동. SYSTEM TOOLS에서 자가 테스트를 수행해 리턴 압력 센서 점검.","s":""},{"c":"압력 측정 실패.","o":"자가 테스트를 수행해 압력 포드 멤브레인을 재배치. 알람을 해제해 Status 화면으로 이동. SYSTEM TOOLS를 누르고 SELF-TEST 수행. 문제가 지속되면 STOP으로 세트 교체. 새 세트에서도 재발하면 STOP으로 치료를 종료하고 서비스 요청.","s":""},{"c":"필터 압력 측정 실패.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 센서 기능 확인. 진단에서 압력 편차가 있으면 \"필터 압력 센서 고장\"의 서비스 조치로 이동."},{"c":"액세스 기구 대비 혈류 속도가 너무 낮음.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 필터 압력 확인. 진단에서 압력 편차가 있으면 같은 화면에서 압력 센서와 ARPS 압력 회로의 누설 확인. 누설이 있으면 압력 포드 실링 콘, 압력 센서, 압력 밸브, ARPS 펌프 또는 ARPS 회로를 조치. 압력이 정상이면 서비스 진단 6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 혈액펌프 유량 확인. 값이 잘못되면 혈액펌프 교체."},{"c":"필터 압력 센서 고장.","o":"","s":"교정 수행 (6.6.5 \"Calibration Screen – Pressure Sensors Calibration\", 250쪽). 6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 압력 확인. 압력 편차가 있으면 압력 센서 교체."}]},{"n":"셋업 오류","d":"프라이밍 전 자가 테스트가 실패하면 알람 발생.","c":[{"c":"셋업이 올바르지 않음.","o":"클램프 내 리턴 라인 확인. RELEASE CLAMP를 눌러 재배치. 리턴 라인 클램프를 다시 장착. 챔버 모니터 라인 장착, 필터·배출액 포드 장착, 투석액 라인 클램프 확인. 압력 센서 고장 여부 확인. 시린지 라인 및/또는 일방향 밸브 연결 확인. 시린지 라인이 클램프로 막혀 있는지 확인. 올바른 세트가 장착되었는지 확인 (HELP 참조). 조치 후 RETEST를 누름. 알람이 계속 재발하면: ● 투석액 펌프 세그먼트 장착 확인 ● 카트리지와 Prismaflex 컨트롤 유닛 사이에 막힌 라인이 없는지 확인 ● UNLOAD를 누르고, 세트 오른쪽 카트리지를 살짝 누르면서 LOAD를 눌러 재장착. 그래도 재발하면 UNLOAD 후 새 세트를 장착. 새 세트에서도 재발하면 서비스 요청.","s":""},{"c":"셋업이 올바르지 않음.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 리턴·필터·배출액 압력 센서 기능 확인. 압력 편차가 있으면 교정 수행 (6.6.5 \"Calibration Screen – Pressure Sensors Calibration\", 250쪽) 또는 압력 센서 교체. 6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 투석액 펌프 기능 확인. 펌프 오작동이면 펌프 교체. \"Verification of slave pump rotor\" 테스트 수행 (6.3.6 \"Component Replacement\" 5항, 216쪽)."}]},{"n":"시린지 비어 있음","d":"","c":[{"c":"시린지가 비어 있음.","o":"CHANGE SYRINGE를 누르고 안내에 따라 가득 찬 시린지를 장착한 뒤 알람 화면으로 돌아감. CONTINUE를 누름. 참고: 프라이밍 중에는 가득 찬 시린지가 필요함. 혈액 유로 항응고를 원하지 않으면 시린지를 멸균 생리식염수로 채움.","s":""}]},{"n":"시린지 라인 막힘","d":"","c":[{"c":"시린지 라인이 클램프로 막히거나, 꺾이거나, 막힘.","o":"시린지 라인을 점검해 클램프, 꺾임, 기타 막힘을 제거. CONTINUE를 누름.","s":""},{"c":"시린지 라인 장착 오류.","o":"시린지 라인을 다시 장착. CONTINUE를 누름.","s":""},{"c":"알람이 반복됨.","o":"CHANGE SYRINGE를 누르고 안내에 따라 시린지를 교체한 뒤 알람 화면으로 돌아감. CONTINUE를 누름.","s":""}]},{"n":"시린지 플런저 고정 안 됨","d":"","c":[{"c":"시린지 플런저 클램프 래치가 닫히지 않음.","o":"시린지 플런저 클램프 래치를 닫음. CONTINUE를 누름.","s":""},{"c":"부적합한 칼슘 용액","o":"","s":""},{"c":"Confirm Loaded Set 화면 이후, 선택한 칼슘 용액 사용 시","o":"적절한 운전 범위를 갖는 유효한 초기 유량 설정 세트가","s":""},{"c":"없으면 알람 발생.","o":"사용자 매뉴얼의 항응고 장 참조.","s":""},{"c":"(사용자 매뉴얼의 항응고 장 참조.)","o":"알람 화면에 선택한 칼슘 용액이","s":""},{"c":"너무 묽은지 너무 진한지 표시됨.","o":"","s":""},{"c":"Custom 모드에서 선택한 칼슘 용액이","o":"MODIFY SOLUTION을 누름. 화살표로","s":""},{"c":"선택한 치료 세트 유형에 사용하기에 적합하지 않음.","o":"다른 칼슘 용액을 선택. CONTINUE를","s":""},{"c":"(세트 유형.)","o":"누름. CONTINUE 버튼은 적합한 칼슘 용액을 선택한 경우에만 활성화됨.","s":""},{"c":"알람이 반복됨 — 사용 가능한 적합한 칼슘 용액이","o":"UNLOAD를 눌러 다른 세트 유형을 장착.","s":""},{"c":"없음.","o":"의사와 상의.","s":""}]},{"n":"잘못된 세트 장착","d":"이 세트는 선택한 치료에 사용할 수 없음.","c":[{"c":"인식 테스트 실패.","o":"세트가 선택한 치료와 일치하는지 확인. 치료와 세트에 대한 의사 처방을 확인. UNLOAD를 눌러 Load Set 화면으로 이동. 필요 시 Load Set 화면에서 CANCEL을 누르고 처방된 치료를 선택한 뒤 처방된 세트를 장착. 필요 시 컨트롤 유닛에 장착된 (잘못된) 세트를 제거하고 처방된 세트를 장착. 참고: 알람이 반복되면 수리 전까지 장비를 사용하지 말 것.","s":""},{"c":"인식 테스트 실패.","o":"","s":"세트와 고객 계약에 따라 올바른 치료가 잠금 해제되었는지 확인. 알람이 반복되면 바코드 리더가 올바르게 설치되고 PC 104 보드에 연결되었는지 확인."}]},{"n":"잘못된 세트 선택","d":"","c":[{"c":"바코드 판독 실패 후 고유량/저유량 세트가","o":"장착된 세트가 화면에 표시된 세트와 일치하면","s":""},{"c":"혼동됨. \"바코드 판독 실패\" 시 첫 프라이밍","o":"CONFIRM을 누름. 아니면","s":""},{"c":"주기 종료 시","o":"DISCONNECT를 누르고 세트를 재장착.","s":""},{"c":"사용자가 CONFIRM을 눌러 장착된 세트와 처방된 세트가 같은지 확인해야 함.","o":"","s":""},{"c":"저울에 이물체가 있음.","o":"장착된 세트가 화면에 표시된 세트와 일치하면 CONFIRM을 누름. 아니면 DISCONNECT를 누르고 세트를 재장착.","s":""},{"c":"리턴 라인이 배출액 백에 연결되지 않았거나","o":"장착된 세트가 화면에 표시된 세트와 일치하면","s":""},{"c":"배출액 백 콕이 열려 있음.","o":"(화면에 표시된 세트와 일치하면) CONFIRM을 누름. 아니면 DISCONNECT를 누르고 세트를 재장착.","s":""},{"c":"저울 고장.","o":"DISCONNECT를 누르고 세트 제거. 서비스 요청.","s":""},{"c":"저울 고장.","o":"","s":"6.5.3 \"Diagnose Screen – Scale Diagnose\"(224쪽)에서 저울 기능 확인. 필요 시 저울 교정 (6.6.3 \"Calibration Screen – Scales Calibration\", 247쪽). PRISMAFLEX 컨트롤 유닛을 다시 구동해 새 Prime 수행. 알람이 재발하면 저울 교체."}]},{"n":"항응고 일시중단","d":"칼슘 주입이 (중단되어) 구연산 주입이 정지됨 — 칼슘 항응고 일시중단.","c":[{"c":"칼슘 시린지가 비었거나 미장착, 칼슘","o":"OVERRIDE를 누르고 근본 원인을 조치해","s":""},{"c":"라인이 클램프로 막혔거나 미연결, 투석액 펌프","o":"세트 내 응고를 방지. 참고: 칼슘 주입 시 환자 지표를 추가로 모니터링해야 함. 처방 확인.","s":""},{"c":"정지.","o":"","s":""}]},{"n":"백 비어 있음","d":"","c":[{"c":"화면에 표시된 백이 비어 있음.","o":"새 백을 연결 (알람 화면 안내 참조). Custom 모드에서 Variable Empty Bag 방식이 설정되어 있으면 MODIFY BAG을 누르고 화살표로 새 허용 용량을 설정해 더 크거나 작은 백으로 변경 가능. 준비되면 CONTINUE를 누름.","s":""},{"c":"백이 부분적으로 지지되고 있음 (자유롭게 매달려 있지 않음).","o":"부분 지지를 제거하고 CONTINUE를 누름.","s":""},{"c":"백이 떨어짐." 위를 면밀히 모니터링.","s":""},{"c":"용액 백 또는 라인에 기포.","o":"백 연결부 확인. 조치 후 CONTINUE를 누름.","s":""},{"c":"배출액에 기포.","o":"포드와 펌프 사이 배출 라인 꺾임 확인. 조치 후 CONTINUE를 누름.","s":""},{"c":"경질 용기에 비통기형(non-breathing) 스파이크를 사용함.","o":"비통기형 스파이크를 통기형 스파이크로 교체. CONTINUE를 누름.","s":""},{"c":"라인이 잘못된 백에 연결되었거나 백이 잘못된","o":"라인이 올바른 백에 연결되었는지","s":""},{"c":"저울에 걸림.","o":"확인. 라인 색상 코드가 사용 저울 색상과 일치해야 함.","s":""},{"c":"비폐색(non-occlusive) 펌프 또는 저울 고장.","o":"STOP을 누르고 치료 종료. 서비스 요청.","s":""},{"c":"진동이 있는 환경.","o":"진동원을 멈출 수 없으면 STOP을 누르고 치료 종료. 서비스 요청.","s":""},{"c":"투석액 펌프 비폐색.","o":"","s":"\"Verification of slave pump rotor\" 테스트 수행 (6.3.6 \"Component Replacement\" 5항, 216쪽). 6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 펌프 속도 확인. 편차가 있으면 투석액 펌프 교체."},{"c":"투석액 저울 고장.","o":"","s":"6.5.3 \"Diagnose Screen – Scale Diagnose\"(224쪽)에서 저울 기능 확인. 필요 시 저울 교정 (6.6.3 \"Calibration Screen – Scales Calibration\", 247쪽). PRISMAFLEX 컨트롤 유닛을 다시 구동해 새 Prime 수행. 알람이 재발하면 저울 교체."},{"c":"진동이 있는 환경.","o":"","s":"환경이 사양에 맞는지 확인."}]},{"n":"누액 감지","d":"누액 감지기가 누설을 감지함.","c":[{"c":"커넥터가 헐겁거나 연결되지 않음.","o":"다음을 확인:","s":""},{"c":"라인 파손.","o":"● 모든 연결부가 단단하고 누설이 없음.","s":""},{"c":"기타 가능한 원인:","o":"● 모든 백에 누설이 없음. ● 모든 라인이 연결되어 있고 누설이 없음. ● 드립 트레이에 액체가 없음. 드립 트레이를 말리고 센서를 닦음. 누액 감지기가 액체 감지를 멈추면 CONTINUE 버튼이 활성화됨. 활성화되지 않으면 센서가 건조하고 잔여 액체 등으로 오염되지 않았는지 확인. 그래도 활성화되지 않으면 STOP을 누르고 치료 종료. 문제가 반복되면 서비스 요청.","s":""},{"c":"누액 감지기 부위가 젖어 있음.","o":"","s":""}]},{"n":"증가 한계 도달","d":"의도치 않은 환자 체액 증가량이 (한계를) 초과해 안전상 (투석액 펌프가) 영구 중지됨. (혈액) 펌프는 계속 구동.","c":[{"c":"유량 문제로 PRISMAFLEX 컨트롤 유닛이","o":"STOP을 누르고 치료 종료. 필요 시","s":""},{"c":"환자에게 과량의 액체를 주입함:","o":"새 세트로 치료를 재시작. HISTORY로 STOP 시점의 정확한 체액 교환 상태 확인.","s":""},{"c":"클램프 닫힘 또는 라인 꺾임으로 인한 반복적 유량 막힘; 배출액 백 액세스 포트의 잘못된 사용으로 인한 유량 오류.","o":"","s":""}]},{"n":"손실 한계 도달","d":"의도치 않은 환자 체액 손실량이 (한계를) 초과해 안전상 (투석액 펌프가) 영구 중지됨. (혈액) 펌프는 계속 구동.","c":[{"c":"유량 문제로 PRISMAFLEX 컨트롤 유닛이","o":"STOP을 누르고 치료 종료. 필요 시","s":""},{"c":"환자로부터 과량의 액체를 제거함:","o":"새 세트로 치료를 재시작. HISTORY로 STOP 시점의 정확한 체액 교환 상태 확인.","s":""},{"c":"클램프 닫힘 또는 라인 꺾임으로 인한 반복적 유량 막힘; 용액 백(PBP, 투석액, 치환액) 액세스 포트의 잘못된 사용으로 인한 유량 오류; 배출액 탈기로 인한 유량 오류.","o":"","s":""}]},{"n":"환자 체액 증가 과다","d":"","c":[{"c":"PBP 주입량이 해당 치료/세트의 최대 허용","o":"PBP 주입을 멈추고 추가 체액 증가 없이","s":""},{"c":"환자 체액 증가량에 도달함.","o":"치료 계속: FLOW SETTINGS를 누르고 PBP 속도를 0으로 설정. 환자 체액 증가를 감수하고 치료 계속: CONTINUE를 누름 — 환자 체액 증가량이 최대 허용값보다 10% 더 늘면 알람이 재발함. 치료 종료: STOP을 누름.","s":""}]},{"n":"치환액 용기 비어 있음","d":"","c":[{"c":"치환액 용기가 비어 있음.","o":"새 치환액 용기를 연결. REPLACEMENT 소프트키를 누르고 화살표로 새 용기 용량을 입력. CONTINUE를 누름.","s":""},{"c":"치환액 용기가 부분적으로 지지되고 있음 (자유롭게 매달려 있지 않음).","o":"부분 지지를 제거하고 CONTINUE를 누름.","s":""},{"c":"(자유롭게 매달려 있지 않음).","o":"","s":""},{"c":"치환액 용기가 떨어짐.","o":"새 치환액 용기를 연결 (알람 화면 안내 참조). 준비되면 CONTINUE를 누름.","s":""}]},{"n":"저울 열림","d":"저울이 제대로 닫히지 않음.","c":[{"c":"저울이 완전히 닫히지 못하게 하는 물체가 있음,","o":"가능한 원인을 점검·조치.","s":""},{"c":"백이 고리에 잘못 걸림, 운반","o":"저울 바를 장비 쪽으로 밀어 닫힘 위치에","s":""},{"c":"바 트레이 중앙에 있지 않거나 손잡이가 아래(바닥 쪽)로","o":"잠기게 함. CONTINUE를 누름.","s":""},{"c":"돌려지지 않음.","o":"","s":""},{"c":"저울 센서 고장.","o":"STOP을 누르고 치료 종료. 서비스 요청.","s":""},{"c":"저울 센서 고장.","o":"","s":"6.5.3 \"Diagnose Screen – Scale Diagnose\"(224쪽)에서 저울 센서 기능 확인. 센서 테스트 실패 시 저울 교체."}]},{"n":"TMP 과다","d":"막관통압(TMP)이 멤브레인 압력 한계를 초과함.","c":[{"c":"한외여과 속도(UFR)가 너무 높음. 너무 많은","o":"PBP, 치환액 및/또는 환자 제수","s":""},{"c":"액체를 제거 중임 (UFR = 환자 제수","o":"속도를 낮추거나, 대신 혈류 속도를","s":""},{"c":"속도 + 치환액 속도 + PBP","o":"높임. 알람 화면으로 돌아가","s":""},{"c":"속도).","o":"CONTINUE를 누름.","s":""},{"c":"필터 및 배출액 압력 측정","o":"UFR을 일시적으로 낮춰 알람을 해제.","s":""},{"c":"오류.","o":"Status 화면에서 SYSTEM TOOLS를 누르고 자가 테스트 수행. 이전 유량으로 되돌림. 알람이 재발하면 UFR을 낮추거나 세트 교체.","s":""},{"c":"체외순환 회로의 불충분한","o":"STOP/DISCONNECT를 누르고 세트 교체","s":""},{"c":"항응고.","o":"하거나 환자 응고 지표를 검사하고 필요 시 항응고제 주입을 조정. 참고: 필터 내 혈액이 응고되면 Filter Clotted 경고가 발생함.","s":""},{"c":"CRRT MARS 치료 중: MARS FLUX","o":"치환액 및/또는 환자 제수","s":""},{"c":"필터와 DiaFLUX 필터를 합친","o":"및/또는 PBP 속도를 낮춤. CONTINUE를 누름.","s":""},{"c":"막관통압이 멤브레인 압력 한계를 초과함.","o":"","s":""}]},{"n":"TMPa 과다","d":"액세스 막관통압이 안전 (한계)를 초과함.","c":[{"c":"배출 속도가 너무 높음. 너무 많은 혈장이","o":"치환액을 줄이거나 (혈류 속도를) 높임.","s":""},{"c":"제거되고 있음. (배출 속도 = 환자 혈장","o":"높임. 알람 화면으로 돌아가","s":""},{"c":"손실 속도 + 치환액 속도)","o":"CONTINUE를 누름.","s":""},{"c":"플라즈마필터 압력 강하가 증가 중,","o":"혈류 속도를 낮추거나","s":""},{"c":"불충분한 항응고 때문일 수 있음.","o":"항응고 처방을 조정.","s":""}]},{"n":"TPE 처방 완료","d":"처방된 총 치환량이 (전달됨).","c":[{"c":"총 치환 주입량에 도달함.","o":"남은 치환액을 다 쓸 때까지 치료를 계속하려면 CONTINUE를 누름. \"Replacement Container Empty\" 주의 알람이 나오면 STOP을 누르고 치료 종료. 새 TPE Prescription Delivered 알람 시점을 설정하려면 FLOW SETTINGS를 누른 뒤 Enter TPE Prescription 화면에서 Total Replacement Input을 늘림.","s":""}]},{"n":"미해결 유량 문제","d":"\"Caution: Flow Problem\" 해결 시도가 너무 많아 (치료 정확도가) 저하될 수 있음.","c":[{"c":"해제 시도가 제조사 설정 한계인","o":"STOP을 누르고 치료 종료. 필요 시","s":""},{"c":"3시간 내 10회를 초과함.","o":"새 세트로 치료를 재시작. HISTORY로 STOP 시점의 정확한 체액 교환 상태 확인.","s":""}]},{"n":"항응고 확인 시점","d":"","c":[{"c":"환자 지표 모니터링 알림.","o":"\"Citrate-Calcium\" 항응고 방식은 환자 지표를 추가로 모니터링해야 함. 이 Advisory는 구연산 사용 시 정해진 시간 간격으로 발생함. \"Citrate – Calcium, External Pump\" 방식을 선택한 경우 외부 시린지/주입 펌프로 칼슘이 올바르게 주입되는지 확인. 참고: 확인 간격을 바꾸려면 Status 화면의 SYSTEM TOOLS 사용. 이 Advisory 발생 주기는 담당 의사와 확인.","s":""}]},{"n":"배터리 소진","d":"장비 구성에 (백업 배터리가) 포함된 경우 해당 (자세한 내용은 현지 담당자 문의). 백업 배터리 전력 수준이 (낮아지면) 나타남.","c":[{"c":"백업 배터리 방전.","o":"OVERRIDE를 누르고 셋업 계속. 배터리 충전을 위해 장비를 최소 4시간 켜 두어야 함. 참고: 배터리가 완전히 충전되기 전에 주전원이 끊기면 장비는 백업 배터리가 없는 것처럼 동작함. 자세한 내용은 5.18 \"Power failure\"(201쪽) 참조.","s":""},{"c":"배터리 노후 또는 내부 배선 파손으로","o":"장비를 24시간 넘게 켜 두거나 운전.","s":""},{"c":"알람이 반복됨.","o":"24시간 내에 알람이 자동 해제되지 않으면 서비스 요청.","s":""},{"c":"배터리 노후 또는 내부 배선 파손으로","o":"","s":"배터리 배선 연결 확인. 필요 시 조치."},{"c":"알람이 반복됨.","o":"","s":"배터리 재충전 용량 확인. 오작동이면 배터리 교체."}]},{"n":"혈류 정지됨","d":"장비가 Stop 화면에서 60초간 방치됨.","c":[{"c":"장비가 Stop 화면에서 60초 넘게 방치됨","o":"혈액 유로의 응고 징후를 점검.","s":""},{"c":"(모든 펌프 정지).","o":"응고되었으면 세트 교체 — CONTINUE를 눌러 알람을 해제하고 Stop 화면으로 돌아간 뒤 CHANGE SET 선택. 응고되지 않았으면 CONTINUE를 눌러 알람을 해제하고 Stop 화면으로 돌아감.","s":""}]},{"n":"칼슘 라인 미연결","d":"","c":[{"c":"칼슘 라인이 시린지에 연결되지 않음.","o":"전용 칼슘 주입 라인을 시린지에 연결. CONTINUE를 누름.","s":""},{"c":"잘못된 라인이 연결됨.","o":"\"Citrate – Calcium, PRISMAFLEX Syringe Pump\" 방식 선택 시 칼슘 주입에는 전용 주입 라인만 사용.","s":""},{"c":"일회용 세트의 사용하지 않는 시린지 라인이","o":"일회용 세트의 사용하지 않는 시린지 라인을","s":""},{"c":"칼슘 시린지에 연결됨.","o":"클램프로 막고 치료 내내 사용하지 않음 (\"Citrate – Calcium, PRISMAFLEX Syringe Pump\" 방식 선택 시). CHANGE SYR/LINE 소프트키를 누르고 화면 안내에 따라 전용 칼슘 주입 라인을 시린지에 연결.","s":""},{"c":"잘못된 크기의 시린지가 장착됨.","o":"\"Citrate – Calcium, PRISMAFLEX Syringe Pump\" 방식 선택 시 허용된 브랜드의 50 mL 시린지만 사용.","s":""},{"c":"시린지 내 공기.","o":"CHANGE SYR/LINE을 누름. 안내에 따라 가득 찬 시린지를 장착하고 알람 화면으로 돌아감. CONTINUE를 누름.","s":""},{"c":"칼슘 주입 라인에 역류 방지 밸브가","o":"CHANGE SYR/LINE을 누름. 안내에 따라","s":""},{"c":"없음.","o":"역류 방지 밸브가 있는 새 칼슘 주입 라인을 장착하고 알람 화면으로 돌아감. CONTINUE를 누름.","s":""}]},{"n":"칼슘 시린지 거의 비어 있음","d":"","c":[{"c":"칼슘 시린지가 5분 후 비게 됨.","o":"이 Advisory가 나타날 때 가득 찬 시린지를 장착하려면 CHANGE SYR/LINE을 누르고 화면 안내를 따름. 알람 화면으로 돌아가 CONTINUE를 누름.","s":""}]},{"n":"칼슘 시린지 미장착","d":"","c":[{"c":"칼슘 시린지가 장착되지 않음.","o":"CHANGE SYR/LINE 소프트키를 눌러 칼슘 시린지를 장착. RETEST를 눌러 시린지 테스트 재시작. 실패가 반복되면 DISCONNECT로 치료 종료. 서비스 요청.","s":""},{"c":"\"Citrate with integrated calcium\" 방식을","o":"","s":"6.5.7 \"Diagnose Screen – Syringe Pump\"(230쪽)에서"},{"c":"선택했는데 칼슘 시린지가","o":"","s":"시린지 펌프 기능 확인."},{"c":"장착되지 않음.","o":"","s":"교정 수행 (6.6.6 \"Calibration Screen – Syringe Pump Calibration\", 251쪽). 오작동이면 시린지 펌프 교체."}]},{"n":"칼슘 라인 막힘","d":"","c":[{"c":"칼슘 라인이 클램프로 막힘.","o":"칼슘 주입 라인 클램프를 풂. CONTINUE를 누름.","s":""},{"c":"환자의 중심정맥 접근부가","o":"환자 중심정맥 접근부의 클램프를","s":""},{"c":"클램프로 막힘.","o":"풂.","s":""},{"c":"환자의 중심정맥 접근부가","o":"환자 접근부 개통성 점검 — 혈전으로","s":""},{"c":"막혔거나 정맥 내막에 붙었을 수","o":"있음. 중심정맥 카테터 평가를 위해","s":""},{"c":"(정맥.)","o":"의사와 상의.","s":""},{"c":"시린지 라인 장착 오류.","o":"칼슘 주입 라인을 점검해 클램프, 꺾임, 기타 막힘을 제거. 꺾임을 막기 위해 시린지 펌프 위의 클립을 칼슘 주입 라인에 사용. CONTINUE를 누름. 참고: 알람이 반복되면 CHANGE SYR/LINE 소프트키로 시린지와 칼슘 라인을 모두 교체.","s":""}]},{"n":"칼슘 시린지 비어 있음","d":"","c":[{"c":"칼슘 시린지가 비어 있음.","o":"CHANGE SYR/LINE 소프트키를 누르 AG SETTINGS를 누르고 \"Continuous, 0 mL/h\"로 변경한 뒤 알람 화면으로 돌아감. 2. 플런저 클램프 해제 버튼을 눌러 시린지 펌프를 이동 끝 위치에서 풂. 3. CONTINUE를 누르면 알람이 해제됨.","s":""}]},{"n":"시린지 라인 막힘","d":"","c":[{"c":"일회용 세트의 시린지 라인이 클램프로 막히거나,","o":"시린지 라인을 점검해 클램프, 꺾임,","s":""},{"c":"꺾이거나, 다른 방식으로 막힘.","o":"기타 막힘을 제거. CONTINUE를 누름.","s":""},{"c":"시린지 라인 장착 오류.","o":"시린지 라인을 다시 장착. CONTINUE를 누름.","s":""},{"c":"알람이 반복됨.","o":"CHANGE SYRINGE를 누르고 안내에 따라 시린지를 교체한 뒤 알람 화면으로 돌아감. CONTINUE를 누름.","s":""}]},{"n":"시린지 미장착","d":"","c":[{"c":"시린지 테스트 수행 후 시린지가","o":"1. CHANGE SYRINGE를 누르고","s":""},{"c":"장착되지 않음.","o":"안내에 따라 시린지를 장착한 뒤 알람 화면으로 돌아감. 2. RETEST를 눌러 시린지 테스트 재시작. 3. 실패가 반복되면 DISCONNECT를 누르고 서비스에 연락해 고장을 보고.","s":""},{"c":"시린지 펌프 고장.","o":"","s":"6.5.7 \"Diagnose Screen – Syringe Pump\"(230쪽)에서 시린지 펌프 기능 확인. 교정 수행 (6.6.6 \"Calibration Screen – Syringe Pump Calibration\", 251쪽). 오작동이면 시린지 펌프 교체."}]},{"n":"세트 교체 시기","d":"사용 시간이 사용자 설정 \"Time (to Change Set)\"에 도달함 (치료/세트 조합에 따라).","c":[{"c":"\"Time to Change Set\" Advisory 한계에","o":"STOP/DISCONNECT를 누르고","s":""},{"c":"도달함.","o":"(세트를 교체하거나) OVERRIDE를 누르고 세트를 계속 모니터링. 경고! PRISMAFLEX 일회용 세트는 72시간 사용 후 반드시 교체해야 함. 이 한계를 넘겨 사용하면 펌프 세그먼트가 파열될 수 있음. 참고: 적절한 필터 성능을 위해 CRRT 일회용 세트는 24시간 사용마다 교체를 권장함.","s":""},{"c":"CRRT MARS 치료 중: \"Time to","o":"STOP/DISCONNECT를 누르고","s":""},{"c":"Change Set\" Advisory 한계에 도달함.","o":"PRISMAFLEX 컨트롤 유닛과 MARS 모니터 양쪽의 일회용 세트를 (교체)하거나 OVERRIDE를 누르고 세트를 계속 모니터링. 참고! X-MARS 키트를 (정해진) 시간 넘게 사용하지 말 것. 흡착 컬럼(diaMARS IE 250, diaMARS AC 250)은 이 운전 시간 후 포화될 가능성이 높음.","s":""}]},{"n":"TMP 너무 높음","d":"막관통압이 사용자 설정 (한계)에 도달함.","c":[{"c":"현재 혈류 속도 대비 한외여과 속도(UFR)가","o":"치환액 및/또는 환자 제수","s":""},{"c":"너무 높음. (UFR = 환자 제수 …)","o":"유량 및/또는 PBP를 낮추거나","s":""},{"c":"속도 + 치환액 속도 + PBP","o":"혈류 속도를 높임. 알람 화면으로 돌아가","s":""},{"c":"속도).","o":"OVERRIDE를 누름.","s":""},{"c":"체외순환 회로의 불충분한","o":"STOP/DISCONNECT를 누르고 세트를 교체하거나","s":""},{"c":"항응고.","o":"환자 응고 지표를 검사하고 필요 시 항응고제 주입을 조정. 참고: 필터 내 혈액이 응고되면 Warning: Filter Clotted 알람이 발생함.","s":""},{"c":"혈액 유로의 라인 꺾임.","o CT로 치료 종료. 서비스 요청.","s":""},{"c":"혈액누출 감지기 고장.","o":"","s":"6.5.9 \"Diagnose Screen – BLD (Blood Leak Detector)\"(234쪽)에서 혈액누출 감지기 기능 확인. 오작동이면 혈액누출 감지기 교체."}]},{"n":"혈액펌프","d":"혈액펌프 속도가 올바르지 않음.","c":[{"c":"펌프 롤러 또는 레이스웨이 내 펌프","o":"CONTINUE를 누름.","s":""},{"c":"세그먼트의 일시적 문제.","o":"","s":""},{"c":"펌프 레이스웨이에 방해 물체, 라인 클램프 막힘 또는","o":"라인 꺾임. 알람이 재발하면 치료 종료: 1. CONTINUE를 누르고 Status 화면이 나타나면 즉시 STOP을 누름. 2. Stop 화면에서 END TREATMENT를 선택하고 안내에 따라 환자 분리 및 세트 분리. 3. 알람 조치/해제를 위해 서비스 요청.","s":""},{"c":"(펌프 레이스웨이) 로터 중앙의 손나사가 풀림.","o":"","s":""},{"c":"펌프 고장.","o":"서비스 요청.","s":""},{"c":"로터 중앙의 손나사가 풀림.","o":"","s":"나사를 확인하고 필요 시 조치."},{"c":"펌프 고장.","o":"","s":"6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 혈액펌프 기능 확인. 오작동이면 혈액펌프 교체."}]},{"n":"칼슘 시린지 미장착","d":"이 알람은 프라이밍 중에만 나타남.","c":[{"c":"칼슘 시린지가 장착되지 않음.","o":"CHANGE SYR/LINE을 눌러 칼슘 시린지를 장착. RETEST를 눌러 시린지 테스트 재시작. 실패가 반복되면 DISCONNECT로 치료 종료. 서비스 요청.","s":""},{"c":"시린지 펌프 고장.","o":"","s":"6.5.7 \"Diagnose Screen – Syringe Pump\"(230쪽)에서 시린지 펌프 기능 확인. 교정 수행 (6.6.6 \"Calibration Screen – Syringe Pump Calibration\", 251쪽). 오작동이면 시린지 펌프 교체."}]},{"n":"사용자 설정 데이터 저장 불가","d":"","c":[{"c":"새로 사용자 설정한 값 저장 중 오류.","o":"EXIT CUSTOM을 누름. 원하면 Custom 모드로 돌아가 다시 설정 시도. 알람이 재발하면 서비스 요청. 참고: 문제 해결 전에도 환자 치료는 가능하며, 마지막으로 저장된 Custom 모드 값이 사용됨.","s":""},{"c":"새로 사용자 설정한 값 저장 중 오류.","o":"","s":"Compact Flash 카드 확인. 오작동이면 교체."}]},{"n":"클램프 닫힘 고착","d":"","c":[{"c":"리턴 라인 클램프에 외력이 가해짐.","o":"리턴 라인 클램프 확인. RETEST를 누름.","s":""},{"c":"리턴 라인 클램프 고장.","o":"알람이 해제되지 않으면 CHANGE SET으로 세트를 교체하거나 DISCONNECT로 치료 종료. 서비스 요청.","s":""},{"c":"리턴 라인 클램프 고장.","o":"","s":"6.5.8 \"Diagnose Screen – Clamp and Pinch Valves\"(232쪽)에서 리턴 라인 클램프 기능 확인. 오작동이면 리턴 라인 클램프 교체."}]},{"n":"통신 오류","d":"오류 코드: 2~7 / 원인: Code=2 보호부와 통신 없음 / Code=3 보호부 통신 링크 오류 / Code=4 제어부 통신 링크 오류 / Code=5 보호부 상태 명령 누락 / Code=6 보호부 알람 명령 누락 / Code=7 보호 태스크가 (메시지를) 보낼 수 없음.","c":[{"c":"알람 화면의 \"Due to\" 메시지 참조.","o":"1. 장비를 끄고 리턴 라인을 리턴 라인 클램프에서 빼낸 뒤 (해당 시) 혈액을 반환. 참고: 혈액을 반환하면 장착된 세트로 치료를 재개할 라","s":""},{"c":"자가 테스트 실패.","o":"다름. 모든 소프트키로 알람을 해제할 수 있음. 1. DISCONNECT: 세트 분리/제거 안내. 2. NEW SET: 세트 분리, 새 세트 장착, 새 프라이밍 주기 시작 안내. 3. REPRIME: 세트 재프라이밍 안내. 4. RETEST: 프라임 테스트 재시작.","s":""},{"c":"압력 포드 미장착; 센서 하우징에","o":"알람 화면에 표시된 모든 압력 포드가","s":""},{"c":"이물질; 포드 누설.","o":"올바르게 장착되었는지 장착/확인. RETEST를 누름.","s":""},{"c":"세트 내 라인 클램프 막힘.","o":"막힌 라인 클램프를 풂. RETEST를 누름.","s":""},{"c":"압력 센서 고장.","o":"DISCONNECT로 세트 분리. 서비스에 연락해 고장 코드를 보고.","s":""},{"c":"압력 센서 고장.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽) 10·11항에 따라 ARPS 기능 확인. 같은 화면에서 압력 센서 기능 확인. 편차가 있으면 교정 수행 (6.6.5, 250쪽). 오작동이면 ARPS 및/또는 압력 센서 교체."},{"c":"세트 내 라인 클램프 막힘.","o":"막힌 라인 클램프를 풂. RETEST를 누름.","s":""},{"c":"챔버 모니터 라인이 (리턴 압력 포트에) 확실히 연결되지 않음.","o":"유체 차단막이 젖거나 손상되지 않았는지 확인.","s":""},{"c":"미연결.","o":"(젖거나 손상되지 않았으면) 모니터 라인을 리턴 압력 포트의 루어락에 고정하고 REPRIME을 눌러 같은 세트를 다시 프라이밍. 유체 차단막이 젖거나 손상되었으면 DISCONNECT를 누르고 CHANGE SET으로 새 세트를 장착/프라이밍.","s":""},{"c":"압력 센서 고장.","o":"새 세트에서도 실패하면 DISCONNECT로 세트 분리. 서비스에 연락해 고장 코드를 보고.","s":""},{"c":"세트 내 공기 및 프라이밍 품질 불량.","o":"REPRIME을 눌러 세트를 다시 프라이밍.","s":""},{"c":"압력 센서 고장.","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서 ARPS와 리턴 압력 센서 기능 확인. 편차가 있으면 교정 수행 (6.6.5, 250쪽). 오작동이면 ARPS 및/또는 리턴 압력 센서 교체."},{"c":"배출 라인이 혈액누출 (감지기에) 올바르게 장착되지 않음.","o":"배출 라인을 (아래에서 위로) 다시 장착하고 (튜브 가이드를 따라) 배치.","s":""},{"c":"감지기에 장착되지 않음.","o":"튜브 가이드를 따라 배치. RETEST를 누름.","s":""},{"c":"혈액누출 감지기 위치의 배출(effluent) 라인에 기포가 있음.","o":"감지기에서 라인을 빼거나 튜브를 두드려","s":""},{"c":"감지기에 장착되지 않음.","o":"기포를 밀어냄. RETEST를 누름.","s":""},{"c":"세트가 완전히 프라이밍되지 않음.","o":"라인 클램프 막힘과 연결부를 확인하고 조치. REPRIME을 누르고 안내를 따름. 위 조치 후에도 실패가 재발하면 새 세트로 재시도 (NEW SET을 누르고 안내를 따름).","s":""},{"c":"혈액누출 감지기 고장.","o":"새 세트에서도 실패하면 DISCONNECT로 세트 분리. 서비스에 연락해 고장 코드를 보고.","s":""},{"c":"감지기를 통과하는 튜브 경로에 액체 또는 이물질이 있음.","o":"감지기에서 라인을 제거. \"치실질\"하듯","s":""},{"c":"감지기에 장착되지 않음.","o":"(\"치실질\"하듯) 보풀 없는 천과 이소프로필알코올로 감지기 내부를 청소. 완전히 건조. 배출 라인을 물로 닦고 완전히 건조. 라인을 감지기와 튜브 가이드에 다시 장착. OVERRIDE를 누름.","s":""},{"c":"혈액누출 감지기 고장.","o":"","s":"6.5.9 \"Diagnose Screen – BLD (Blood Leak Detector)\"(234쪽)에서 혈액누출 감지기 기능 확인. 오작동이면 혈액누출 감지기 교체."},{"c":"내부 오작동.","o":"RETEST를 누름. 실패가 반복되면 DISCONNECT로 세트 분리. 서비스에 연락해 고장 코드를 보고.","s":""},{"c":"ABD(기포감지기) 위치에 공기 존재.","o":"모니터 라인을 분리하고 챔버를 다시 채움.","s":""},{"c":"내부 오작동.","o":"","s":"6.5.6 \"Diagnose Screen – Air Detector\"(229쪽)에서 기포감지기 기능 확인. 편차가 있으면 교정 수행. 오작동이면 기포감지기 교체. 6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 펌프 기능 확인. 편차가 있으면 펌프 교체."},{"c":"리턴 라인이 리턴 라인 클램프에 올바르게","o":"REPRIME을 누름. 해제된 리턴 라인","s":""},{"c":"장착되지 않음; 리턴 라인 클램프에 막힘.","o":"클램프에 리턴 라인을 장착하고 같은 세트를 다시 프라이밍. 다시 실패하면 DISCONNECT를 누르고 CHANGE SET으로 새 세트를 장착/프라이밍.","s":""},{"c":"탈기 챔버 모니터 라인이 리턴 압력 포트에","o":"유체 차단막이 손상되지 않았는지 확인하고","s":""},{"c":"연결되지 않음; 프라이밍 주기 중","o":"유체 차단막과 챔버 모니터 라인 연결을","s":""},{"c":"오류 발생.","o":"단단히 조임. 손상되지 않았으면 모니터 라인을 리턴 압력 포트의 루어락에 고정하고 REPRIME을 눌러 같은 세트를 다시 프라이밍. 유체 차단막이 손상되었으면 DISCONNECT를 누르고 CHANGE SET으로 새 세트를 장착/프라이밍.","s":""},{"c":"펌프 세그먼트 장착 불량; 펌프 레이스웨이","o":"누설을 확인하고 연결부를 조임.","s":""},{"c":"막힘; 세트 외부 누설.","o":"3회 반복 실패하면 새 세트로 재시도 (NEW SET을 누르고 안내를 따름).","s":""},{"c":"펌프 고장.","o":"새 세트에서도 실패하면 DISCONNECT로 세트 분리. 서비스에 연락해 고장 코드를 보고.","s":""},{"c":"펌프 고장, 리턴 압력 센서 고장 또는","o":"","s":"6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽)에서"},{"c":"ARPS 압력 회로 누설.","o":"","s":"리턴·배출액·필터 압력 센서 기능 확인. 압력 센서와 ARPS 압력 회로 누설 확인. 누설이 있으면 압력 포드 실링 콘, 압력 센서, 압력 밸브, ARPS 펌프 또는 ARPS 회로를 조치. \"Verification of slave pump rotor\" 테스트 수행 (6.3.6 \"Component Replacement\" 5항, 216쪽). 6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 혈액펌프 기능 확인. 오작동이면 혈액펌프 교체. 6.5.8 \"Diagnose Screen – Clamp and Pinch Valves\"(232쪽)에서 리턴 라인 클램프 기능 확인. 오작동이면 교체."},{"c":"핀치 밸브 세그먼트가 핀치 밸브에","o":"RETEST를 누름. 실패가 반복되면 새","s":""},{"c":"올바르게 위치하지 않음.","o":"세트로 재시도 (NEW SET을 누르고 안내를 따름).","s":""},{"c":"핀치 밸브 고장.","o":"새 세트에서도 실패하면 DISCONNECT로 세트 분리. 서비스에 연락해 고장 코드를 보고.","s":""},{"c":"핀치 밸브 고장.","o":"","s":"6.5.8 \"Diagnose Screen – Clamp and Pinch Valves\"(232쪽)에서 핀치 밸브 기능 확인. 오작동이면 핀치 밸브 교체."},{"c":"리턴 라인 클램프에 막힘.","o":"리턴 클램프 버튼을 누른 채 다른 손으로 막힘을 제거. RETEST를 누름.","s":""},{"c":"리턴 클램프 센서 고장.","o":"알람이 반복되면 DISCONNECT로 세트 분리. 서비스에 연락해 고장 코드를 보고.","s":""},{"c":"리턴 클램프 센서 고장.","o":"","s":"6.5.8 \"Diagnose Screen – Clamp and Pinch Valves\"(232쪽)에서 리턴 라인 센서 기능 확인. 오작동이면 리턴 클램프 센서 교체."},{"c":"리턴 라인 클램프에 막힘.","o":"리턴 클램프 버튼을 누른 채 다른 손으로 막힘을 제거. RETEST를 누름. (반복되면) DISCONNECT. 서비스에 연락해 고장 코드를 보고.","s":"각 압력 센서 밸브 (확인). 6.5.4 \"Diagnose Screen – Pressure Pod Reposition\"(226쪽) 10·11항에 따라 ARPS 기능 확인. 오작동이면 ARPS 압력 센서 또는 ARPS 펌프 교체. 6.5.8 \"Diagnose Screen – Clamp and Pinch Valves\"(232쪽)에서 리턴 라인 센서 기능 확인. 오작동이면 리턴 클램프 센서 교체."},{"c":"내부 오작동: 시린지 테스트가 600초 이내에","o":"RETEST를 눌러 시린지 테스트 재시작. 실패가","s":""},{"c":"완료되지 않음.","o":"반복되면 DISCONNECT를 누르고 서비스에 연락해 고장 코드 번호를 보고.","s":""}]},{"n":"치환액 펌프","d":"치환액(보라색) 펌프 속도가 올바르지 않음.","c":[{"c":"펌프 롤러 또는 레이스웨이 내 펌프","o":"CONTINUE를 누름.","s":""},{"c":"세그먼트의 일시적 문제.","o":"","s":""},{"c":"펌프 레이스웨이에 방해 물체, 라인 클램프 막힘 또는","o":"라인 꺾임. 알람이 재발하면 치료 종료: 1. CONTINUE를 누르고 Status 화면이 나타나면 즉시 STOP을 누름. 2. Stop 화면에서 END TREATMENT를 선택하고 안내에 따라 환자 분리 및 세트 분리. 3. 알람 조치/해제를 위해 서비스 요청.","s":""},{"c":"(펌프 레이스웨이) 로터 중앙의 손나사가 풀림.","o":"","s":""},{"c":"펌프 고장.","o":"서비스 요청.","s":""},{"c":"로터 중앙의 손나사가 풀림.","o":"","s":"나사 확인. 필요 시 조치."},{"c":"펌프 고장.","o":"","s":"6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 치환액 펌프 기능 확인. 오작동이면 치환액 펌프 교체."}]},{"n":"치환액 펌프 2","d":"치환액 2(녹색) 펌프 속도가 올바르지 않음.","c":[{"c":"펌프 롤러 또는 레이스웨이 내 펌프","o":"CONTINUE를 누름.","s":""},{"c":"세그먼트의 일시적 문제.","o":"","s":""},{"c":"펌프 레이스웨이에 방해 물체, 라인 클램프 막힘 또는","o":"라인 꺾임. 알람이 재발하면 치료 종료: 1. CONTINUE를 누르고 Status 화면이 나타나면 즉시 STOP을 누름. 2. Stop 화면에서 END TREATMENT를 선택하고 안내에 따라 환자 분리 및 세트 분리. 3. 알람 조치/해제를 위해 서비스 요청.","s":""},{"c":"(펌프 레이스웨이) 로터 중앙의 손나사가 풀림.","o":"","s":""},{"c":"펌프 고장.","o":"서비스 요청.","s":""},{"c":"로터 중앙의 손나사가 풀림.","o":"","s":"나사 확인. 필요 시 조치."},{"c":"펌프 고장.","o":"","s":"6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 치환액 2 펌프 기능 확인. 오작동이면 치환액 2 펌프 교체."}]},{"n":"치환액 저울 센서","d":"이 알람은 프라이밍 중에만 나타남.","c":[{"c":"치환액 백을 걸기 위해 치환액 저울 바 트레이를","o":"저울을 열림 위치로 했다가 닫힘 위치로","s":""},{"c":"당겨 빼냈다가 컨트롤 유닛으로 밀어 넣지","o":"둠. RETEST를 누름. 알람이 해제되지","s":""},{"c":"않았음.","o":"않으면 DISCONNECT로 치료 종료. 서비스 요청.","s":""},{"c":"저울 위치 센서 고장.","o":"DISCONNECT로 치료 종료. 서비스 요청.","s":""},{"c":"저울 센서 고장.","o":"","s":"6.5.3 \"Diagnose Screen – Scale Diagnose\"(224쪽)에서 저울 센서 기능 확인. 센서 테스트 실패 시 저울 교체."},{"c":"저울 위치 센서 고장.","o":"","s":"위 조치 참조."}]},{"n":"저울 영점 테스트","d":"하나 이상의 저울 영점 테스트 실패.","c":[{"c":"예상치 못한 백이 있음.","o":"저울에서 백을 제거. 저울을 닫고 RETEST를 누름.","s":""},{"c":"하나 이상의 저울에 운반 바가 없음.","o":"운반 바를 저울에 다시 올림. 저울을 닫고 RETEST를 누름.","s":""},{"c":"이물체가 저울에 닿아 있거나 저울 운반 바에","o":"저울에 닿는 것이 없고 저울 운반 바에","s":""},{"c":"매달려 있음.","o":"이물체가 없는지 확인. RETEST를 누름.","s":""},{"c":"하나 이상의 저울 고장.","o":"알람이 해제되지 않으면 장비를 끔. 서비스 요청.","s":""},{"c":"하나 이상의 저울 고장.","o":"","s":"6.5.3 \"Diagnose Screen – Scale Diagnose\"(224쪽)에서 저울 기능 확인. 필요 시 저울 교정 (6.6.3 \"Calibration Screen – Scales Calibration\", 247쪽). PRISMAFLEX 컨트롤 유닛을 다시 구동해 새 Prime 수행. 알람이 재발하면 저울 교체."}]},{"n":"저울","d":"알람 조건 지연 시간이 있음 (최대 …). 해당 저울은 알람 화면에 표시됨.","c":[{"c":"지정된 저울의 교정 이탈.","o":"RETEST를 누름. 알람이 해제되지 않으면 DISCONNECT로 치료 종료. 장비를 끄고 리턴 라인을 리턴 라인 클램프에서 빼낸 뒤 (해당 시) 혈액을 반환. 자세한 내용은 사용자 매뉴얼 \"Manual termination of treatment\" 참조.","s":""},{"c":"지정된 저울의 교정 이탈.","o":"","s":"저울 교정 (6.6.3 \"Calibration Screen – Scales Calibration\", 247쪽). 6.5.3 \"Diagnose Screen – Scale Diagnose\"(224쪽)에서 저울 기능 확인. 편차가 있으면 저울 교체."}]},{"n":"저울 회로 기판","d":"","c":[{"c":"저울 회로 기판 하드웨어 고장.","o":"DISCONNECT로 치료 종료. 서비스 요청.","s":""},{"c":"저울 회로 기판 하드웨어 고장.","o":"","s":"6.5.3 \"Diagnose Screen – Scale Diagnose\"(224쪽)에서 저울 기능 확인. 오작동이면 저울 교체."}]},{"n":"자가 테스트 실패","d":"가능한 원인과 사용자 조치는 (Prime Self-Test) 알람 참조. Code 1~7: 압력 포드/센서. Code 16: 리턴 압력 센서. Code 18: 혈액누출 감지기 임계값 오류. Code 24: 24 V / 12 V. Code 25: 리턴 클램프 센서. Code 26: 24 V 리턴 클램프 센서. Code 30: 사운드 점검. 경고! 치료 진행 중(Run Mode)에 배출 라인을 뺐다가 혈액누출 감지기에 다시 넣은 경우 반드시 혈액누출 감지기를 재정규화해야 함.","c":[]},{"n":"사운드 점검","d":"","c":[{"c":"PRISMAFLEX 컨트롤 유닛이 시작음을","o":"RETEST를 눌러 사운드 점검을 다시","s":""},{"c":"정상적으로 감지하지 못함.","o":"수행. 알람이 해제되지 않으면: ● 환자가 연결된 경우: DISCONNECT 버튼으로 치료 종료. 수동 종료로 혈액을 반환할 때는 공기 감지가 제공되지 않으므로 리턴 라인의 공기를 확인. ● 치료 모드가 아니었던 경우: 장비를 껐다 켬. 알람이 재발하면 장비를 다시 사용하기 전에 서비스에 수리를 요청.","s":""},{"c":"주변 소음이 너무 커서 시작음을","o":"주변 소음이 적을 때 다시","s":""},{"c":"감지하지 못함.","o":"RETEST를 누름.","s":""},{"c":"PRISMAFLEX 컨트롤 유닛이 시작음을","o":"","s":"전원 감시 보드의 스피커와 부저를"},{"c":"정상적으로 감지하지 못함.","o":"","s":"확인. 스피커와 부저가 모두 동작하면 전원 감시 보드의 마이크로폰이 고장 났을 수 있음. 테스트 중에는 캐비닛을 닫아야 함. 확인된 고장에 따라 부품 교체."}]},{"n":"시린지 미장착","d":"","c":[{"c":"시린지 테스트 수행 후 시린지가","o":"1. CHANGE SYRINGE를 누르고","s":""},{"c":"장착되지 않음.","o":"(1. CHANGE SYRINGE를 누르고) 안내에 따라 시린지를 장착한 뒤 알람 화면으로 돌아감. 2. RETEST를 눌러 시린지 테스트 재시작. 3. 실패가 반복되면 DISCONNECT를 누르고 서비스에 연락해 고장을 보고.","s":""},{"c":"시린지 펌프 고장.","o":"","s":"6.5.7 \"Diagnose Screen – Syringe Pump\"(230쪽)에서 시린지 펌프 기능 확인. 교정 수행 (6.6.6 \"Calibration Screen – Syringe Pump Calibration\", 251쪽). 오작동이면 시린지 펌프 교체."}]},{"n":"시린지 펌프","d":"코드: 1~9. Code 1: (보호·제어) 동작 모드 불일치 (알람 조건 지연 최대 15초). Code 2: 속도 오류. Code 3: 시린지 펌프가 역방향으로 움직임. Code 4: (시린지 펌프와) 펌웨어 간 구성 불일치. Code 5: 하부 센서 고장. Code 6: 로드 센서 최대값 (도달 불가). Code 7: 로드 센서 최소값 (도달 불가). Code 8: 예상하지 않은 시점에 시린지 펌프가 동작 (시린지 펌프와 컨트롤 유닛 간). Code 9: 예상 시점에 시린지 펌프가 동작하지 않음 — 막힘 또는 엔코더 신호 오류.","c":[{"c":"시린지 펌프 고장 (Systemic).","o":"OVERRIDE를 누름. 60초 후 시린지 펌프 테스트가 재시작됨. 알람이 재발하면 OVERRIDE 후 CHANGE SYR/LINE을 누름. 원하면 시린지 펌프 없이 계속 가능 — ANTICOAG SETTINGS를 누르고 시린지 펌프 주입을 \"Continuous, 0 mL/h\"로 설정, 새 설정 확인 후 알람 화면에서 OVERRIDE를 누름. 또는 치료를 종료하고 장비를 재시작 (PRISMAFLEX 사용자 매뉴얼 11장 \"Manual termination of treatment\" 참조). 알람이 재발하면 서비스 요청.","s":""},{"c":"시린지 펌프 고장 (Citrate - Calcium).","o":"OVERRIDE를 누름. 60초 후 시린지 펌프 테스트가 재시작됨. 알람이 재발하면 OVERRIDE 후 CHANGE SYR/LINE을 누름. 또는 치료를 종료하고 장비를 재시작 (PRISMAFLEX 사용자 매뉴얼 11장 \"Manual termination of treatment\" 참조). 알람이 재발하면 서비스 요청.","s":""},{"c":"시린지 펌프 고장.","o":"","s":"6.5.7 \"Diagnose Screen – Syringe Pump\"(230쪽)에서 시린지 펌프 기능 확인. 교정 수행 (6.6.6 \"Calibration Screen – Syringe Pump Calibration\", 251쪽). 오작동이면 시린지 펌프 교체."},{"c":"시린지 펌프 고장 (Code 4).","o":"","s":"펌웨어 오류 — 사용 중인 소프트웨어 버전에 맞는 시린지 펌웨어를 설치. 6.5.7 \"Diagnose Screen – Syringe Pump\"(230쪽) 참조."}]},{"n":"상부 핀치 밸브","d":"","c":[{"c":"막힘으로 인해 상부 핀치 밸브가 선택한 치료에","o":"막힘을 제거하고 RETEST를 누름.","s":""},{"c":"맞지 않는 위치에 있음.","o":"(막힘을 제거하고 RETEST를 누름.) 알람이 해제되지 않으면 DISCONNECT로 치료 종료. 서비스 요청.","s":""},{"c":"핀치 밸브 고장.","o":"DISCONNECT로 치료 종료. 서비스 요청.","s":""},{"c":"상부 핀치 밸브 고장.","o":"","s":"6.5.8 \"Diagnose Screen – Clamp and Pinch Valves\"(232쪽)에서 하부 핀치 밸브 기능 확인. 오작동이면 하부 핀치 밸브 교체."}]},{"n":"전압 범위 이탈","d":"","c":[{"c":"장비 전원 공급 장치 또는 전원 케이블 관련","o":"장비를 끄고 리턴 라인을 리턴","s":""},{"c":"내부 오작동.","o":"라인 클램프에서 빼낸 뒤 (해당 시) 혈액을 반환.","s":""},{"c":"PRISMAFLEX 컨트롤 유닛 전원 공급 장치 또는","o":"","s":"전원 공급 점검 수행 (6.3.7"},{"c":"전원 케이블 관련 내부","o":"","s":"\"Power Supply Check\", 218쪽)."},{"c":"오작동.","o":"","s":"편차가 있으면 전원 공급 장치 교체. 6.5.2 \"Diagnose Screen – Pumps Diagnose\"(222쪽)에서 혈액펌프 기능 확인. 오작동이면 혈액펌프 교체."}]}];
var CF='all',SQ='',OS={};
ALARMS.forEach(function(a,i){a._ko=ALARMS_KO[i];});
var CAT_KO={Warning:'경고',Caution:'주의',Advisory:'권고',Malfunction:'오작동'};
var I18N={
  en:{title:'Prismaflex Alarm Search',ph:'Alarm name, cause, action...',try:'Try',fCat:'Category',all:'All',
    cWarning:'Warning',cCaution:'Caution',cAdvisory:'Advisory',cMalfunction:'Malfunction',
    sbarAlarms:' alarms',emptyH:'No alarms found',emptyP:'Try different search terms or reset the filter.',

  ko:{title:'Prismaflex 알람 검색',ph:'알람 이름·원인·조치 검색 (한글 가능)...',try:'예시',fCat:'분류',all:'전체',
    cWarning:'경고',cCaution:'주의',cAdvisory:'권고',cMalfunction:'오작동',
    sbarAlarms:'개 알람',emptyH:'검색 결과 없음',emptyP:'다른 검색어를 입력하거나 필터를 초기화하세요.',
    lDesc:'설명',lCA:'원인 및 조치',lOp:'사용자 조치',lSv:'서비스 기술자 조치',

};
var LANG='en';
try{if(localStorage.getItem('pfx_lang')==='ko')LANG='ko';}catch(e){}
function t(k){return I18N[LANG][k];}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});
  document.getElementById('sInp').placeholder=t('ph');
  document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  var n=document.getElementById('koNote');n.textContent=t('koNote');n.style.display=LANG==='ko'?'block':'none';
}
function setLang(l){
  if(l===LANG)return;LANG=l;
  try{localStorage.setItem('pfx_lang',l);}catch(e){}
  applyLang();
  var keep=OS;go();OS=keep;
  Object.keys(keep).forEach(function(k){var i=k.slice(k.lastIndexOf('_')+1);var d=document.getElementById('d'+i),c=document.getElementById('c'+i);
    if(d)d.classList.add('open');if(c){var cv=c.querySelector('.chev');if(cv)cv.classList.add('open');}});
}

function eh(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function hl(t,ws){
  var s=eh(t);if(!ws||!ws.length)return s;
  for(var i=0;i<ws.length;i++){var w=ws[i];if(!w)continue;
    var re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    s=s.replace(re,'<mark>$1</mark>');}
  return s;
}
function mkCauses(causes,ws){
  if(!causes||!causes.length)return '';
  var html='<div class="cause-table">';
  for(var i=0;i<causes.length;i++){
    var c=causes[i];
    if(!c.cause&&!c.operator_action&&!c.service_action)continue;
    html+='<div class="cause-row">';
    if(c.cause){html+='<div class="cause-hdr">'+hl(c.cause,ws)+'</div>';}
    html+='<div class="cause-actions">';
    if(c.operator_action){
      html+='<div class="action-row">';
      html+='<div class="action-lbl op">'+t('lOp')+'</div>';
      html+='<div class="action-txt">'+hl(c.operator_action,ws)+'</div>';
      html+='</div>';
    }
    if(c.service_action){
      html+='<div class="action-row">';
      html+='<div class="action-lbl svc">'+t('lSv')+'</div>';
      html+='<div class="action-txt">'+hl(c.service_action,ws)+'</div>';
      html+='</div>';
    }
    html+='</div></div>';
  }
  html+='</div>';
  return html;
}
function mkDetail(a,ws){
  var k=LANG==='ko'?a._ko:null;
  if(k)a={description:k.d,causes:k.c.map(function(c){return {cause:c.c,operator_action:c.o,service_action:c.s};})};
  var h='';
  if(a.description){
    h+='<div class="dsec"><div class="dlbl"><span class="darr">&gt;&gt;</span>'+t('lDesc')+'</div>';
    h+='<div class="dbox">'+hl(a.description,ws)+'</div></div>';
  }
  if(a.causes&&a.causes.length){
    h+='<div class="dsec"><div class="dlbl"><span class="darr">&gt;&gt;</span>'+t('lCA')+'</div>';
    h+=mkCauses(a.causes,ws);
    h+='</div>';
  }
  return h;
}
function render(list){
  var ws=SQ?SQ.trim().toLowerCase().split(/\s+/):[];
  var el=document.getElementById('cardsEl');
  var em=document.getElementById('emptyEl');
  document.getElementById('mCnt').textContent=list.length;
  document.getElementById('totalBadge').textContent=list.length;
  var ql=document.getElementById('qLabel');
  if(SQ){ql.textContent='"'+SQ+'"';ql.style.display='';}else{ql.textContent='';}
  if(!list.length){el.innerHTML='';em.style.display='block';return;}
  em.style.display='none';
  var html='';
  for(var i=0;i<list.length;i++){
    var a=list[i];
    var isOpen=!!OS[a.id+'_'+i];
    html+='<div class="card" id="c'+i+'">';
    html+='<div class="chead" onclick="tog('+i+','+a.id+')">';
    html+='<span class="catbadge cat-'+eh(a.category)+'">'+eh(LANG==='ko'&&CAT_KO[a.category]?CAT_KO[a.category]:a.category)+'</span>';
    html+='<div class="cbody">';
    html+='<div class="ctitle">'+hl(a.name,ws)+'</div>';
    if(LANG==='ko'&&a._ko&&a._ko.n&&a._ko.n!==a.name)html+='<div class="ctitle-ko">'+hl(a._ko.n,ws)+'</div>';
    var nc=a.causes?a.causes.length:0;
    html+='<div class="cmeta"><span style="font-size:10px;color:var(--text3);">'+(LANG==='ko'?'원인 '+nc+'개':nc+' cause'+(nc===1?'':'s'))+'</span></div>';
    html+='</div>';
    html+='<div class="chev'+(isOpen?' open':'')+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></div>';
    html+='</div>';
    html+='<div class="cdet'+(isOpen?' open':'')+'" id="d'+i+'">';
    html+='<div class="cdet-in">'+mkDetail(a,ws)+'</div>';
    html+='</div></div>';
  }
  el.innerHTML=html;
}
function tog(i,id){
  var key=id+'_'+i;
  var d=document.getElementById('d'+i);
  var c=document.getElementById('c'+i);
  if(!d||!c)return;
  var cv=c.querySelector('.chev');
  if(OS[key]){delete OS[key];d.classList.remove('open');if(cv)cv.classList.remove('open');}
  else{OS[key]=1;d.classList.add('open');if(cv)cv.classList.add('open');}
}
function go(){
  var ws=SQ?SQ.trim().toLowerCase().split(/\s+/):[];
  var list=ALARMS.slice();
  if(CF!=='all')list=list.filter(function(a){return a.category===CF;});
  if(ws.length)list=list.filter(function(a){
    var h=[a.name||'',a.description||'',
      (a.causes||[]).map(function(c){return (c.cause||'')+' '+(c.operator_action||'')+' '+(c.service_action||'');}
      ).join(' '),
      a._ko?[a._ko.n,a._ko.d,a._ko.c.map(function(c){return c.c+' '+c.o+' '+c.s;}).join(' ')].join(' '):''
    ].join(' ').toLowerCase();
    return ws.every(function(w){return h.indexOf(w)>=0;});
  });
  OS={};render(list);
}
var sInp=document.getElementById('sInp');
var sClr=document.getElementById('sClr');
sInp.addEventListener('input',function(){SQ=sInp.value;sClr.className=SQ.length?'s-clr show':'s-clr';go();});
