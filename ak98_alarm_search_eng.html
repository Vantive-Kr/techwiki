<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AK98 Error Code Search · Vantive</title>
<style>
:root{--plum:#72256B;--plum-d:#58184F;--sage:#CDDFD7;--bg:#F6F0EA;--plum-light:rgba(114,37,107,0.09);
--cream:#FFFAEB;--pine:#105742;--pine-light:rgba(16,87,66,0.10);
--euca:#6CA07A;--euca-light:rgba(108,160,122,0.12);
--amber:#986A24;--amber-light:rgba(176,125,46,0.12);
--danger:#AE4048;--danger-light:rgba(174,64,72,0.10);
--blue:#1A6FA8;--blue-light:rgba(26,111,168,0.10);
--white:#FFFFFF;--text:#1B1219;--text2:#6B5468;--text3:#9B879A;
--border:rgba(114,37,107,0.12);--border-p:rgba(114,37,107,0.14);
--shadow:0 2px 14px rgba(0,0,0,0.06);--r:14px;--r-xs:5px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;}
.hdr{background:linear-gradient(90deg,#58184F 0%,#72256B 26%,#105742 62%,#6CA07A 100%);
border-bottom:1px solid rgba(255,255,255,0.15);box-shadow:0 2px 16px rgba(88,24,79,0.25);
padding:16px 18px 0;position:sticky;top:0;z-index:200;overflow:hidden;}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;position:relative;z-index:2;}
.wmark-wrap{display:flex;flex-direction:column;gap:4px;}
.wmark-img{height:26px;width:auto;max-width:100px;display:block;}
.tagline{font-size:12px;font-weight:700;color:rgba(255,250,235,0.55);letter-spacing:1.8px;text-transform:uppercase;}
.total-badge{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.32);
color:#fff;font-size:11px;font-weight:700;padding:5px 13px;border-radius:20px;flex-shrink:0;margin-top:2px;}
.s-wrap{position:relative;margin-bottom:10px;z-index:2;}
.s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;}
.s-inp{width:100%;padding:12px 42px 12px 44px;background:rgba(255,250,235,0.13);
border:1.5px solid rgba(255,250,235,0.22);border-radius:12px;font-size:14px;color:var(--cream);
outline:none;font-family:inherit;transition:background .18s,border-color .18s;}
.s-inp:focus{background:rgba(255,250,235,0.22);border-color:rgba(255,250,235,0.45);}
.s-inp::placeholder{color:rgba(255,250,235,0.62);}
.s-clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);
background:rgba(255,250,235,0.22);border:none;border-radius:50%;
width:22px;height:22px;font-size:12px;cursor:pointer;color:var(--cream);
font-weight:700;display:none;line-height:22px;text-align:center;}
.s-clr.show{display:block;}
.s-hint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:12px;
font-size:11px;color:rgba(255,250,235,0.58);position:relative;z-index:2;}
.h-arr{color:rgba(255,250,235,0.75);font-weight:800;letter-spacing:-1px;}
.h-ex{background:rgba(255,250,235,0.14);border:1px solid rgba(255,250,235,0.18);
color:rgba(255,250,235,0.9);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;}
.filt{background:var(--bg);padding:12px 18px;border-bottom:1px solid var(--border);}
.flbl{font-size:9.5px;font-weight:800;color:var(--pine);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:7px;}
.seg-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.seg-row::-webkit-scrollbar{display:none;}
.seg{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;
cursor:pointer;user-select:none;white-space:nowrap;background:rgba(114,37,107,0.06);color:var(--text2);
border:1.5px solid transparent;transition:all .15s ease;font-family:inherit;display:inline-flex;align-items:center;}
.seg.on{background:var(--plum);color:#fff;border-color:var(--plum);}
.seg:active{transform:scale(0.95);}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;flex-shrink:0;}
.frow{margin-bottom:10px;}.frow:last-child{margin-bottom:0;}
.sbar{padding:8px 18px 6px;font-size:12px;color:var(--text2);background:var(--bg);}
.sbar b{color:var(--plum);font-weight:700;}
.cards{padding:8px 14px 32px;display:flex;flex-direction:column;gap:9px;}
.card{background:var(--white);border-radius:var(--r);box-shadow:0 2px 14px rgba(0,0,0,0.06);
border:1px solid var(--border);overflow:hidden;}
.chead{display:flex;align-items:flex-start;gap:10px;padding:13px 13px 11px;cursor:pointer;}
/* Code badge — monospace, full 13-char code */
.abadge{display:inline-flex;align-items:center;justify-content:center;
padding:3px 8px;border-radius:var(--r-xs);font-size:10.5px;font-weight:700;
white-space:nowrap;flex-shrink:0;margin-top:2px;font-family:"Courier New",monospace;
letter-spacing:0.5px;}
.a-prot{background:var(--danger-light);color:var(--danger);border:1px solid rgba(174,64,72,0.22);}
.a-ctrl{background:var(--blue-light);color:var(--blue);border:1px solid rgba(26,111,168,0.22);}
.a-io{background:var(--amber-light);color:var(--amber);border:1px solid rgba(176,125,46,0.22);}
.a-ui{background:var(--pine-light);color:var(--pine);border:1px solid rgba(16,87,66,0.2);}
.pbadge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;}
.p-high{background:var(--danger-light);color:var(--danger);}
.p-medium{background:var(--amber-light);color:var(--amber);}
.p-low{background:rgba(0,0,0,0.05);color:var(--text3);}
.p-info{background:var(--euca-light);color:var(--pine);}
.cbadge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.c-unconditional_stop{background:var(--danger-light);color:var(--danger);}
.c-unconditional_alarm{background:var(--amber-light);color:var(--amber);}
.c-conditional{background:rgba(0,0,0,0.05);color:var(--text2);}
.c-restart{background:var(--blue-light);color:var(--blue);}
.c-notification{background:var(--pine-light);color:var(--pine);}
.c-other{background:rgba(0,0,0,0.04);color:var(--text3);}
.cbody{flex:1;min-width:0;}
.ctitle{font-size:13px;font-weight:700;line-height:1.45;margin-bottom:6px;color:var(--text);}
.cmeta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.cnode{font-size:10px;color:var(--text3);font-weight:500;padding:2px 6px;
background:rgba(0,0,0,0.04);border-radius:4px;}
.chev{color:var(--text3);flex-shrink:0;margin-top:2px;width:22px;height:22px;
display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,0.04);border-radius:50%;transition:transform .25s ease,background .15s,color .15s;}
.chev.open{transform:rotate(180deg);background:var(--plum-light);color:var(--plum);}
.cdet{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1);}
.cdet.open{max-height:2200px;border-top:1px solid var(--border);}
.cdet-in{padding:15px 13px 18px;background:rgba(255,250,235,0.5);}
.mres{font-size:12.5px;font-style:italic;color:var(--text2);
background:rgba(0,0,0,0.04);border-radius:8px;padding:8px 11px;margin-bottom:13px;
border-left:3px solid var(--plum);line-height:1.6;}
.dsec{margin-bottom:13px;}.dsec:last-child{margin-bottom:0;}
.dlbl{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;color:var(--pine);
text-transform:uppercase;letter-spacing:1.2px;margin-bottom:7px;}
.darr{color:var(--plum);font-weight:900;font-size:10px;letter-spacing:-1px;}
.dbox,.tbox,.ebox{font-size:13.5px;line-height:1.75;border-radius:10px;padding:11px 13px;}
.dbox{color:var(--text);background:var(--white);border:1px solid var(--border);}
.tbox{color:#1a3a6b;background:var(--blue-light);border:1px solid rgba(26,111,168,0.2);}
.ebox{color:#6E4A12;background:var(--amber-light);border:1px solid rgba(176,125,46,0.22);}
.dbox ul,.tbox ul,.ebox ul{list-style:none;padding:0;}
.dbox li,.tbox li,.ebox li{padding:2px 0 2px 14px;position:relative;}
.dbox li::before,.tbox li::before,.ebox li::before{content:"·";position:absolute;left:4px;color:var(--text3);}
mark{background:rgba(114,37,107,0.13);color:var(--plum);border-radius:2px;padding:0 1px;}
.empty{text-align:center;padding:60px 24px;color:var(--text2);display:none;}
.empty-ico{font-size:46px;margin-bottom:12px;opacity:.4;}
.empty h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.empty p{font-size:13px;}
/* -- Language toggle (EN / 한글) -- */
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.lang-sw{display:inline-flex;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.32);border-radius:20px;padding:2px;}
.lang-btn{border:none;background:none;color:rgba(255,255,255,0.95);font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:16px;cursor:pointer;line-height:1;}
.lang-btn.on{background:var(--cream);color:var(--plum);}
.ctitle-ko{font-size:12.5px;font-weight:600;color:var(--text2);margin:-3px 0 6px;line-height:1.4;}
.ko-note{font-size:11px;color:var(--text3);margin:4px 0 0;line-height:1.5;}
</style>
</head>

ystem differs to much to value from the taration constant measured in function check."], "technical_description": ["The taration constant for the first taration in a treatment is checked agansted the taration constant in function check. If the difference is too large which could indicata a fluid path problem. The test has failed."], "explanations": ["Protective UF sensors broken or dirty.", "There is air passing the protective UF sensors.", "Leakage through: RIVA, DIVA or TAVA."]}, {"code": "0118 020 013 XXX", "name": "LEAKAGE/CONTAMINATION DETECTED DURING PROTECTIVE TARATION", "node": "Protective", "category": "protective", "error_type": "unconditional_stop", "priority": "high", "machine_response": "Unconditional error, fluid path (DIVA/TAVA) is stopped. The blood pump can still be used.", "general_description": ["Taration constant for protective system differs to much to value from the one at the start of treatment."], "technical_description": ["The taration constant for the first taration in a treatment plays the role of a reference value. Therefore any new taration constant measurement is followed by a comparison with the constant from first taration in treatment. This test has failed."], "explanations": ["Protective UF sensors broken or dirty.", "There is air passing the protective UF sensors.", "Leakage through: RIVA, DIVA or TAVA."]}, {"code": "0118 020 014 XXX", "name": "FLOW OUT OF RANGE DURING PROTECTIVE TARATION", "node": "Protective", "category": "protective", "error_type": "unconditional_stop", "priority": "high", "machine_response": "Unconditional error, fluid path (DIVA/TAVA) is stopped. The blood pump can still be used.", "general_description": ["At least one of the UF protective flow meters have recorded a value of the main flow outside the allowed range [300,700] ml/min."], "technical_description": ["The protective UF flow meters have a limited measurement flow range, within which the system should always operate. One or two meters show flow meter ":[]},{"n":"BPM 소프트웨어 오류","m":"무음으로 기록되며 치료를 막지 않는 조건부 오류. 최근 30일 동안 같은 오류가 3회 이상 발생하면 무조건 오류로 처리되어 투석액·혈액 경로가 정지되고 혈액펌프를 구동할 수 없음.","g":["한계값 수신 전에 BPM 측정값이 수신됨."],"t":["소프트웨어 오류."],"e":[]},{"n":"장비 과열","m":"무조건 오류 — 투석액·혈액 경로가 정지되고 혈액펌프를 구동할 수 없음.","g":["장비가 너무 뜨거움. (해당 시) 환자를 분리하고 즉시 장비를 끌 것."],"t":[],"e":[]},{"n":"처방 설정 오류 - 재시작 후 처방 없이 계속 진행 시도","m":"무음으로 기록되며 치료를 막지 않는 조건부 오류. 최근 30일 동안 같은 오류가 3회 이상 발생하면 무조건 오류로 처리되어 투석액·혈액 경로가 정지되고 혈액펌프를 구동할 수 없음.","g":["편집이 잠긴 상태에서 처방 설정을 시도함."],"t":["잠금 해제되지 않은 상태에서 UI 요청."],"e":[]},{"n":"UFS 소프트웨어 오류","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["일시적 오류. 자세한 정보는 Gambro SW 개발자용으로 로그에 기록됨."],"t":[],"e":[]},{"n":"UF 감시 센서 전원 미공급","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["보호 시스템이 보호 UF 센서 전원을 켜도록 요청했으나 전원 상태가 꺼짐으로 보고됨."],"t":[],"e":["24 V 전원 공급 장치 오작동.","Power IO C 고장/내부 소프트웨어 고장."]},{"n":"UF 감시 센서 없음","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["UF 감시 기능이 보호 UF 센서 하나 또는 둘 다를 감지하지 못함. 누락된 센서 정보는 이 오류 코드의 추가 정보에 표시됨 (예: \"No 1\" = 보호 UF 센서 1 누락)."],"t":["GIOP가 I2C 버스로 UFS 센서 옵토 보드 EE 메모리에 접근할 수 없다고 보고함."],"e":["보호 UF 센서 하나 또는 둘 다 분리됨.","보호 UF 센서 하나 또는 둘 다, 또는 연결 케이블 파손."]},{"n":"UF 감시 24 V 전압 이상","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["UF 감시 유량계는 24 V로 구동됨. 공급 전원이 24 V가 아니면 측정이 부정확할 수 있어 이 오류 코드가 발생함."],"t":["GIOP가 24 V 공급 전압이 사양을 벗어났다고 보고함."],"e":["24 V 전원 공급 장치 오작동.","Power IO C 고장/내부 소프트웨어 고장.","UFS 센서/센서 케이블 단락.","General IOP 전압 감시 회로 고장."]},{"n":"감시 통신 오류","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["보호·제어 UF 유량 데이터가 예상 갱신 주기로 갱신되지 않거나 접근할 수 없음."],"t":["보호·제어 UF 유량 데이터는 CAN 버스로 보호 시스템에 전달됨. 값이 제때 갱신되지 않으면 보호 UF 감시의 입력 데이터가 유효하지 않게 되고, 결과적으로 UF 감시 추정값도 무효가 됨."],"e":["CAN 버스 고장.","Power IO C 고장/내부 소프트웨어 고장.","UF 셀 고장/내부 소프트웨어 고장.","보호 UF 센서 오작동.","Protective 내부 소프트웨어 고장."]},{"n":"보호 태레이션 중 누설/오염 감지","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["자기 교정(태레이션)을 수행했으나 태레이션 상수 비교에 실패함. 태레이션 상수가 이전 상수와 너무 크게 차이 남."],"t":["태레이션 종료 시 새 태레이션 상수를 측정·계산할 때마다 이전 값과 비교함. 연속 측정된 태레이션 상수의 편차가 임계값을 넘으면 안 되는데, 이 테스트가 실패함."],"e":["보호 UF 센서 파손 또는 오염.","보호 UF 센서를 통해 공기가 지나감.","RIVA, DIVA 또는 TAVA를 통한 누설."]},{"n":"보호 태레이션 중 누설/오염 감지","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["치료 시스템의 첫 태레이션 상수가 기능 점검에서 측정한 태레이션 상수와 너무 크게 차이 남."],"t":["치료 중 첫 태레이션 상수를 기능 점검의 태레이션 상수와 비교함. 차이가 너무 크면 투석액 경로 문제일 수 있음. 이 테스트가 실패함."],"e":["보호 UF 센서 파손 또는 오염.","보호 UF 센서를 통해 공기가 지나감.","RIVA, DIVA 또는 TAVA를 통한 누설."]},{"n":"보호 태레이션 중 누설/오염 감지","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["보호 시스템의 태레이션 상수가 치료 시작 시 값과 너무 크게 차이 남."],"t":["치료 중 첫 태레이션 상수는 기준값 역할을 함. 따라서 새 태레이션 상수를 측정할 때마다 치료 중 첫 태레이션 상수와 비교하는데, 이 테스트가 실패함."],"e":["보호 UF 센서 파손 또는 오염.","보호 UF 센서를 통해 공기가 지나감.","RIVA, DIVA 또는 TAVA를 통한 누설."]},{"n":"보호 태레이션 중 유량 범위 이탈","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["UF 보호 유량계 중 하나 이상이 허용 범위 [300, 700] ml/min를 벗어난 주 유량 값을 기록함."],"t":["보호 UF 유량계는 측정 유량 범위가 제한되어 있어 시스템은 항상 이 범위 안에서 동작해야 함. 유량계 하나 또는 둘이 이 범위를 벗어난 값을 표시함."],"e":["압력 레귤레이터 미교정 또는 파손.","유량 제한기(flow restrictor) 오염.","출구 제한기(outlet restrictor) 오염.","유량 펌프 오염 또는 파손.","흡입 펌프 오염 또는 파손.","탈기 압력 트랜스듀서 파손 또는 미교정.","RIVA 누설.","보호 UF 센서 파손.","제어 UF 셀 파손."]},{"n":"보호 태레이션 중 유량 불안정","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["보호 UF 자기 교정(태레이션)을 수행했으나 측정된 차등 유량(UF 속도) 신호가 너무 크게 변동해 실패함. 첫 시도에 이은 재교정도 같은 이유로 실패함. 태레이션 측정 중 보호 UF 속도의 표준편차가 너무 높음."],"t":["태레이션 중 UF 속도 표준편차가 요구 범위를 벗어남."],"e":["보호 UF 센서를 통해 공기가 지나감.","급수에 공기가 너무 많음.","밸브: RIVA, DIVA 또는 TAVA 누설.","보호 UF 센서: 센서 오염.","보호 UF 센서: 센서 파손.","유량 제한기: 제한기 오염.","유량 펌프: 펌프가 정상 동작하지 않음.","탈기 챔버: 챔버 상단 O-링이 제 위치에 있지 않아 액이 누설됨.","탈기 압력 트랜스듀서: 정상 동작하지 않음.","제어 UF 셀 파손 — 투석액 조절에 불안정한 유량 데이터를 공급함."]},{"n":"보호 태레이션 중 예기치 않은 오류","m":"무조건 오류 — 투석액 경로(DIVA/TAVA)가 정지됨. 혈액펌프는 계속 사용 가능.","g":["보호 UF 자기 교정(태레이션)을 수행했으나 예기치 않은 오류로 실패함. 첫 시도에 이은 재교정도 같은 이유로 실패함."],"t":["새 태레이션 오프셋 상수를 계산할 수 없음.","태레이션 절차에서 발생해서는 안 되는 예기치 않은 오류가 발생함.","tara_UFS.c의 ta_StopTaration() 함수가 4 또는 7을 반환함.","태   document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});
  document.getElementById('sInp').placeholder=t('ph');
  document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-lang')===LANG);});
  var n=document.getElementById('koNote');n.textContent=t('koNote');n.style.display=LANG==='ko'?'block':'none';
}
function setLang(l){
  if(l===LANG)return;LANG=l;
  try{localStorage.setItem('ak98_lang',l);}catch(e){}
  applyLang();
  var keep=OS;go();OS=keep;
  Object.keys(keep).forEach(function(k){var i=k.slice(k.lastIndexOf('_')+1);var d=document.getElementById('d'+i),c=document.getElementById('c'+i);
    if(d)d.classList.add('open');if(c){var cv=c.querySelector('.chev');if(cv)cv.classList.add('open');}});
}
var BADGE_CLASS={protective:'a-prot',io_board:'a-io',control:'a-ctrl',ui:'a-ui'};

function eh(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function hl(t,ws){
  var s=eh(t);if(!ws||!ws.length)return s;
  for(var i=0;i<ws.length;i++){var w=ws[i];if(!w)continue;
    var re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    s=s.replace(re,'<mark>$1</mark>');}
  return s;
}
function mkList(arr,ws,cls){
  if(!arr||!arr.length)return '';
  if(arr.length===1)return '<div class="'+cls+'">'+hl(arr[0],ws)+'</div>';
  var li='';for(var i=0;i<arr.length;i++)li+='<li>'+hl(arr[i],ws)+'</li>';
  return '<div class="'+cls+'"><ul>'+li+'</ul></div>';
}
function mkDetail(a,ws){
  var k=LANG==='ko'?a._ko:null;
  if(k)a={machine_response:k.m,general_description:k.g,technical_description:k.t,explanations:k.e};
  var h='';
  if(a.machine_response){
    h+='<div class="mres">'+hl(a.machine_response,ws)+'</div>';
  }
  if(a.general_description&&a.general_description.length){
    h+='<div class="dsec"><div class="dlbl"><span class="darr">&gt;&gt;</span>'+t('lGen')+'</div>'+mkList(a.general_description,ws,'dbox')+'</div>';
  }
  if(a.technical_description&&a.technical_description.length){
    h+='<div class="dsec"><div class="dlbl"><span class="darr">&gt;&gt;</span>'+t('lTech')+'</div>'+mkList(a.technical_description,ws,'tbox')+'</div>';
  }
  if(a.explanations&&a.explanations.length){
    h+='<div class="dsec"><div class="dlbl"><span class="darr">&gt;&gt;</span>'+t('lExp')+'</div>'+mkList(a.explanations,ws,'ebox')+'</div>';
  }
  return h||'<div style="color:var(--text3);font-size:13px;padding:4px 0;">'+t('noDetail')+'</div>';
}
function render(list){
  var ws=SQ?SQ.trim().toLowerCase().split(/\s+/):[];
  var el=document.getElementById('cardsEl');
  var em=document.getElementById('emptyEl');
  document.getElementById('mCnt').textContent=list.length;
  document.getElementById('totalBadge').textContent=list.length;
  if(!list.length){el.innerHTML='';em.style.display='block';return;}
  em.style.display='none';
  var html='';
  for(var i=0;i<list.length;i++){
    var a=list[i];
    var isOpen=!!OS[a.code+'_'+i];
    var bc=BADGE_CLASS[a.category]||'a-io';
    var oc='onclick="tog('+i+',&#39;'+eh(a.code)+'&#39;)"';
    html+='<div class="card" id="c'+i+'">';
    html+='<div class="chead" '+oc+'>';
    html+='<span class="abadge '+bc+'">'+hl(a.code,ws)+'</span>';
    html+='<div class="cbody">';
    html+='<div class="ctitle">'+hl(a.name,ws)+'</div>';
    if(LANG==='ko'&&a._ko&&a._ko.n&&a._ko.n!==a.name)html+='<div class="ctitle-ko">'+hl(a._ko.n,ws)+'</div>';
    html+='<div class="cmeta">';
    html+='<span class="cbadge c-'+a.error_type+'">'+(ET_LABEL[a.error_type]||eh(a.error_type))+'</span> ';
    html+='<span class="pbadge p-'+a.priority+'">'+(PK[a.priority]||eh(a.priority))+'</span> ';
    html+='<span class="cnode">'+eh(a.node)+'</span>';
    html+='</div></div>';
    html+='<div class="chev'+(isOpen?' open':'')+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></div>';
    html+='</div>';
    html+='<div class="cdet'+(isOpen?' open':'')+'" id="d'+i+'">';
    html+='<div class="cdet-in">'+mkDetail(a,ws)+'</div>';
    html+='</div></div>';
  }
  el.innerHTML=html;
}
function tog(i,code){
  var key=code+'_'+i;
  var d=document.getElementById('d'+i);
  var c=document.getElementById('c'+i);
  if(!d||!c)return;
  var cv=c.querySelector('.chev');
  if(OS[key]){delete OS[key];d.classList.remove('open');if(cv)cv.classList.remove('open');}
  else{OS[key]=1;d.classList.add('open');if(cv)cv.classList.add('open');}
}
function go(){
  var ws=SQ?SQ.trim().toLowerCase().split(/\s+/):[];
  var list=ALARMS.slice();
  if(CF!=='all')list=list.filter(function(a){return a.category===CF;});
  if(PF!=='all')list=list.filter(function(a){return a.priority===PF;});
  if(ws.length)list=list.filter(function(a){
    var h=[a.code||'',a.name||'',a.node||'',a.machine_response||'',
      (a.general_description||[]).join(' '),
      (a.technical_description||[]).join(' '),
      (a.explanations||[]).join(' '),
      a._ko?[a._ko.n,a._ko.m,a._ko.g.join(' '),a._ko.t.join(' '),a._ko.e.join(' ')].join(' '):''
    ].join(' ').toLowerCase();
    return ws.every(function(w){return h.indexOf(w)>=0;});
  });
  OS={};render(list);
}
var sInp=document.getElementById('sInp');
var sClr=document.getElementById('sClr');
sInp.addEventListener('input',function(){SQ=sInp.value;sClr.className=SQ.length?'s-clr show':'s-clr';go();});
sClr.addEventListener('click',function(){sInp.value='';SQ='';sClr.className='s-clr';go();});
document.getElementById('catRow').addEventListener('click',function(e){
  var b=e.target;while(b&&!b.classList.contains('seg'))b=b.parentElement;
  if(!b)return;
  document.querySelectorAll('#catRow .seg').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on');CF=b.getAttribute('data-v');go();
});
document.getElementById('prioRow').addEventListener('click',function(e){
  var b=e.target;while(b&&!b.classList.contains('seg'))b=b.parentElement;
  if(!b)return;
  document.querySelectorAll('#prioRow .seg').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on');PF=b.getAttribute('data-v');go();
});
applyLang();
go();

</script>
</body>
</html>
