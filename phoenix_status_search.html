<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<script src="tw-guard.js" data-scope="staff"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PHOENIX Status Screen · Vantive</title>
<style>
:root{
  --nav-h:64px;
  --plum:#72256B;--plum-d:#5C1B56;--plum-light:rgba(114,37,107,0.09);
  --cream:#FFFAEB;
  --pine:#105742;--pine-light:rgba(16,87,66,0.10);
  --euca:#6CA07A;--euca-light:rgba(108,160,122,0.12);
  --amber:#D4700A;--amber-light:rgba(212,112,10,0.10);
  --teal:#0D7377;--teal-light:rgba(13,115,119,0.10);
  --blue:#1A5276;--blue-light:rgba(26,82,118,0.10);
  --rose:#A93226;--rose-light:rgba(169,50,38,0.10);
  --slate:#5D6D7E;--slate-light:rgba(93,109,126,0.10);
  --indigo:#5B2C8D;--indigo-light:rgba(91,44,141,0.10);
  --danger:#C0392B;--danger-light:rgba(192,57,43,0.10);
  --white:#FFFFFF;--text:#1C1C1E;--text2:#52525B;--text3:#A1A1AA;
  --border:rgba(0,0,0,0.07);--border-p:rgba(114,37,107,0.14);
  --shadow:0 2px 14px rgba(0,0,0,0.06);--r:14px;--r-xs:5px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--cream);color:var(--text);font-size:14px;min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + max(env(safe-area-inset-bottom,0px),10px));}

/* ── Header ── */
.hdr{background:linear-gradient(150deg,var(--plum-d) 0%,var(--plum) 60%,#8B3080 100%);
  padding:calc(16px + env(safe-area-inset-top,0px)) 18px 0;
  position:sticky;top:0;z-index:200;overflow:hidden;}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;position:relative;z-index:2;}
.wmark-wrap{display:flex;flex-direction:column;gap:4px;}
.tagline{font-size:13.5px;font-weight:700;color:rgba(255,250,235,0.55);letter-spacing:1.8px;text-transform:uppercase;}
.total-badge{background:rgba(255,250,235,0.18);border:1px solid rgba(255,250,235,0.25);
  color:var(--cream);font-size:11px;font-weight:700;padding:5px 13px;border-radius:20px;flex-shrink:0;margin-top:2px;}
.s-wrap{position:relative;margin-bottom:10px;z-index:2;}
.s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;}
.s-inp{width:100%;padding:12px 42px 12px 44px;background:rgba(255,250,235,0.13);
  border:1.5px solid rgba(255,250,235,0.22);border-radius:12px;font-size:14px;
  color:var(--cream);outline:none;font-family:inherit;transition:background .18s,border-color .18s;}
.s-inp:focus{background:rgba(255,250,235,0.22);border-color:rgba(255,250,235,0.45);}
.s-inp::placeholder{color:rgba(255,250,235,0.45);}
.s-clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:rgba(255,250,235,0.22);border:none;border-radius:50%;
  width:22px;height:22px;font-size:12px;cursor:pointer;color:var(--cream);
  font-weight:700;display:none;line-height:22px;text-align:center;}
.s-clr.show{display:block;}
.s-hint{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:12px;
  font-size:11px;color:rgba(255,250,235,0.58);position:relative;z-index:2;}
.h-ex{background:rgba(255,250,235,0.14);border:1px solid rgba(255,250,235,0.18);
  color:rgba(255,250,235,0.9);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;}

/* ── Filters ── */
.filt{background:var(--cream);padding:12px 18px;border-bottom:1px solid var(--border);}
.flbl{font-size:9.5px;font-weight:800;color:var(--pine);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:7px;}
.seg-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.seg-row::-webkit-scrollbar{display:none;}
.seg{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;
  cursor:pointer;user-select:none;white-space:nowrap;background:rgba(0,0,0,0.05);color:var(--text2);
  border:1.5px solid transparent;transition:all .15s ease;font-family:inherit;display:inline-flex;align-items:center;}
.seg.on{background:var(--plum);color:var(--cream);border-color:var(--plum);}
.seg:active{transform:scale(0.95);}
.sdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;flex-shrink:0;}
.frow{margin-bottom:10px;}.frow:last-child{margin-bottom:0;}

/* ── Status bar ── */
.sbar{padding:8px 18px 6px;font-size:12px;color:var(--text2);background:var(--cream);}
.sbar b{color:var(--plum);font-weight:700;}

/* ── Cards ── */
.cards{padding:8px 14px 32px;display:flex;flex-direction:column;gap:9px;}
.card{background:var(--white);border-radius:var(--r);box-shadow:0 2px 14px rgba(0,0,0,0.06);
  border:1px solid var(--border);overflow:hidden;}
.chead{display:flex;align-items:flex-start;gap:10px;padding:13px 13px 11px;cursor:pointer;}
.locbadge{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:3px 7px;
  border-radius:var(--r-xs);font-size:11px;font-weight:800;white-space:nowrap;flex-shrink:0;
  margin-top:2px;font-family:monospace;background:var(--plum-light);color:var(--plum);border:1px solid var(--border-p);}
.mbadge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;}
.m-hydraulic{background:var(--pine-light);color:var(--pine);}
.m-protection{background:var(--plum-light);color:var(--plum);}
.m-blood{background:var(--rose-light);color:var(--rose);}
.m-bio{background:var(--teal-light);color:var(--teal);}
.m-misc{background:var(--amber-light);color:var(--amber);}
.m-diascan{background:var(--blue-light);color:var(--blue);}
.m-ccm{background:var(--slate-light);color:var(--slate);}
.m-swtest{background:var(--indigo-light);color:var(--indigo);}
.pbadge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;
  background:rgba(0,0,0,0.05);color:var(--text3);}
.cbody{flex:1;min-width:0;}
.ctitle{font-size:13.5px;font-weight:700;line-height:1.45;margin-bottom:6px;color:var(--text);}
.cdesc-preview{font-size:12px;color:var(--text2);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px;}
.cmeta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.chev{color:var(--text3);flex-shrink:0;margin-top:2px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.04);border-radius:50%;transition:transform .25s ease,background .15s,color .15s;}
.chev.open{transform:rotate(180deg);background:var(--plum-light);color:var(--plum);}
.cdet{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);}
.cdet.open{max-height:800px;border-top:1px solid var(--border);}
.cdet-in{padding:15px 13px 18px;background:rgba(255,250,235,0.5);}
.dsec{margin-bottom:13px;}.dsec:last-child{margin-bottom:0;}
.dlbl{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;color:var(--pine);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:7px;}
.dbox,.ubox,.rbox{font-size:13.5px;line-height:1.75;border-radius:10px;padding:11px 13px;}
.dbox{color:var(--text);background:var(--white);border:1px solid var(--border);}
.ubox{color:#7a4800;background:var(--amber-light);border:1px solid rgba(212,112,10,0.2);font-family:monospace;font-weight:600;}
.rbox{color:var(--pine);font-weight:500;background:var(--euca-light);border:1px solid rgba(108,160,122,0.25);}
mark{background:rgba(114,37,107,0.13);color:var(--plum);border-radius:2px;padding:0 1px;}
.empty{text-align:center;padding:60px 24px;color:var(--text2);display:none;}
.empty-ico{font-size:46px;margin-bottom:12px;opacity:.4;}
.empty h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.empty p{font-size:13px;}

/* ── Bottom Navigation ── */
.bnav{
  position:fixed;bottom:0;left:0;right:0;min-height:var(--nav-h);
  background:#B5CFBC;border-top:1.5px solid rgba(114,37,107,0.18);
  display:flex;align-items:flex-start;padding-top:10px;
  padding-bottom:max(env(safe-area-inset-bottom,0px),10px);z-index:200;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:3px 4px;cursor:pointer;border:none;background:none;
  font-family:inherit;-webkit-tap-highlight-color:transparent;}
.bnav-svg{width:24px;height:24px;color:rgba(114,37,107,0.4);
  transition:color .15s,transform .18s cubic-bezier(.34,1.56,.64,1);}
.bnav-label{font-size:10px;font-weight:600;color:rgba(114,37,107,0.5);font-family:inherit;}
.bnav-item.on .bnav-svg{color:var(--plum);transform:scale(1.12);}
.bnav-item.on .bnav-label{color:var(--plum);font-weight:800;}
.bnav-item:active .bnav-svg{transform:scale(0.88);}

/* ── Page Panel ── */
.tab-panel{display:none;}
.tab-panel.on{display:block;}
.page-panel-inner{padding:0 12px 20px;}
.pg-section{margin-bottom:20px;}
.pg-section-title{font-size:13px;font-weight:800;color:var(--pine);
  text-transform:uppercase;letter-spacing:1px;padding:14px 2px 8px;
  border-bottom:1.5px solid var(--border);margin-bottom:10px;}
.pg-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
.pg-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;cursor:pointer;gap:8px;
  border-bottom:1px solid var(--border);transition:background .12s;}
.pg-row:last-child{border-bottom:none;}
.pg-row:active{background:var(--plum-light);}
.pg-locat{font-size:12px;font-weight:700;color:var(--plum);font-family:monospace;min-width:42px;}
.pg-name{font-size:12px;color:var(--text);flex:1;}
.pg-unit{font-size:11px;color:var(--text3);font-family:monospace;}

/* ── Coding Panel ── */
.code-panel-inner{padding:0 12px 20px;}
.code-section{margin-bottom:18px;}
.code-section-title{font-size:14px;font-weight:800;color:var(--plum);
  padding:14px 2px 8px;border-bottom:1.5px solid var(--border-p);margin-bottom:10px;}
.code-table{width:100%;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;border-collapse:collapse;}
.code-table th{background:var(--plum);color:white;padding:8px 12px;font-size:11px;font-weight:700;text-align:left;}
.code-table td{padding:8px 12px;font-size:12px;border-bottom:1px solid var(--border);color:var(--text);}
.code-table tr:last-child td{border-bottom:none;}
.code-table tr:nth-child(even) td{background:rgba(255,250,235,0.5);}
.code-key{font-family:monospace;font-weight:700;color:var(--pine);}
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="hdr">
  <div class="hdr-top">
    <div class="wmark-wrap">
      <span class="tagline">PHOENIX · Service Manual</span>
      <span style="font-size:18px;font-weight:900;color:var(--cream);letter-spacing:0.5px;">Status Screen</span>
    </div>
    <span class="total-badge" id="totalBadge">— params</span>
  </div>
  <div class="s-wrap">
    <svg class="s-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,250,235,0.6)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="sInp" class="s-inp" type="search" placeholder="Search parameter, location code…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="s-clr" id="sClr" aria-label="Clear">✕</button>
  </div>
  <div class="s-hint">
    <span>Try:</span>
    <span class="h-ex">COND A</span>
    <span class="h-ex">1-A</span>
    <span class="h-ex">pressure</span>
    <span class="h-ex">blood flow</span>
  </div>
</div>

<!-- ── Filters ── -->
<div class="filt" id="filtEl">
  <div class="frow">
    <div class="flbl">Module</div>
    <div class="seg-row" id="modRow">
      <button class="seg on" data-v="all"><span class="sdot" style="background:#999;"></span>All</button>
      <button class="seg" data-v="hydraulic"><span class="sdot" style="background:var(--pine);"></span>Hydraulic</button>
      <button class="seg" data-v="protection"><span class="sdot" style="background:var(--plum);"></span>Protection</button>
      <button class="seg" data-v="blood"><span class="sdot" style="background:var(--rose);"></span>Blood</button>
      <button class="seg" data-v="bio"><span class="sdot" style="background:var(--teal);"></span>Bio</button>
      <button class="seg" data-v="misc"><span class="sdot" style="background:var(--amber);"></span>Misc</button>
      <button class="seg" data-v="diascan"><span class="sdot" style="background:var(--blue);"></span>DiaScan</button>
      <button class="seg" data-v="ccm"><span class="sdot" style="background:var(--slate);"></span>CCM</button>
      <button class="seg" data-v="swtest"><span class="sdot" style="background:var(--indigo);"></span>SW Test</button>
    </div>
  </div>
  <div class="frow">
    <div class="flbl">Screen Page</div>
    <div class="seg-row" id="pageRow">
      <button class="seg on" data-v="all">All Pages</button>
      <button class="seg" data-v="first">1st Page</button>
      <button class="seg" data-v="second">2nd Page</button>
      <button class="seg" data-v="third">3rd Page</button>
    </div>
  </div>
</div>

<!-- ── Status bar ── -->
<div class="sbar" id="sbarEl">Showing all parameters</div>

<!-- ── Cards (Search tab) ── -->
<div class="cards" id="cardsEl"></div>
<div class="empty" id="emptyEl">
  <div class="empty-ico">🔍</div>
  <h3>No parameters found</h3>
  <p>Try a different search term or clear the filters.</p>
</div>

<!-- ── Page View Tab ── -->
<div class="tab-panel" id="pagePanel">
  <div class="page-panel-inner" id="pagePanelInner"></div>
</div>

<!-- ── Coding Reference Tab ── -->
<div class="tab-panel" id="codePanel">
  <div class="code-panel-inner" id="codePanelInner"></div>
</div>

<!-- ── Bottom Navigation ── -->
<nav class="bnav">
  <button class="bnav-item on" onclick="switchBnav('search',this)">
    <svg class="bnav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <span class="bnav-label">Search</span>
  </button>
  <button class="bnav-item" onclick="switchBnav('page',this)">
    <svg class="bnav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
    </svg>
    <span class="bnav-label">By Page</span>
  </button>
  <button class="bnav-item" onclick="switchBnav('code',this)">
    <svg class="bnav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
    </svg>
    <span class="bnav-label">Coding</span>
  </button>
</nav>

<script>
/* ════════════════════════════════════════════
   DATA — Phoenix Status Screen Parameters
   ════════════════════════════════════════════ */
var PARAMS = [
  /* ── FIRST PAGE · Hydraulic Module (Col A) ── */
  {locat:"1-A",  param:"COND A",       module:"hydraulic",  page:"first",  desc:"Current value of final conductivity",                                  unit:"mS/cm*100",   see:""},
  {locat:"2-A",  param:"COND B",       module:"hydraulic",  page:"first",  desc:"Current value of bicarbonate conductivity",                             unit:"mS/cm*100",   see:""},
  {locat:"3-A",  param:"TEMPERAT",     module:"hydraulic",  page:"first",  desc:"Current temperature value",                                             unit:"°C*10",       see:""},
  {locat:"4-A",  param:"U.F.VALUE",    module:"hydraulic",  page:"first",  desc:"Set value of the U.F.",                                                 unit:"g/h",         see:""},
  {locat:"5-A",  param:"TOTAL U.F.",   module:"hydraulic",  page:"first",  desc:"UF total from the start of dialysis",                                   unit:"g",           see:""},
  {locat:"6-A",  param:"DIAL FLOW",    module:"hydraulic",  page:"first",  desc:"Dialysate flow read by the flow meter D1",                              unit:"ml/min",      see:""},
  {locat:"7-A",  param:"PRESS In",     module:"hydraulic",  page:"first",  desc:"Hemodialyzer inlet pressure",                                           unit:"mmHg",        see:""},
  {locat:"8-A",  param:"PRESS Out",    module:"hydraulic",  page:"first",  desc:"Hemodialyzer outlet pressure",                                          unit:"mmHg",        see:""},
  {locat:"9-A",  param:"PRESS Dr",     module:"hydraulic",  page:"first",  desc:"Drain pressure",                                                        unit:"mmHg",        see:""},
  {locat:"10-A", param:"PRESS FS",     module:"hydraulic",  page:"first",  desc:"Pre-filter clean dialysate pressure",                                   unit:"mmHg",        see:""},
  {locat:"11-A", param:"TMP CD",       module:"hydraulic",  page:"first",  desc:"Clean dialysate transmembrane pressure",                                unit:"mmHg",        see:""},
  {locat:"12-A", param:"PA FREQ",      module:"hydraulic",  page:"first",  desc:"PA pump encoder frequency value",                                       unit:"Hz",          see:""},
  {locat:"15-A", param:"PA ACTIV",     module:"hydraulic",  page:"first",  desc:"Low part: status flag of the PA pump",                                  unit:"N/A (hex.)",  see:"10.5.7"},
  {locat:"16-A", param:"PB FREQ",      module:"hydraulic",  page:"first",  desc:"PB pump encoder frequency value",                                       unit:"Hz",          see:""},
  {locat:"19-A", param:"PB ACTIV",     module:"hydraulic",  page:"first",  desc:"Low part: status flag of the PB pump",                                  unit:"N/A (hex.)",  see:"10.5.7"},
  {locat:"20-A", param:"PUF AUTOCAL",  module:"hydraulic",  page:"first",  desc:"PUF pump autocalibration phase",                                        unit:"N/A",         see:""},
  {locat:"21-A", param:"PUF ACTIV",    module:"hydraulic",  page:"first",  desc:"Low part: status flag of the UF pump",                                  unit:"N/A (hex.)",  see:"10.5.7"},
  {locat:"22-A", param:"L FEEDBACK",   module:"hydraulic",  page:"first",  desc:"Speed correction of the UF pump",                                       unit:"%",           see:""},
  {locat:"25-A", param:"UF LEV HIGH",  module:"hydraulic",  page:"first",  desc:"Low level UF burette",                                                  unit:"ON/OFF",      see:"10.5.4"},
  {locat:"26-A", param:"UF LEV LOW",   module:"hydraulic",  page:"first",  desc:"High level UF burette",                                                 unit:"ON/OFF",      see:"10.5.4"},
  {locat:"27-A", param:"PC FREQ",      module:"hydraulic",  page:"first",  desc:"Set value of the PC pump",                                              unit:"Hz",          see:""},
  {locat:"28-A", param:"PC ACTIV",     module:"hydraulic",  page:"first",  desc:"Low part: status flag of the PC pump",                                  unit:"N/A (hex.)",  see:"10.5.7"},
  {locat:"29-A", param:"PS FREQ",      module:"hydraulic",  page:"first",  desc:"PS pump encoder frequency value",                                       unit:"Hz",          see:""},
  {locat:"30-A", param:"PS ACTIV",     module:"hydraulic",  page:"first",  desc:"Low part: status flag of the PS pump",                                  unit:"N/A (hex.)",  see:"10.5.7"},
  {locat:"34-A", param:"Hyd Phase",    module:"hydraulic",  page:"first",  desc:"Hydraulic phase number of the current process",                         unit:"N/A (dec.)",  see:""},

  /* ── FIRST PAGE · Protection Module (Col B) ── */
  {locat:"1-B",  param:"COND A",       module:"protection", page:"first",  desc:"Value of the final conductivity on the protection sensor",              unit:"mS/cm*100",   see:""},
  {locat:"2-B",  param:"COND B",       module:"protection", page:"first",  desc:"Value of the bicarbonate conductivity on the protection sensor",        unit:"mS/cm*100",   see:""},
  {locat:"3-B",  param:"TEMPERAT",     module:"protection", page:"first",  desc:"Protection sensor temperature value",                                   unit:"°C*10",       see:""},
  {locat:"4-B",  param:"U.F.VALUE",    module:"protection", page:"first",  desc:"Ultrafiltration flow measured by the protection module",                unit:"g/h",         see:""},
  {locat:"6-B",  param:"DIAL FLOW",    module:"protection", page:"first",  desc:"Dialysate flow measured by the protection module",                      unit:"ml/min",      see:""},
  {locat:"7-B",  param:"PRESS In",     module:"protection", page:"first",  desc:"Hemodialyzer inlet pressure measured by the prot. module",              unit:"mmHg",        see:""},
  {locat:"8-B",  param:"PRESS Out",    module:"protection", page:"first",  desc:"Hemodialyzer outlet pressure measured by the prot. module",             unit:"mmHg",        see:""},

/* ════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════ */
var SQ = '', MF = 'all', PF = 'all';
var OS = {};

document.getElementById('totalBadge').textContent = PARAMS.length + ' params';

/* ════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function hi(s, ws){
  if(!ws||!ws.length) return esc(s);
  var r = esc(s);
  ws.forEach(function(w){
    if(!w) return;
    r = r.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  });
  return r;
}

function moduleLabel(m){
  var map = {hydraulic:'Hydraulic',protection:'Protection',blood:'Blood',
    bio:'Bio',misc:'Misc',diascan:'DiaScan',ccm:'CCM',swtest:'SW Test'};
  return map[m]||m;
}

function pageLabel(p){
  var map = {first:'1st Page',second:'2nd Page',third:'3rd Page'};
  return map[p]||p;
}

/* ════════════════════════════════════════════
   RENDER CARDS
   ════════════════════════════════════════════ */
function render(list){
  var ws = SQ ? SQ.trim().toLowerCase().split(/\s+/) : [];
  var cards = document.getElementById('cardsEl');
  var empty = document.getElementById('emptyEl');
  var sbar  = document.getElementById('sbarEl');

  if(!list.length){
    cards.innerHTML=''; cards.style.display='none'; empty.style.display='block';
    sbar.innerHTML = 'No results found';
    return;
  }
  cards.style.display=''; empty.style.display='none';

  var filtered = (MF!=='all'||PF!=='all'||SQ) ? list.length : PARAMS.length;
  if(SQ||MF!=='all'||PF!=='all'){
    sbar.innerHTML = 'Showing <b>' + list.length + '</b> of ' + PARAMS.length + ' parameters';
  } else {
    sbar.innerHTML = 'Showing all <b>' + PARAMS.length + '</b> parameters';
  }

  cards.innerHTML = list.map(function(p, i){
    var key = p.locat + '_' + p.page;
    var isOpen = OS[key];
    return '<div class="card">' +
      '<div class="chead" onclick="toggle(\''+key+'\')">' +
        '<span class="locbadge">' + esc(p.locat) + '</span>' +
        '<div class="cbody">' +
          '<div class="ctitle">' + hi(p.param, ws) + '</div>' +
          '<div class="cdesc-preview">' + hi(p.desc, ws) + '</div>' +
          '<div class="cmeta">' +
            '<span class="mbadge m-'+p.module+'">' + moduleLabel(p.module) + '</span>' +
            '<span class="pbadge">' + pageLabel(p.page) + '</span>' +
            (p.unit ? '<span class="pbadge" style="background:var(--amber-light);color:var(--amber);">' + esc(p.unit) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="chev' + (isOpen?' open':'') + '" id="chev_'+key+'">▾</div>' +
      '</div>' +
      '<div class="cdet' + (isOpen?' open':'') + '" id="det_'+key+'">' +
        '<div class="cdet-in">' +
          '<div class="dsec">' +
            '<div class="dlbl">▸ Description</div>' +
            '<div class="dbox">' + hi(p.desc, ws) + '</div>' +
          '</div>' +
          (p.unit ? '<div class="dsec"><div class="dlbl">▸ Unit</div><div class="ubox">' + esc(p.unit) + '</div></div>' : '') +
          (p.see  ? '<div class="dsec"><div class="dlbl">▸ See Paragraph</div><div class="rbox">§ ' + esc(p.see) + '</div></div>' : '') +
          '<div class="dsec"><div class="dlbl">▸ Location</div>' +
            '<div class="dbox">Screen Page: <b>' + pageLabel(p.page) + '</b> &nbsp;|&nbsp; Column: <b>' + esc(p.locat.split('-')[1]) + '</b> &nbsp;|&nbsp; Row: <b>' + esc(p.locat.split('-')[0]) + '</b></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function toggle(key){
  var det  = document.getElementById('det_'+key);
  var chev = document.getElementById('chev_'+key);
  if(!det) return;
  if(OS[key]){OS[key]=0;det.classList.remove('open');if(chev)chev.classList.remove('open');}
  else{OS[key]=1;det.classList.add('open');if(chev)chev.classList.add('open');}
}

/* ════════════════════════════════════════════
   SEARCH + FILTER
   ════════════════════════════════════════════ */
function go(){
  var ws = SQ ? SQ.trim().toLowerCase().split(/\s+/) : [];
  var list = PARAMS.slice();
  if(MF !== 'all') list = list.filter(function(p){ return p.module === MF; });
  if(PF !== 'all') list = list.filter(function(p){ return p.page   === PF; });
  if(ws.length) list = list.filter(function(p){
    var h = [p.locat, p.param, p.desc, p.unit, p.see].join(' ').toLowerCase();
    return ws.every(function(w){ return h.indexOf(w) >= 0; });
  });
  OS = {};
  render(list);
}

var sInp = document.getElementById('sInp');
var sClr = document.getElementById('sClr');
sInp.addEventListener('input', function(){ SQ = sInp.value; sClr.className = SQ.length ? 's-clr show' : 's-clr'; go(); });
sClr.addEventListener('click', function(){ sInp.value=''; SQ=''; sClr.className='s-clr'; go(); });

document.getElementById('modRow').addEventListener('click', function(e){
  var b = e.target; while(b && !b.classList.contains('seg')) b = b.parentElement;
  if(!b) return;
  document.querySelectorAll('#modRow .seg').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on'); MF = b.getAttribute('data-v'); go();
});

document.getElementById('pageRow').addEventListener('click', function(e){
  var b = e.target; while(b && !b.classList.contains('seg')) b = b.parentElement;
  if(!b) return;
  document.querySelectorAll('#pageRow .seg').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on'); PF = b.getAttribute('data-v'); go();
});

/* ════════════════════════════════════════════
   BY PAGE VIEW
   ════════════════════════════════════════════ */
function renderPageView(){
  var sections = [
    {key:'first',  label:'Status Screen — 1st Page'},
    {key:'second', label:'Status Screen — 2nd Page'},
    {key:'third',  label:'Status Screen — 3rd Page'}
  ];
  var modules_order = ['hydraulic','protection','blood','bio','misc','diascan','ccm','swtest'];

  var html = '';
  sections.forEach(function(sec){
    html += '<div class="pg-section"><div class="pg-section-title">' + sec.label + '</div>';
    modules_order.forEach(function(mod){
      var rows = PARAMS.filter(function(p){ return p.page===sec.key && p.module===mod; });
      if(!rows.length) return;
      html += '<div style="font-size:10px;font-weight:800;color:var(--text3);letter-spacing:1px;text-transform:uppercase;padding:8px 2px 4px;">' + moduleLabel(mod) + ' Module</div>';
      html += '<div class="pg-list">';
      rows.forEach(function(p){
        html += '<div class="pg-row" onclick="jumpToParam(\''+p.locat+'_'+p.page+'\')">' +
          '<span class="pg-locat">' + esc(p.locat) + '</span>' +
          '<span class="pg-name">' + esc(p.param) + ' <span style="font-size:11px;color:var(--text3);">— '+esc(p.desc.substring(0,50))+(p.desc.length>50?'…':'')+'</span></span>' +
          '<span class="pg-unit">' + esc(p.unit||'') + '</span>' +
        '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('pagePanelInner').innerHTML = html;
}

function jumpToParam(key){
  switchBnav('search', document.querySelector('.bnav-item'));
  setTimeout(function(){
    var el = document.getElementById('det_'+key);
    if(el){ el.closest('.card').scrollIntoView({behavior:'smooth',block:'center'}); }
    else{
      // open that key
      OS[key]=1; go();
      setTimeout(function(){
        var el2 = document.getElementById('det_'+key);
        if(el2) el2.closest('.card').scrollIntoView({behavior:'smooth',block:'center'});
      },400);
    }
  },100);
}

/* ════════════════════════════════════════════
   CODING REFERENCE VIEW
   ════════════════════════════════════════════ */
function renderCodeView(){
  var html = '';
  CODING.forEach(function(sec){
    html += '<div class="code-section">';
    html += '<div class="code-section-title">' + esc(sec.title) + '</div>';
    html += '<table class="code-table"><thead><tr><th style="width:35%">Value / Key</th><th>Meaning</th></tr></thead><tbody>';
    sec.rows.forEach(function(row){
      html += '<tr><td class="code-key">' + esc(row.key) + '</td><td>' + esc(row.val) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  });
  document.getElementById('codePanelInner').innerHTML = html;
}

/* ════════════════════════════════════════════
   TAB SWITCH
   ════════════════════════════════════════════ */
function switchBnav(tab, el){
  document.querySelectorAll('.bnav-item').forEach(function(b){ b.classList.remove('on'); });
  if(el) el.classList.add('on');

  var isSearch = (tab === 'search');
  var filtEl   = document.getElementById('filtEl');
  var sbarEl   = document.getElementById('sbarEl');
  var cardsEl  = document.getElementById('cardsEl');
  var emptyEl  = document.getElementById('emptyEl');

  filtEl.style.display  = isSearch ? '' : 'none';
  sbarEl.style.display  = isSearch ? '' : 'none';
  cardsEl.style.display = isSearch ? '' : 'none';
  emptyEl.style.display = 'none';

  document.getElementById('pagePanel').classList.toggle('on', tab==='page');
  document.getElementById('codePanel').classList.toggle('on', tab==='code');

  if(tab === 'page')   renderPageView();
  if(tab === 'code')   renderCodeView();
  if(tab === 'search'){ cardsEl.style.display=''; go(); }
}

/* ════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════ */
go();
</script>
