<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작업 일정 등록 · Vantive</title>
<style>
:root {
  --plum:        #72256B;
  --plum-d:      #5C1B56;
  --plum-light:  rgba(114,37,107,0.09);
  --plum-mid:    rgba(114,37,107,0.20);
  --cream:       #FFFAEB;
  --cream-mid:   #F5EDD8;
  --pine:        #105742;
  --euca:        #6CA07A;
  --white:       #FFFFFF;
  --text:        #1C1C1E;
  --text2:       #52525B;
  --text3:       #A1A1AA;
  --border:      rgba(0,0,0,0.07);
  --border-p:    rgba(114,37,107,0.14);
  --shadow:      0 2px 14px rgba(0,0,0,0.06);
  --shadow-md:   0 6px 24px rgba(0,0,0,0.10);
  --r:    14px;
  --r-sm:  9px;
  --r-xs:  5px;
  --ok:    #157347;
  --err:   #C0392B;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
  background: var(--cream); color: var(--text);
  font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased;
}
.header {
  background: linear-gradient(150deg, var(--plum-d) 0%, var(--plum) 60%, #8B3080 100%);
  padding: 18px 18px 16px; position: sticky; top: 0; z-index: 100;
}
.header-inner { max-width: 640px; margin: 0 auto; }
.h-title h1 { color: var(--cream); font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
.h-title .sub { color: rgba(255,250,235,0.65); font-size: 11.5px; font-weight: 500; margin-top: 3px; }

.wrap { max-width: 640px; margin: 0 auto; padding: 20px 14px 48px; }

.card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--r); box-shadow: var(--shadow);
  padding: 20px 18px;
}

.field { margin-bottom: 15px; }
.field label {
  display: block; font-size: 12.5px; font-weight: 700; color: var(--plum);
  margin-bottom: 6px; letter-spacing: -.1px;
}
.field label .req { color: var(--err); margin-left: 2px; }
.field input, .field select, .field textarea {
  width: 100%; font-family: inherit; font-size: 14px; color: var(--text);
  padding: 10px 12px; border: 1px solid var(--border-p); border-radius: var(--r-sm);
  background: var(--white); transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--plum);
  box-shadow: 0 0 0 3px var(--plum-light);
}
.field textarea { resize: vertical; min-height: 62px; }
.field .hint { font-size: 11px; color: var(--text3); margin-top: 4px; }

.row { display: flex; gap: 12px; }
.row .field { flex: 1; }

.err-text {
  display: none; font-size: 11.5px; color: var(--err); margin-top: 5px; font-weight: 600;
}
.err-text.show { display: block; }

.btn {
  width: 100%; margin-top: 6px; padding: 13px; border: none; cursor: pointer;
  border-radius: var(--r-sm); font-family: inherit; font-size: 15px; font-weight: 700;
  background: var(--plum); color: var(--cream); letter-spacing: .2px;
  box-shadow: var(--shadow); transition: background .15s, opacity .15s;
}
.btn:hover { background: var(--plum-d); }
.btn:disabled { opacity: .55; cursor: default; }

.notice {
  display: none; border-radius: var(--r-sm); padding: 11px 14px;
  font-size: 13px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.notice.show { display: block; }
.notice.warn { background: #FFF7E6; border: 1px solid #F5D9A0; border-left: 4px solid #E0A82E; color: #7a5a12; }
.notice.err  { background: #FDECEA; border: 1px solid #F3C4BE; border-left: 4px solid var(--err); color: #8a271d; }

/* Success panel */
.done {
  display: none; text-align: center; padding: 8px 6px 4px;
}
.done.show { display: block; }
.done .ico {
  width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%;
  background: rgba(21,115,71,0.12); display: flex; align-items: center; justify-content: center;
}
.done .ico svg { width: 30px; height: 30px; stroke: var(--ok); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.done h2 { font-size: 17px; font-weight: 800; color: var(--pine); margin-bottom: 6px; }
.done p { font-size: 13px; color: var(--text2); margin-bottom: 16px; line-height: 1.5; }
.done .links { display: flex; flex-direction: column; gap: 9px; }
.done .lnk {
  display: block; padding: 11px 14px; border-radius: var(--r-sm);
  border: 1px solid var(--border-p); background: var(--plum-light);
  color: var(--plum); font-weight: 700; font-size: 13.5px; text-decoration: none;
  transition: background .15s;
}
.done .lnk:hover { background: var(--plum-mid); }
.done .lnk.ghost { background: var(--white); color: var(--text2); font-weight: 600; }
/* 내 캘린더 저장 (휴가 등록 완료 화면과 동일한 구성) */
.done .cal-row { display: flex; gap: 8px; }
.done .cal-row .lnk { flex: 1; text-align: center; }
.done .cal-hint { margin: -2px 0 2px; font-size: 12px; color: var(--text2); line-height: 1.5; }
@media (max-width: 420px) { .done .cal-row { flex-direction: column; } }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="h-title">
      <h1>작업 일정 등록</h1>
      <div class="sub">담당자 작업 일정을 등록하면 지역별 작업 일정 캘린더에 표시됩니다 · Vantive Techwiki</div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="notice"></div>

  <div class="card" id="form-card">
    <div class="field">
      <label for="f-worker">담당자<span class="req">*</span></label>
      <input type="text" id="f-worker" maxlength="50" placeholder="이름" autocomplete="off">
      <div class="err-text" id="e-worker">담당자 이름을 입력하세요.</div>
    </div>

    <div class="field">
      <label for="f-place">거래처 / 병원명<span class="req">*</span></label>
      <input type="text" id="f-place" maxlength="80" placeholder="예: OO병원" autocomplete="off">
      <div class="err-text" id="e-place">거래처를 입력하세요.</div>
    </div>

    <div class="field">
      <label for="f-content">작업 내용<span class="req">*</span></label>
      <textarea id="f-content" maxlength="200" placeholder="예: 정기 점검, 소모품 교체 등"></textarea>
      <div class="err-text" id="e-content">작업 내용을 입력하세요.</div>
    </div>

    <div class="field">
      <label for="f-region">지역<span class="req">*</span></label>
      <select id="f-region">
        <option value="seoul">서울</option>
        <option value="djgj">대전·광주</option>
        <option value="bsdg">부산·대구</option>
      </select>
    </div>

    <div class="row">
      <div class="field">
        <label for="f-start">시작일<span class="req">*</span></label>
        <input type="date" id="f-start">
      </div>
      <div class="field">
        <label for="f-end">종료일<span class="req">*</span></label>
        <input type="date" id="f-end">
        <div class="hint">하루면 시작일과 동일하게 두세요.</div>
      </div>
    </div>
    <div class="err-text" id="e-date">종료일은 시작일보다 빠를 수 없습니다.</div>

    <button class="btn" id="btn-save">작업 일정 등록</button>
  </div>

  <div class="card done" id="done-card">
    <div class="ico"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    <h2>등록되었습니다</h2>
    <p id="done-msg"></p>
    <div class="links">
      <a class="lnk" id="done-cal" href="#">해당 지역 작업 일정 캘린더 보기 →</a>
      <div class="cal-row">
        <a class="lnk" id="done-ics" href="#" download>내 캘린더에 추가 (.ics)</a>
        <a class="lnk" id="done-gcal" href="#" target="_blank" rel="noopener">Google 캘린더에 추가</a>
      </div>
      <p class="cal-hint">내 휴대폰·아웃룩 캘린더에 이 작업 일정을 종일 일정으로 저장합니다.</p>
      <a class="lnk ghost" id="done-again" href="#">작업 일정 추가 등록</a>
    </div>
  </div>
</main>

<!-- Firebase compat SDK (vacation-qr 프로젝트 전용 — 의견게시판 config 아님) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';

/* ── Config: vacation-qr Firebase 프로젝트 (annual_leave_calendar.html과 동일) ── */
const FIREBASE_CONFIG = {
  apiKey:            'AIzaSyDpMjh7trMGz6D-W9If2YCgPHXNzgBVl6k',
  authDomain:        'vantive-annual-leave.firebaseapp.com',
  projectId:         'vantive-annual-leave',
  storageBucket:     'vantive-annual-leave.firebasestorage.app',
  messagingSenderId: '1050871221334',
  appId:             '1:1050871221334:web:8e1d96cc64d5011d997ff7',
};

const REGIONS = { seoul: '서울', djgj: '대전·광주', bsdg: '부산·대구' };

const $ = id => document.getElementById(id);
let db = null, dbAvailable = false;

(function initFirebase() {
  try {
    if (typeof firebase === 'undefined') throw new Error('SDK not loaded');
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    dbAvailable = true;
  } catch (e) { dbAvailable = false; }
})();

function showNotice(kind, msg) {
  const n = $('notice');
  n.className = 'notice show ' + kind;
  n.textContent = msg;
}
function hideNotice() { $('notice').className = 'notice'; }

if (!dbAvailable) {
  showNotice('warn', '데이터베이스에 연결할 수 없습니다. 네트워크 연결을 확인한 뒤 새로고침해 주세요. (등록이 저장되지 않을 수 있습니다)');
}

/* 기본 날짜: 오늘 */
(function initDates() {
  const pad = n => String(n).padStart(2, '0');
  const t = new Date();
  const today = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
  $('f-start').value = today;
  $('f-end').value = today;
})();

function clearErrors() {
  ['e-worker', 'e-place', 'e-content', 'e-date'].forEach(id => $(id).classList.remove('show'));
}

$('btn-save').addEventListener('click', () => {
  clearErrors();
  hideNotice();

  const workerName = $('f-worker').value.trim();
  const place      = $('f-place').value.trim();
  const content    = $('f-content').value.trim();
  const region     = $('f-region').value;
  const startDate  = $('f-start').value;
  const endDate    = $('f-end').value;

  let ok = true;
  if (!workerName) { $('e-worker').classList.add('show'); ok = false; }
  if (!place)      { $('e-place').classList.add('show'); ok = false; }
  if (!content)    { $('e-content').classList.add('show'); ok = false; }
  if (!startDate || !endDate) { $('e-date').textContent = '시작일과 종료일을 모두 선택하세요.'; $('e-date').classList.add('show'); ok = false; }
  else if (endDate < startDate) { $('e-date').textContent = '종료일은 시작일보다 빠를 수 없습니다.'; $('e-date').classList.add('show'); ok = false; }
  if (!REGIONS[region]) { ok = false; }
  if (!ok) return;

  if (!dbAvailable) {
    showNotice('err', '데이터베이스에 연결할 수 없어 등록하지 못했습니다. 네트워크 연결을 확인해 주세요.');
    return;
  }

  const btn = $('btn-save');
  btn.disabled = true;
  btn.textContent = '등록 중…';

  // data-schema.md work_schedules: hasOnly [workerName, place, content, region, startDate, endDate, createdAt]
  const payload = {
    workerName: workerName,
    place:      place,
    content:    content,
    region:     region,
    startDate:  startDate,
    endDate:    endDate,
    createdAt:  new Date().toISOString(),
  };

  db.collection('work_schedules').add(payload)
    .then((ref) => {
      $('form-card').style.display = 'none';
      $('done-msg').textContent =
        REGIONS[region] + ' · ' + workerName + ' · ' + place +
        ' (' + startDate + (startDate === endDate ? '' : ' ~ ' + endDate) + ')';
      $('done-cal').setAttribute('href', 'work_schedule_calendar.html?r=' + region);
      setupCalendarLinks({
        uid: (ref && ref.id ? ref.id : String(Date.now())) + '@vantive-techwiki',
        workerName: workerName, place: place, content: content,
        region: region, startDate: startDate, endDate: endDate,
      });
      $('done-card').classList.add('show');
      window.scrollTo(0, 0);
    })
    .catch(err => {
      btn.disabled = false;
      btn.textContent = '작업 일정 등록';
      showNotice('err', err && err.code === 'permission-denied'
        ? '등록 권한이 아직 설정되지 않았습니다. (관리자: firestore.rules의 work_schedules 규칙 배포 필요)'
        : '등록에 실패했습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.');
    });
});

/* ── 내 캘린더에 저장 (.ics + Google) ──────────────
 * 휴가 등록 앱(vacation-qr/src/lib/ics.js)과 동일 규약:
 * 종일 이벤트이며 ICS의 DTEND는 exclusive이므로 항상 종료일+1일을 쓴다.
 * 날짜 연산은 UTC 기준으로만 해 타임존 영향을 배제한다. */
function addOneDay(dateStr) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + 1);
  return d.toISOString().slice(0, 10);
}
function toBasicDate(dateStr) { return dateStr.split('-').join(''); }
function escapeIcsText(text) {
  return String(text)
    .split('\\').join('\\\\')
    .split(';').join('\\;')
    .split(',').join('\\,')
    .split('\n').join('\\n');
}
function buildIcs(o) {
  const dtstamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Vantive//Techwiki Work Schedule//KO',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:' + o.uid,
    'DTSTAMP:' + dtstamp,
    'DTSTART;VALUE=DATE:' + toBasicDate(o.startDate),
    'DTEND;VALUE=DATE:' + toBasicDate(addOneDay(o.endDate)),
    'SUMMARY:' + escapeIcsText(o.title),
    'DESCRIPTION:' + escapeIcsText(o.description),
    'LOCATION:' + escapeIcsText(o.location),
    'END:VEVENT',
    'END:VCALENDAR',
  ].join('\r\n');
}
let icsObjectUrl = null;
function setupCalendarLinks(s) {
  const title = '[작업] ' + s.place + ' · ' + s.content;
  const description =
    '담당자: ' + s.workerName + '\n' +
    '거래처: ' + s.place + '\n' +
    '작업 내용: ' + s.content + '\n' +
    '지역: ' + REGIONS[s.region] + '\n' +
    'Vantive Techwiki 작업 일정';

  // .ics 다운로드 (Blob URL — 이전 URL은 해제해 누수 방지)
  const ics = buildIcs({
    uid: s.uid, title: title, description: description,
    location: s.place, startDate: s.startDate, endDate: s.endDate,
  });
  if (icsObjectUrl) URL.revokeObjectURL(icsObjectUrl);
  icsObjectUrl = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = $('done-ics');
  a.setAttribute('href', icsObjectUrl);
  a.setAttribute('download', 'vantive-work-' + toBasicDate(s.startDate) + '.ics');

  // Google 캘린더 (dates: YYYYMMDD/YYYYMMDD+1 — 종일, 종료 exclusive)
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    details: description,
    location: s.place,
    dates: toBasicDate(s.startDate) + '/' + toBasicDate(addOneDay(s.endDate)),
  });
  $('done-gcal').setAttribute('href',
    'https://calendar.google.com/calendar/render?' + params.toString());
}

$('done-again').addEventListener('click', (e) => {
  e.preventDefault();
  $('f-worker').value = '';
  $('f-place').value = '';
  $('f-content').value = '';
  const btn = $('btn-save');
  btn.disabled = false;
  btn.textContent = '작업 일정 등록';
  $('done-card').classList.remove('show');
  $('form-card').style.display = 'block';
  window.scrollTo(0, 0);
});
</script>
</body>
</html>
